<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="引っぱって離すだけのひっぱりアクション。反射と貫通、2種類の撃ち方で敵を倒す。" />
<title>ひっぱりストライク</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101a33'/%3E%3Ccircle cx='13' cy='19' r='8' fill='%2334b4ff' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M19 13l8-8' stroke='%23ffd166' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  [hidden] { display: none !important; }
  :root {
    --bg: #070b18; --panel: rgba(18, 28, 56, .82); --line: rgba(140, 180, 255, .22);
    --text: #eef3ff; --muted: #9fb0d6; --gold: #ffd166;
    --reflect: #3cc8ff; --pierce: #ff7a45;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { overflow: hidden;
    background-image: radial-gradient(80% 50% at 50% -10%, rgba(60, 110, 230, .35), transparent 70%); }
  #app { height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto;
    max-width: 720px; margin: 0 auto; padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom)); gap: 8px; }

  .hud { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .brand { font-weight: 900; letter-spacing: .08em; font-size: 15px; white-space: nowrap; }
  .brand b { color: var(--gold); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
  .chip .label { color: var(--muted); font-size: 11px; letter-spacing: .08em; }
  #turn { font-weight: 800; font-variant-numeric: tabular-nums; }
  .type { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 6px; color: #06101f; }
  .type.reflect { background: var(--reflect); }
  .type.pierce { background: var(--pierce); }
  .spacer { flex: 1; }
  button { font: inherit; font-size: 12px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button[aria-pressed="false"] { color: var(--muted); }

  #stage { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #field { display: block; touch-action: none; border-radius: 14px; cursor: grab;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .05); }
  #field.pulling { cursor: grabbing; }

  .teamhp { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .teamhp .label { color: var(--muted); font-size: 11px; letter-spacing: .08em; font-weight: 800; }
  .teamhp .bar { position: relative; flex: 1; height: 12px; border-radius: 999px; overflow: hidden;
    background: rgba(255, 255, 255, .08); border: 1px solid var(--line); }
  #hp-fill { position: absolute; inset: 0 auto 0 0; width: 100%; border-radius: inherit;
    background: linear-gradient(90deg, #3ddc84, #b6f36b); transition: width .35s ease-out; }
  #hp-fill.mid { background: linear-gradient(90deg, #f0b429, #ffd166); }
  #hp-fill.low { background: linear-gradient(90deg, #ff4d4d, #ff8a65); }
  #hp-text { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 9.5em; text-align: right; }

  #result { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 3;
    background: rgba(4, 7, 16, .6); backdrop-filter: blur(2px); }
  #result .card { text-align: center; padding: 24px 28px; border-radius: 18px; background: rgba(12, 20, 44, .95);
    border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(0, 0, 0, .6); min-width: 240px; }
  #result h2 { margin: 0 0 8px; font-size: 28px; letter-spacing: .08em; }
  #result h2.won { color: var(--gold); }
  #result h2.lost { color: #ff6b6b; }
  #result p { margin: 0 0 16px; color: var(--muted); font-size: 13px; line-height: 1.8; }
  #result button { font-size: 14px; padding: 10px 22px; border-color: var(--gold); }

  .help { margin: 0; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.6; min-height: 1.6em; }
  .help b { color: var(--text); }

  #tune { position: absolute; top: 8px; right: 8px; width: min(300px, calc(100% - 16px)); max-height: calc(100% - 16px);
    overflow: auto; padding: 12px 14px; border-radius: 14px; background: rgba(10, 16, 34, .94);
    border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0, 0, 0, .5); font-size: 12px; z-index: 2; }
  #tune h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: .06em; }
  #tune label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 8px 0; color: var(--muted); }
  #tune label output { color: var(--text); font-variant-numeric: tabular-nums; }
  #tune input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--gold); }
  #tune .row { display: flex; gap: 8px; margin-top: 10px; }
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="brand">HIPPARI <b>STRIKE</b></div>
    <div class="chip"><span class="label">TURN</span><span id="turn">1</span></div>
    <div class="chip"><span class="label">WAVE</span><span id="wave">1/2</span></div>
    <div class="chip"><span class="label">NEXT</span><span id="active-name">A</span><span id="active-type" class="type reflect">反射</span></div>
    <div class="spacer"></div>
    <button id="btn-sound" type="button" aria-pressed="true">音 ON</button>
    <button id="btn-tune" type="button" aria-expanded="false">調整</button>
    <button id="btn-reset" type="button">リセット</button>
  </header>

  <div class="teamhp"><span class="label">HP</span><div class="bar"><div id="hp-fill"></div></div><span id="hp-text"></span></div>

  <main id="stage">
    <canvas id="field" aria-label="フィールド。キャラを引っぱって離すと発射します"></canvas>
    <aside id="tune" hidden>
      <h2>手触りの調整</h2>
      <div id="tune-list"></div>
      <div class="row"><button id="btn-tune-default" type="button">初期値に戻す</button><button id="btn-tune-close" type="button">閉じる</button></div>
    </aside>
    <div id="result" hidden>
      <div class="card">
        <h2 id="result-title"></h2>
        <p id="result-text"></p>
        <button id="btn-retry" type="button">もう一度</button>
      </div>
    </div>
  </main>

  <p class="help" id="help"></p>
</div>

<!--
  物理エンジン（DOM にも Canvas にも触らない純粋なモジュール）。
  tests/logic はこの ms-physics のスクリプトだけを取り出して Node で検証する。
-->
<script id="ms-physics">
(function (root) {
  'use strict';

  /**
   * 手触りを決める数値はすべてここに集める。
   * 単位: 長さ = フィールドの論理px、時間 = 秒。
   */
  var DEFAULTS = {
    field: { w: 540, h: 800 },
    step: 1 / 240,                        // 固定タイムステップ。1ステップの移動量が半径より十分小さいこと
    pull: { dead: 16, max: 170 },         // これ未満の引きはキャンセル / これ以上引いても強さは同じ
    speed: { min: 450, max: 2200 },       // 初速（引き最小〜最大）
    friction: { linear: 140, drag: 0.2 }, // 減速度 = linear + drag × 速さ
    stopSpeed: 24,                        // これを下回ったら停止
    wall: { restitution: 0.88 },          // 壁に当たるたびに残る速さの割合
    reflect: { restitution: 0.84 },       // 反射タイプがキャラ・敵に当たるたびに残る速さの割合
    pierce: { enterFactor: 0.7, insideDrag: 2.5 }, // 貫通: 突入時に残る速さ / 通り抜けている間の摩擦倍率
    gravity: { enterFactor: 0.55, drag: 3 }        // 重力バリア: 入った瞬間に残る速さ / 中にいる間の摩擦倍率
  };

  function isObj(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function mergeDeep(base, over) {
    var out = {};
    var k;
    for (k in base) if (Object.prototype.hasOwnProperty.call(base, k)) out[k] = isObj(base[k]) ? mergeDeep(base[k], {}) : base[k];
    if (over) {
      for (k in over) {
        if (!Object.prototype.hasOwnProperty.call(over, k)) continue;
        out[k] = isObj(over[k]) && isObj(out[k]) ? mergeDeep(out[k], over[k]) : over[k];
      }
    }
    return out;
  }

  /**
   * 引っぱり量（押した点 → 今の指の位置）から初速を求める。
   * 発射方向は引いた向きの逆。引きが短すぎるときは null（キャンセル）。
   */
  function launchVelocity(cfg, dx, dy) {
    var len = Math.hypot(dx, dy);
    if (!(len >= cfg.pull.dead)) return null;
    var power = Math.min(1, (len - cfg.pull.dead) / (cfg.pull.max - cfg.pull.dead));
    var sp = cfg.speed.min + (cfg.speed.max - cfg.speed.min) * power;
    return { vx: -dx / len * sp, vy: -dy / len * sp, power: power, speed: sp };
  }

  /**
   * フィールド上の物体。動くのは円だけ。止まっている側は円か矩形（軸に平行）。
   *  kind    : 'unit'（自キャラ） / 'enemy' / 'target'
   *  shot    : 'reflect' | 'pierce'（unit のみ）
   *  shape   : 'circle'（x, y, r） | 'rect'（x, y が中心、w, h）
   *  sensors : 当たり判定を持たない円（弱点）。[{ id, dx, dy, r }]（中心からの位置）
   *  abilities: { antiGravity: true } など。動きに効くアビリティだけを物理が見る
   */
  function Body(o) {
    this.id = o.id;
    this.kind = o.kind || 'unit';
    this.shot = o.shot || null;
    this.shape = o.shape || 'circle';
    this.x = o.x; this.y = o.y;
    this.w = o.w || 0; this.h = o.h || 0;
    this.r = o.r != null ? o.r : Math.hypot(this.w, this.h) / 2;
    this.sensors = o.sensors || null;
    this.vx = 0; this.vy = 0;
    this.moving = false;
    this.traveled = 0;
    this.overlaps = {};   // 貫通中の相手 id（突入の瞬間だけ減速するため）
    this.sensing = {};    // 通過中の弱点（'相手id#弱点id'）
    this.fieldsIn = {};   // 中にいる重力バリアの id
    this.abilities = o.abilities || {};
    this.data = o.data || {};
  }

  /**
   * 動く円 b と、止まっている物体 o の重なり。重なっていなければ null。
   *  nx, ny : o から b へ向かう法線（b を押し出す向き）
   *  depth  : めり込み量
   *  px, py : o の表面上の接触点
   */
  function contact(b, o) {
    var dx, dy, d2, d;
    if (o.shape === 'rect') {
      var hx = o.w / 2, hy = o.h / 2;
      var cx = Math.max(o.x - hx, Math.min(b.x, o.x + hx));
      var cy = Math.max(o.y - hy, Math.min(b.y, o.y + hy));
      dx = b.x - cx; dy = b.y - cy;
      d2 = dx * dx + dy * dy;
      if (d2 >= b.r * b.r) return null;
      if (d2 > 1e-12) {
        d = Math.sqrt(d2);
        return { nx: dx / d, ny: dy / d, depth: b.r - d, px: cx, py: cy };
      }
      // 中心が矩形の内側にある: いちばん近い辺から外へ出す
      var l = b.x - (o.x - hx), r = (o.x + hx) - b.x, t = b.y - (o.y - hy), btm = (o.y + hy) - b.y;
      var m = Math.min(l, r, t, btm);
      if (m === l) return { nx: -1, ny: 0, depth: l + b.r, px: o.x - hx, py: b.y };
      if (m === r) return { nx: 1, ny: 0, depth: r + b.r, px: o.x + hx, py: b.y };
      if (m === t) return { nx: 0, ny: -1, depth: t + b.r, px: b.x, py: o.y - hy };
      return { nx: 0, ny: 1, depth: btm + b.r, px: b.x, py: o.y + hy };
    }
    dx = b.x - o.x; dy = b.y - o.y;
    var min = b.r + o.r;
    d2 = dx * dx + dy * dy;
    if (d2 >= min * min) return null;
    d = Math.sqrt(d2);
    var nx, ny;
    if (d > 1e-6) { nx = dx / d; ny = dy / d; }
    else {
      var s = Math.hypot(b.vx, b.vy);
      if (s > 0) { nx = -b.vx / s; ny = -b.vy / s; } else { nx = 0; ny = -1; }
    }
    return { nx: nx, ny: ny, depth: min - d, px: o.x + nx * o.r, py: o.y + ny * o.r };
  }

  /** 接触点 (px, py) が o の弱点の上なら、その弱点の id。 */
  function weakAt(o, px, py) {
    if (!o.sensors) return null;
    for (var i = 0; i < o.sensors.length; i++) {
      var s = o.sensors[i];
      if (Math.hypot(px - (o.x + s.dx), py - (o.y + s.dy)) <= s.r + 4) return s.id;
    }
    return null;
  }

  Body.prototype.speed = function () { return Math.hypot(this.vx, this.vy); };

  function World(cfg) {
    this.cfg = mergeDeep(DEFAULTS, cfg || {});
    this.bodies = [];
    this.fields = [];     // 重力バリア [{ id, x, y, r }]。当たり判定は無く、中を通ると減速する
    this.events = [];
    this.time = 0;
  }

  /** 重力バリアを置き換える（ウェーブごとに変わる） */
  World.prototype.setFields = function (list) {
    this.fields = list ? list.slice() : [];
    for (var i = 0; i < this.bodies.length; i++) this.bodies[i].fieldsIn = {};
  };

  World.prototype.add = function (o) {
    var b = o instanceof Body ? o : new Body(o);
    this.bodies.push(b);
    return b;
  };

  /** 取り除く（倒した敵など）。通過中の記録も消す（残すと貫通中の摩擦がかかり続ける）。 */
  World.prototype.remove = function (id) {
    var prefix = id + '#';
    this.bodies = this.bodies.filter(function (b) { return b.id !== id; });
    for (var i = 0; i < this.bodies.length; i++) {
      var b = this.bodies[i];
      delete b.overlaps[id];
      for (var k in b.sensing) if (k.indexOf(prefix) === 0) delete b.sensing[k];
    }
  };

  World.prototype.get = function (id) {
    for (var i = 0; i < this.bodies.length; i++) if (this.bodies[i].id === id) return this.bodies[i];
    return null;
  };

  World.prototype.isSettled = function () {
    for (var i = 0; i < this.bodies.length; i++) if (this.bodies[i].moving) return false;
    return true;
  };

  World.prototype.drainEvents = function () {
    var ev = this.events;
    this.events = [];
    return ev;
  };

  World.prototype._emit = function (type, b, extra) {
    var ev = { type: type, id: b.id, x: b.x, y: b.y, t: this.time };
    if (extra) for (var k in extra) ev[k] = extra[k];
    this.events.push(ev);
  };

  /** 速度を直接与えて動かす。 */
  World.prototype.setVelocity = function (id, vx, vy) {
    var b = this.get(id);
    if (!b) return false;
    b.vx = vx; b.vy = vy;
    b.moving = true;
    b.traveled = 0;
    b.overlaps = {};
    b.sensing = {};
    b.fieldsIn = {};
    this._emit('launch', b, { speed: Math.hypot(vx, vy) });
    return true;
  };

  /** 引っぱり量で弾く。引きが足りなければ false（ターンを消費しない）。 */
  World.prototype.launch = function (id, pullDx, pullDy) {
    var v = launchVelocity(this.cfg, pullDx, pullDy);
    if (!v) return null;
    this.setVelocity(id, v.vx, v.vy);
    return v;
  };

  World.prototype.step = function (dt) {
    dt = dt || this.cfg.step;
    this.time += dt;
    for (var i = 0; i < this.bodies.length; i++) {
      if (this.bodies[i].moving) this._advance(this.bodies[i], dt);
    }
  };

  World.prototype._advance = function (b, dt) {
    var c = this.cfg;
    var sp = Math.hypot(b.vx, b.vy);
    var inside = false, heavy = false, k;
    for (k in b.overlaps) { inside = true; break; }
    for (k in b.fieldsIn) if (b.fieldsIn[k]) { heavy = true; break; }
    var drag = c.friction.drag * Math.max(inside ? c.pierce.insideDrag : 1, heavy ? c.gravity.drag : 1);
    var next = sp - (c.friction.linear + drag * sp) * dt;
    if (next <= c.stopSpeed) { this._stop(b); return; }

    var s = next / sp;
    b.vx *= s; b.vy *= s;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.traveled += next * dt;

    this._walls(b);
    this._collide(b);
    if (this.fields.length) this._fields(b);
  };

  /**
   * 重力バリア: 入った瞬間に大きく減速し、中にいる間は摩擦が強い。
   * アンチ重力バリアを持つキャラは影響を受けない（演出のために blocked 付きで知らせる）。
   */
  World.prototype._fields = function (b) {
    for (var i = 0; i < this.fields.length; i++) {
      var f = this.fields[i];
      var inside = Math.hypot(b.x - f.x, b.y - f.y) < f.r + b.r * 0.5;
      if (inside && !(f.id in b.fieldsIn)) {
        var blocked = !!b.abilities.antiGravity;
        if (!blocked) {
          b.fieldsIn[f.id] = true;
          b.vx *= this.cfg.gravity.enterFactor;
          b.vy *= this.cfg.gravity.enterFactor;
        } else {
          b.fieldsIn[f.id] = false;   // 入ったことだけ覚える（出るまで何度も知らせない）
        }
        this._emit('gravity', b, { field: f.id, blocked: blocked, speed: b.speed() });
      } else if (!inside && f.id in b.fieldsIn) {
        delete b.fieldsIn[f.id];
      }
    }
  };

  World.prototype._walls = function (b) {
    var w = this.cfg.field.w, h = this.cfg.field.h;
    if (b.x - b.r < 0) { b.x = b.r; if (b.vx < 0) this._bounceWall(b, 1, 0); }
    if (b.x + b.r > w) { b.x = w - b.r; if (b.vx > 0) this._bounceWall(b, -1, 0); }
    if (b.y - b.r < 0) { b.y = b.r; if (b.vy < 0) this._bounceWall(b, 0, 1); }
    if (b.y + b.r > h) { b.y = h - b.r; if (b.vy > 0) this._bounceWall(b, 0, -1); }
  };

  /**
   * 鏡映しに反射させてから、速さ全体に反発係数を掛ける。
   * 法線成分だけを減らすと浅い角度で当たったときに角度が変わってしまい、
   * 「狙った角度でそのまま返ってくる」ひっぱりアクションの読みが成り立たない。
   */
  function reflect(b, nx, ny, e) {
    var vn = b.vx * nx + b.vy * ny;
    b.vx = (b.vx - 2 * vn * nx) * e;
    b.vy = (b.vy - 2 * vn * ny) * e;
    return -vn;
  }

  World.prototype._bounceWall = function (b, nx, ny) {
    var impact = reflect(b, nx, ny, this.cfg.wall.restitution);
    this._emit('wall', b, { nx: nx, ny: ny, impact: impact, speed: b.speed() });
  };

  /**
   * 動いている円と、止まっている物体との当たり。
   * 止まっている側は動かない（ひっぱりアクションでは弾かれた側だけが動く）。
   */
  World.prototype._collide = function (b) {
    var cfg = this.cfg;
    for (var i = 0; i < this.bodies.length; i++) {
      var o = this.bodies[i];
      if (o === b || o.moving) continue;
      var c = contact(b, o);
      if (!c) {
        if (b.overlaps[o.id]) delete b.overlaps[o.id];
      } else if (b.shot === 'pierce') {
        if (!b.overlaps[o.id]) {
          b.overlaps[o.id] = true;
          b.vx *= cfg.pierce.enterFactor;
          b.vy *= cfg.pierce.enterFactor;
          this._emit('pierce', b, { other: o.id, x: c.px, y: c.py, nx: c.nx, ny: c.ny, speed: b.speed() });
        }
      } else {
        b.x += c.nx * c.depth;
        b.y += c.ny * c.depth;
        if (b.vx * c.nx + b.vy * c.ny < 0) {
          var impact = reflect(b, c.nx, c.ny, cfg.reflect.restitution);
          this._emit('hit', b, { other: o.id, x: c.px, y: c.py, nx: c.nx, ny: c.ny, impact: impact, speed: b.speed(), weak: weakAt(o, c.px, c.py) });
        }
        this._walls(b);
      }
      // 弱点: 貫通タイプは通り抜けるときに触れた弱点ごとに1回
      if (b.shot === 'pierce' && o.sensors) this._sense(b, o);
    }
  };

  World.prototype._sense = function (b, o) {
    for (var j = 0; j < o.sensors.length; j++) {
      var s = o.sensors[j];
      var sx = o.x + s.dx, sy = o.y + s.dy, key = o.id + '#' + s.id;
      if (Math.hypot(b.x - sx, b.y - sy) < b.r + s.r) {
        if (!b.sensing[key]) {
          b.sensing[key] = true;
          this._emit('weak', b, { other: o.id, sensor: s.id, x: sx, y: sy, speed: b.speed() });
        }
      } else if (b.sensing[key]) {
        delete b.sensing[key];
      }
    }
  };

  World.prototype._overlapping = function (b) {
    for (var i = 0; i < this.bodies.length; i++) {
      var o = this.bodies[i];
      if (o === b) continue;
      var c = contact(b, o);
      if (c && c.depth > 0.01) return o;
    }
    return null;
  };

  World.prototype._inField = function (b, x, y) {
    return x - b.r >= 0 && y - b.r >= 0 && x + b.r <= this.cfg.field.w && y + b.r <= this.cfg.field.h;
  };

  /** 他の円に重なったまま止まったら（貫通タイプ）、いちばん近い空き地へ押し出す。 */
  World.prototype._resolve = function (b) {
    for (var iter = 0; iter < 12; iter++) {
      var o = this._overlapping(b);
      if (!o) return;
      var c = contact(b, o);
      b.x += c.nx * (c.depth + 0.5);
      b.y += c.ny * (c.depth + 0.5);
      b.x = Math.min(this.cfg.field.w - b.r, Math.max(b.r, b.x));
      b.y = Math.min(this.cfg.field.h - b.r, Math.max(b.r, b.y));
    }
    if (!this._overlapping(b)) return;
    // 壁と的に挟まれて押し出せないときは、周囲をらせん状に探す
    var ox = b.x, oy = b.y;
    for (var rad = 4; rad < 1200; rad += 4) {
      for (var a = 0; a < 24; a++) {
        var ang = a / 24 * Math.PI * 2;
        var x = ox + Math.cos(ang) * rad, y = oy + Math.sin(ang) * rad;
        if (!this._inField(b, x, y)) continue;
        b.x = x; b.y = y;
        if (!this._overlapping(b)) return;
      }
    }
    b.x = ox; b.y = oy;
  };

  /** 止まっている物体を、重なりのない位置へずらす（敵が出現した場所にいた味方など）。 */
  World.prototype.separate = function (id) {
    var b = this.get(id);
    if (b) this._resolve(b);
  };

  World.prototype._stop = function (b) {
    b.vx = 0; b.vy = 0;
    b.moving = false;
    b.overlaps = {};
    b.sensing = {};
    b.fieldsIn = {};
    this._resolve(b);
    this._emit('stop', b, { traveled: b.traveled });
  };

  /** 同じ設定・同じ配置の複製（予測軌道の計算用）。 */
  World.prototype.clone = function () {
    var w = new World();
    w.cfg = this.cfg;
    w.time = this.time;
    w.fields = this.fields;
    for (var i = 0; i < this.bodies.length; i++) {
      var s = this.bodies[i];
      var b = new Body({ id: s.id, kind: s.kind, shot: s.shot, shape: s.shape, x: s.x, y: s.y, r: s.r, w: s.w, h: s.h, sensors: s.sensors, abilities: s.abilities });
      b.vx = s.vx; b.vy = s.vy; b.moving = s.moving; b.traveled = s.traveled;
      for (var k in s.overlaps) b.overlaps[k] = true;
      for (var q in s.sensing) b.sensing[q] = true;
      for (var f in s.fieldsIn) b.fieldsIn[f] = s.fieldsIn[f];
      w.bodies.push(b);
    }
    return w;
  };

  /**
   * 予測軌道。本番と同じ step() を複製の上で回すので、表示と実際の動きがずれない。
   * maxLen の距離まで、または壁・キャラでの反射が maxBounces 回に達したところで打ち切る。
   * 貫通は軌道を曲げないので回数に数えない。
   */
  World.prototype.predict = function (id, vx, vy, opts) {
    opts = opts || {};
    var maxLen = opts.maxLen || 400;
    var maxBounces = opts.maxBounces == null ? 2 : opts.maxBounces;
    var w = this.clone();
    var b = w.get(id);
    var points = [{ x: b.x, y: b.y }];
    var contacts = [];
    w.setVelocity(id, vx, vy);
    w.drainEvents();
    var bounces = 0;
    for (var n = 0; n < 20000 && b.moving; n++) {
      w.step();
      var ev = w.drainEvents();
      var bent = false;
      for (var i = 0; i < ev.length; i++) {
        var e = ev[i];
        if (e.type === 'wall' || e.type === 'hit' || e.type === 'pierce' || e.type === 'weak') {
          contacts.push({ type: e.type, x: e.x, y: e.y });
          if (e.type === 'wall' || e.type === 'hit') { bounces++; bent = true; }
        }
      }
      // 折れ曲がる点は必ず残す（間引くと反射の角が丸まって見える）
      var last = points[points.length - 1];
      if (bent || Math.hypot(b.x - last.x, b.y - last.y) >= 6) points.push({ x: b.x, y: b.y });
      if (b.traveled >= maxLen || bounces >= maxBounces) break;
    }
    var tail = points[points.length - 1];
    if (tail.x !== b.x || tail.y !== b.y) points.push({ x: b.x, y: b.y });
    return { points: points, contacts: contacts, length: b.traveled, stopped: !b.moving };
  };

  root.MSPhysics = { DEFAULTS: DEFAULTS, World: World, Body: Body, contact: contact, launchVelocity: launchVelocity, mergeDeep: mergeDeep };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<!-- 戦闘ルール（純粋。ダメージ・HP・敵の攻撃カウンター・ウェーブ進行）→ window.MSBattle -->
<script id="ms-battle">
(function (root) {
  'use strict';

  var WEAK_RATE = 3;   // 弱点に当てたときの倍率

  /**
   * 1ステージぶんの戦闘の状態。
   * 物理（World）のイベントを受け取ってダメージに変え、倒した敵は World から取り除く。
   * ターンの終わりに endTurn() を呼ぶと、ウェーブ進行か敵の攻撃が起きる。
   */
  function Battle(data) {
    var self = this;
    this.units = {};
    data.units.forEach(function (u) {
      self.units[u.id] = { id: u.id, atk: u.atk, shot: u.shot, combo: u.combo || null, abilities: abilityMap(u.abilities) };
    });
    this.stage = data.stage;
    this.teamHpMax = data.stage.teamHp;
    this.teamHp = this.teamHpMax;
    this.wave = -1;
    this.turn = 1;
    this.enemies = [];
    this.state = 'playing';   // playing | won | lost
    this.stats = { damage: 0, hits: 0, weak: 0, kills: 0, combos: 0, dwHits: 0, dwBlocked: 0, gravity: 0, gravityBlocked: 0 };
    this.comboFired = {};     // このターンに友情コンボを出した味方（1ショット1回）
    this.combos = [];         // 発動した友情コンボ（演出用。drainCombos() で受け取る）
    this.hazards = [];        // ギミックに触れた記録（演出用。drainHazards() で受け取る）
    this.damageWalls = [];    // いまのウェーブのダメージウォール
  }

  Battle.WEAK_RATE = WEAK_RATE;

  /** ['antiDamageWall'] → { antiDamageWall: true } */
  function abilityMap(list) {
    var m = {};
    (list || []).forEach(function (a) { m[a] = true; });
    return m;
  }
  Battle.abilityMap = abilityMap;

  /** 次のウェーブの敵を World に出す。出現位置に味方がいたら押し出す。 */
  Battle.prototype.spawnWave = function (world) {
    this.wave++;
    var wave = this.stage.waves[this.wave];
    var defs = wave.enemies;
    var g = wave.gimmicks || {};
    this.damageWalls = g.damageWalls || [];
    world.setFields(g.gravity || []);
    this.enemies = defs.map(function (d) {
      return { id: d.id, def: d, hp: d.hp, maxHp: d.hp, counter: d.turns, alive: true };
    });
    for (var i = 0; i < defs.length; i++) {
      var d = defs[i];
      world.add({ id: d.id, kind: 'enemy', shape: d.shape, x: d.x, y: d.y, r: d.r, w: d.w, h: d.h, sensors: d.weak || null });
    }
    for (var id in this.units) world.separate(id);
    return this.wave;
  };

  Battle.prototype.enemy = function (id) {
    for (var i = 0; i < this.enemies.length; i++) if (this.enemies[i].id === id) return this.enemies[i];
    return null;
  };

  Battle.prototype.alive = function () {
    return this.enemies.filter(function (e) { return e.alive; });
  };

  Battle.prototype.kill = function (id, world) {
    var e = this.enemy(id);
    if (!e || !e.alive) return false;
    e.hp = 0;
    e.alive = false;
    world.remove(id);
    this.stats.kills++;
    return true;
  };

  /**
   * 物理イベント → ダメージ。
   *  反射で当たる(hit)      : 攻撃力 ×1（接触点が弱点なら ×3）
   *  貫通で突入する(pierce) : 攻撃力 ×1
   *  貫通で弱点を通る(weak) : 攻撃力 ×3（突入のぶんとは別に入る）
   *  味方に触れる(hit / pierce の相手が味方) : その味方の友情コンボ（1ショット1回）
   * 返り値はダメージの記録（演出用）。友情コンボのぶんは combo に種類が入る。
   */
  Battle.prototype.apply = function (events, world) {
    var out = [];
    if (this.state !== 'playing') return out;
    for (var i = 0; i < events.length; i++) {
      var ev = events[i];
      var u = this.units[ev.id];
      if (!u) continue;
      if ((ev.type === 'hit' || ev.type === 'pierce') && this.units[ev.other]) {
        this._combo(ev.other, ev.id, world, out);
        continue;
      }
      if (ev.type === 'wall') { this._wall(u, ev); if (this.state !== 'playing') break; continue; }
      if (ev.type === 'gravity') {
        this.stats[ev.blocked ? 'gravityBlocked' : 'gravity']++;
        this.hazards.push({ kind: 'gravity', unit: u.id, blocked: ev.blocked, x: ev.x, y: ev.y, field: ev.field });
        continue;
      }
      var weak;
      if (ev.type === 'hit') weak = !!ev.weak;
      else if (ev.type === 'pierce') weak = false;
      else if (ev.type === 'weak') weak = true;
      else continue;
      var e = this.enemy(ev.other);
      if (!e || !e.alive) continue;
      if (weak) this.stats.weak++;
      out.push(this._damage(e, u.id, Math.round(u.atk * (weak ? WEAK_RATE : 1)), weak, ev.x, ev.y, null, world));
    }
    return out;
  };

  /** 壁の辺と、辺に沿った位置（ダメージウォールの範囲と比べる） */
  function wallSide(ev) {
    if (ev.nx === 1) return { side: 'left', at: ev.y };
    if (ev.nx === -1) return { side: 'right', at: ev.y };
    if (ev.ny === 1) return { side: 'top', at: ev.x };
    return { side: 'bottom', at: ev.x };
  }

  /**
   * ダメージウォール: 触れるたびにチームのHPが減る（アンチダメージウォールなら無効）。
   * 動いている途中でHPが0になったら、その場で負けが決まる。
   */
  Battle.prototype._wall = function (u, ev) {
    var ws = wallSide(ev);
    for (var i = 0; i < this.damageWalls.length; i++) {
      var dw = this.damageWalls[i];
      if (dw.side !== ws.side || ws.at < dw.from || ws.at > dw.to) continue;
      var h = { kind: 'dw', unit: u.id, x: ev.x - ev.nx * 30, y: ev.y - ev.ny * 30, nx: ev.nx, ny: ev.ny, blocked: !!u.abilities.antiDamageWall, damage: 0 };
      if (h.blocked) {
        this.stats.dwBlocked++;
      } else {
        this.stats.dwHits++;
        h.damage = dw.damage;
        this.teamHp = Math.max(0, this.teamHp - dw.damage);
        if (this.teamHp === 0) this.state = 'lost';
      }
      h.hpAfter = this.teamHp;
      this.hazards.push(h);
      return;
    }
  };

  Battle.prototype.drainHazards = function () {
    var h = this.hazards;
    this.hazards = [];
    return h;
  };

  Battle.prototype._damage = function (e, unitId, dmg, weak, x, y, combo, world) {
    var dealt = Math.min(dmg, e.hp);
    e.hp -= dealt;
    this.stats.damage += dealt;
    this.stats.hits++;
    var rec = { unit: unitId, enemy: e.id, damage: dmg, weak: weak, x: x, y: y, killed: false, combo: combo };
    if (e.hp <= 0) rec.killed = this.kill(e.id, world);
    return rec;
  };

  /** 点 (x, y) から敵の表面までの距離（中にいれば 0） */
  function gapTo(d, x, y) {
    if (d.shape === 'rect') {
      var dx = Math.max(0, Math.abs(x - d.x) - d.w / 2), dy = Math.max(0, Math.abs(y - d.y) - d.h / 2);
      return Math.hypot(dx, dy);
    }
    return Math.max(0, Math.hypot(x - d.x, y - d.y) - d.r);
  }

  /**
   * 友情コンボ。ダメージはその場で入る（倒した敵はすぐ消える）。
   * 画面側は drainCombos() で発動の記録を受け取り、弾やビームを見せる。
   */
  Battle.prototype._combo = function (allyId, byId, world, out) {
    var ally = this.units[allyId];
    if (!ally.combo || this.comboFired[allyId] || allyId === byId) return;
    var body = world.get(allyId);
    if (!body) return;
    this.comboFired[allyId] = true;
    this.stats.combos++;
    var c = ally.combo, x = body.x, y = body.y, self = this;
    var fired = { ally: allyId, by: byId, kind: c.kind, name: c.name, x: x, y: y, hits: [], spec: c };
    function hit(e, px, py) {
      var rec = self._damage(e, allyId, c.power, false, px, py, c.kind, world);
      out.push(rec);
      fired.hits.push(rec);
    }
    var alive = this.alive(), i, e, d;
    if (c.kind === 'laser') {
      var hw = c.width / 2;
      for (i = 0; i < alive.length; i++) {
        e = alive[i]; d = e.def;
        var ex = d.shape === 'rect' ? d.w / 2 : d.r, ey = d.shape === 'rect' ? d.h / 2 : d.r;
        if (Math.abs(d.y - y) <= ey + hw) hit(e, d.x, y);                   // 横のビーム
        if (e.alive && Math.abs(d.x - x) <= ex + hw) hit(e, x, d.y);        // 縦のビーム
      }
    } else if (c.kind === 'blast') {
      for (i = 0; i < alive.length; i++) {
        e = alive[i];
        if (gapTo(e.def, x, y) <= c.radius) hit(e, e.def.x, e.def.y);
      }
    } else if (c.kind === 'homing') {
      // 近い敵から順に1発ずつ配って一巡したら最初に戻る。倒れた敵は飛ばす
      var order = alive.slice().sort(function (a, b) { return gapTo(a.def, x, y) - gapTo(b.def, x, y); });
      var cursor = 0;
      for (i = 0; i < c.count; i++) {
        e = null;
        for (var k = 0; k < order.length; k++) {
          var cand = order[(cursor + k) % order.length];
          if (cand.alive) { e = cand; cursor = (cursor + k + 1) % order.length; break; }
        }
        if (!e) break;
        hit(e, e.def.x, e.def.y);
      }
    }
    this.combos.push(fired);
  };

  Battle.prototype.drainCombos = function () {
    var c = this.combos;
    this.combos = [];
    return c;
  };

  Battle.prototype.waveCleared = function () {
    return this.enemies.every(function (e) { return !e.alive; });
  };

  function nearestUnit(world, units, e) {
    var best = null, bd = Infinity;
    for (var id in units) {
      var b = world.get(id);
      if (!b) continue;
      var d = Math.hypot(b.x - e.def.x, b.y - e.def.y);
      if (d < bd) { bd = d; best = id; }
    }
    return best;
  }

  /**
   * 1ターン（味方が1回弾いて止まるまで）の締め。
   *  - 敵が全滅していたら次のウェーブへ（最後なら勝ち）。敵は攻撃しない
   *  - そうでなければ生き残った敵のカウンターを1減らし、0になった敵が攻撃する
   * type: 'wave' | 'won' | 'attack' | 'next' | 'lost'
   */
  Battle.prototype.endTurn = function (world) {
    if (this.state !== 'playing') return { type: this.state, attacks: [] };
    this.turn++;
    this.comboFired = {};
    if (this.waveCleared()) {
      if (this.wave + 1 < this.stage.waves.length) {
        this.spawnWave(world);
        return { type: 'wave', wave: this.wave, attacks: [] };
      }
      this.state = 'won';
      return { type: 'won', attacks: [] };
    }
    var attacks = [];
    var alive = this.alive();
    for (var i = 0; i < alive.length; i++) {
      var e = alive[i];
      e.counter--;
      if (e.counter > 0) continue;
      e.counter = e.def.turns;
      this.teamHp = Math.max(0, this.teamHp - e.def.atk);
      attacks.push({
        enemy: e.id, kind: e.def.attack, damage: e.def.atk, hpAfter: this.teamHp,
        target: e.def.attack === 'single' ? nearestUnit(world, this.units, e) : null
      });
      if (this.teamHp === 0) { this.state = 'lost'; break; }
    }
    if (this.state === 'lost') return { type: 'lost', attacks: attacks };
    return { type: attacks.length ? 'attack' : 'next', attacks: attacks };
  };

  /** 先読み（自動プレイ）用の複製。定義（def・stage）は共有する。 */
  Battle.prototype.clone = function () {
    var b = Object.create(Battle.prototype);
    b.units = this.units;
    b.stage = this.stage;
    b.teamHpMax = this.teamHpMax;
    b.teamHp = this.teamHp;
    b.wave = this.wave;
    b.turn = this.turn;
    b.state = this.state;
    b.enemies = this.enemies.map(function (e) {
      return { id: e.id, def: e.def, hp: e.hp, maxHp: e.maxHp, counter: e.counter, alive: e.alive };
    });
    b.stats = {};
    for (var s in this.stats) b.stats[s] = this.stats[s];
    b.damageWalls = this.damageWalls;
    b.hazards = [];
    b.comboFired = {};
    for (var k in this.comboFired) b.comboFired[k] = true;
    b.combos = [];
    return b;
  };

  root.MSBattle = { Battle: Battle };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<!-- ゲーム本体: 入力・進行・演出・描画 -->
<script id="ms-game">
(function () {
  'use strict';

  var P = window.MSPhysics, BT = window.MSBattle, D = window.MSData;
  var WALL = 22;                    // 画面上の壁の厚み（論理px）。フィールドの外側に描く
  var SHOT_LABEL = { reflect: '反射', pierce: '貫通' };

  var canvas = document.getElementById('field');

  // ---------------------------------------------------------------- 状態
  var cfgOverrides = {};
  var world, battle, units, foes = {};

   * phase: ready → pulling → moving → settling → (enemy | wave) → ready

  var game = {

  var shownHp = 0;    // 画面に出しているチームHP（敵の攻撃が当たった瞬間に減らす）
  var pull = null;    // { pointerId, sx, sy, dx, dy, aim }
  var fx = { particles: [], rings: [], texts: [], bullets: [], beams: [], blasts: [], shake: 0, hitStop: 0, hurt: 0, wallFlash: {} };

  function buildWorld() {
    world = new P.World(cfgOverrides);

    shownHp = battle.teamHp;
    pull = null;
    fx.particles.length = 0; fx.rings.length = 0; fx.texts.length = 0;
    fx.bullets.length = 0; fx.beams.length = 0; fx.blasts.length = 0;

  }

  /** 敵ごとの演出用の状態（光る・揺れる・出現） */
  function initFoes() {
    foes = {};
    battle.enemies.forEach(function (e) { foes[e.id] = { flash: 0, wobble: 0, spawn: 0 }; });
  }

  function activeUnit() { return units[game.active]; }
  function unitById(id) { for (var i = 0; i < units.length; i++) if (units[i].def.id === id) return units[i]; return null; }

  // ---------------------------------------------------------------- 効果音（Web Audio で合成）
  var sound = (function () {
    var ac = null, on = true, lastWall = 0, lastHit = 0;
    try { on = localStorage.getItem('ms.sound') !== 'off'; } catch (e) { /* プライベートモード */ }

    function unlock() {
      if (!on) return;
      if (!ac) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try { ac = new AC(); } catch (e) { return; }
      }
      if (ac.state === 'suspended') ac.resume();
    }
    function tone(freq, to, dur, type, vol, delay) {
      if (!on || !ac) return;
      var t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    }
    function noise(dur, vol, freq) {
      if (!on || !ac) return;
      var t = ac.currentTime, n = Math.floor(ac.sampleRate * dur);
      var buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);

      src.connect(f).connect(g).connect(ac.destination);

    return {
      unlock: unlock,
      get on() { return on; },
      toggle: function () {
        on = !on;
        try { localStorage.setItem('ms.sound', on ? 'on' : 'off'); } catch (e) { /* 保存できなくても続ける */ }
        if (on) unlock();
        return on;
      },
      launch: function (p) { tone(220 + 260 * p, 900 + 500 * p, 0.16, 'triangle', 0.18); noise(0.12, 0.12, 1800); },
      wall: function (s) {
        var now = throttle(lastWall, 35); if (now < 0) return; lastWall = now;
        var k = Math.min(1, s / 2000);
        tone(160 + 140 * k, 90, 0.09, 'square', 0.05 + 0.1 * k);
      },
      hit: function (s) {
        var now = throttle(lastHit, 30); if (now < 0) return; lastHit = now;
        var k = Math.min(1, s / 2000); tone(520 + 400 * k, 260, 0.12, 'sawtooth', 0.07 + 0.08 * k); noise(0.08, 0.2 * k, 3000);
      },
      pierce: function (s) { var k = Math.min(1, s / 2000); noise(0.22, 0.12 + 0.2 * k, 900); tone(700, 1400, 0.12, 'sine', 0.06); },
      weak: function () { tone(1400, 2600, 0.12, 'square', 0.08); tone(2000, 3200, 0.14, 'sine', 0.08, 0.05); },
      kill: function () { noise(0.4, 0.3, 500); tone(300, 60, 0.4, 'sawtooth', 0.12); },
      charge: function () { tone(200, 500, 0.3, 'sawtooth', 0.05); },
      enemy: function (all) { noise(all ? 0.5 : 0.25, 0.35, all ? 300 : 1200); tone(all ? 120 : 400, 50, 0.35, 'square', 0.12); },
      wave: function () { tone(440, 440, 0.12, 'square', 0.06); tone(660, 660, 0.12, 'square', 0.06, 0.13); tone(880, 880, 0.2, 'square', 0.06, 0.26); },
      win: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, f, 0.25, 'triangle', 0.1, i * 0.12); }); },
      lose: function () { [392, 330, 262].forEach(function (f, i) { tone(f, f * 0.97, 0.35, 'sawtooth', 0.06, i * 0.22); }); },
      zap: function () { noise(0.18, 0.3, 5000); tone(90, 60, 0.2, 'square', 0.12); },
      shield: function () { tone(1600, 2400, 0.08, 'sine', 0.06); },
      gravity: function () { tone(300, 70, 0.4, 'sine', 0.14); },
      combo: function () { tone(880, 1320, 0.1, 'triangle', 0.1); tone(1320, 1760, 0.14, 'triangle', 0.09, 0.08); },
      laser: function () { tone(1800, 300, 0.45, 'sawtooth', 0.07); noise(0.3, 0.12, 4000); },
      blast: function () { noise(0.6, 0.4, 250); tone(160, 40, 0.5, 'sine', 0.25); },
      shot: function () { tone(1400, 2200, 0.05, 'sine', 0.05); },
      tick: function () { tone(1200, 1000, 0.03, 'sine', 0.04); },
      stop: function () { tone(330, 300, 0.1, 'sine', 0.05); }
    };
  })();

  // ---------------------------------------------------------------- 画面サイズ
  var view = { scale: 1, dpr: 1, cssW: 0, cssH: 0, bg: null };

  function logicalSize() {
    return { w: world.cfg.field.w + WALL * 2, h: world.cfg.field.h + WALL * 2 };
  }

  function resize() {
    var r = stage.getBoundingClientRect();
    var L = logicalSize();
    var scale = Math.max(0.1, Math.min(r.width / L.w, r.height / L.h));
    view.scale = scale;
    view.dpr = Math.min(3, window.devicePixelRatio || 1);
    view.cssW = Math.floor(L.w * scale);
    view.cssH = Math.floor(L.h * scale);
    canvas.style.width = view.cssW + 'px';
    canvas.style.height = view.cssH + 'px';
    canvas.width = Math.round(view.cssW * view.dpr);
    canvas.height = Math.round(view.cssH * view.dpr);
    view.bg = renderBackground();
  }

  /** 画面座標 → フィールド座標 */
  function toWorld(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / view.scale - WALL, y: (e.clientY - r.top) / view.scale - WALL };
  }

  // ---------------------------------------------------------------- 入力（押す → 引く → 離す）
  function unitAt(p) {
    for (var i = 0; i < units.length; i++) {
      var b = units[i].body;
      if (Math.hypot(p.x - b.x, p.y - b.y) <= b.r + 14) return i;
    }
    return -1;
  }

  function onDown(e) {
    if (pull) { cancelPull(); return; }            // 2本目の指・別のボタン → キャンセル
    if (e.button !== undefined && e.button > 0) return;
    if (game.phase !== 'ready') return;
    sound.unlock();
    var p = toWorld(e);
    var hit = unitAt(p);
    if (hit >= 0 && hit !== game.active) { game.active = hit; updateHud(); sound.tick(); }
    pull = { pointerId: e.pointerId, sx: p.x, sy: p.y, dx: 0, dy: 0, aim: null };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 合成イベントでは失敗することがある */ }
    game.phase = 'pulling';
    canvas.classList.add('pulling');
    updateHud();
    e.preventDefault();
  }

  function onMove(e) {
    if (!pull || e.pointerId !== pull.pointerId) return;
    var p = toWorld(e);
    pull.dx = p.x - pull.sx;
    pull.dy = p.y - pull.sy;
    updateAim();
    e.preventDefault();
  }

  function onUp(e) {
    if (!pull || e.pointerId !== pull.pointerId) return;
    var p = toWorld(e);
    pull.dx = p.x - pull.sx;
    pull.dy = p.y - pull.sy;
    release();
  }

  function updateAim() {
    var u = activeUnit();
    var v = P.launchVelocity(world.cfg, pull.dx, pull.dy);
    if (!v) { pull.aim = null; return; }
    u.facing = Math.atan2(v.vy, v.vx);

  }

  function release() {

    u.facing = Math.atan2(v.vy, v.vx);
    u.squash = 1;
    u.trail.length = 0;

    game.phase = 'moving';
    game.shotHits = 0;
    game.shotDamage = 0;

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);

  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  window.addEventListener('keydown', function (e) { if (e.key === 'Escape') cancelPull(); });

  // ---------------------------------------------------------------- 当たりの演出
  function handleEvents(evs) {
    for (var i = 0; i < evs.length; i++) {
      var e = evs[i];
      var u = unitById(e.id);
      if (!u) continue;
      if (e.type === 'wall') {
        var k = Math.min(1, e.impact / 2000);
        burst(e.x - e.nx * u.body.r, e.y - e.ny * u.body.r, e.nx, e.ny, 4 + 10 * k, '#fff3c4', 180 + 300 * k);
        ring(e.x - e.nx * u.body.r, e.y - e.ny * u.body.r, 10 + 18 * k, '#fff3c4');

        u.squash = Math.max(u.squash, 0.4 + 0.6 * k);
        sound.wall(e.impact);
      } else if (e.type === 'hit') {
        var kh = Math.min(1, e.impact / 2000);
        burst(e.x, e.y, e.nx, e.ny, 8 + 14 * kh, u.def.accent, 220 + 360 * kh);
        ring(e.x, e.y, 18 + 26 * kh, u.def.accent);
        fx.shake = Math.max(fx.shake, 3 + 7 * kh);
        fx.hitStop = Math.max(fx.hitStop, 0.02 + 0.03 * kh);
        u.squash = 1;
        bump(e.other);
        sound.hit(e.impact);
      } else if (e.type === 'pierce') {
        var kp = Math.min(1, e.speed / 1600);
        burst(e.x, e.y, -e.nx, -e.ny, 10 + 12 * kp, '#ffb070', 240 + 320 * kp);
        ring(e.x, e.y, 22 + 20 * kp, '#ff7a45');

        fx.hitStop = Math.max(fx.hitStop, 0.015 + 0.02 * kp);

        sound.pierce(e.speed);

        ring(e.x, e.y, 40, '#ffd166');
        burst(e.x, e.y, 0, -1, 16, '#ffd166', 420);
      } else if (e.type === 'stop') {

      }
    }
  }

  /** ダメージの記録 → 数字・撃破の演出 */
  function handleDamage(recs) {
    for (var i = 0; i < recs.length; i++) {
      var r = recs[i];

  }

  function showDamage(r) {

    var jx = (Math.random() - 0.5) * 24;

  function drawGimmicks(t) {
    var W = world.cfg.field.w, H = world.cfg.field.h, i;
    // 重力バリア: 紫の渦
    for (i = 0; i < world.fields.length; i++) {
      var f = world.fields[i];
      var g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      g.addColorStop(0, 'rgba(120,60,220,.55)'); g.addColorStop(0.7, 'rgba(90,40,180,.3)'); g.addColorStop(1, 'rgba(90,40,180,.05)');

        ctx.lineWidth = 1.5;

      }

      for (var j = 0; j <= n; j++) {
