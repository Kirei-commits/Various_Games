      // 帯（どこが危ないか、止まっていても分かるように）
      ctx.fillStyle = 'rgba(255,210,60,' + (0.16 + 0.3 * flash).toFixed(3) + ')';
      if (dw.side === 'left') ctx.fillRect(0, dw.from, 8, dw.to - dw.from);
      else if (dw.side === 'right') ctx.fillRect(W - 8, dw.from, 8, dw.to - dw.from);
      else if (dw.side === 'top') ctx.fillRect(dw.from, 0, dw.to - dw.from, 8);
      else ctx.fillRect(dw.from, H - 8, dw.to - dw.from, 8);
      ctx.lineJoin = 'round';
      [[8 + 6 * flash, 'rgba(255,200,40,.35)'], [3, '#ffe066'], [1.2, '#fffbe0']].forEach(function (st) {
        ctx.strokeStyle = st[1]; ctx.lineWidth = st[0];
        ctx.beginPath();
        pts.forEach(function (p, idx) { if (idx) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); });
        ctx.stroke();
      });
    }
  }

  // ---------------------------------------------------------------- 友情コンボの演出
  //（ダメージは Battle がその場で入れている。ここは見せ方だけ）
  var COMBO_COLOR = { homing: '#7df0ff', laser: '#ff9a6b', blast: '#ffd166' };

  function startCombos(list) {
    for (var i = 0; i < list.length; i++) {
      var c = list[i], u = unitById(c.ally), col = COMBO_COLOR[c.kind];
      u.glow = 1;
      u.squash = 1;
      ring(c.x, c.y, 50, col);
      floatText(c.x, c.y - 58, c.name, col, 18, 1.1);
      floatText(c.x, c.y - 80, '友情コンボ!', '#ffffff', 13, 1.1);
      fx.hitStop = Math.max(fx.hitStop, 0.05);
      sound.combo();
      if (c.kind === 'laser') {
        fx.beams.push({ x: c.x, y: c.y, w: c.spec.width, life: 0, max: 0.55, color: col });
        fx.shake = Math.max(fx.shake, 6);
        sound.laser();
      } else if (c.kind === 'blast') {
        fx.blasts.push({ x: c.x, y: c.y, r: c.spec.radius, life: 0, max: 0.55 });
        burst(c.x, c.y, 0, -1, 40, '#ffb347', 520);
        fx.shake = Math.max(fx.shake, 12);
        sound.blast();
      } else if (c.kind === 'homing') {
        for (var j = 0; j < c.hits.length; j++) {
          // 最初は左右に広がって、曲がりながら敵へ向かう
          var side = j % 2 ? 1 : -1, spread = 90 + 25 * (j >> 1);
          fx.bullets.push({ sx: c.x, sy: c.y, cx: c.x + side * spread, cy: c.y - 120 - 20 * j,
            rec: c.hits[j], t: -0.06 * j, dur: 0.32, px: c.x, py: c.y });
        }
      }
    }
  }

  function updateCombos(dt) {
    var i;
    for (i = fx.bullets.length - 1; i >= 0; i--) {
      var b = fx.bullets[i];
      var was = b.t;
      b.t += dt;
      if (was < 0 && b.t >= 0) sound.shot();
      if (b.t >= b.dur) {
        burst(b.rec.x, b.rec.y, 0, -1, 10, '#7df0ff', 300);
        ring(b.rec.x, b.rec.y, 20, '#7df0ff');
        showDamage(b.rec);
        if (foes[b.rec.enemy]) { foes[b.rec.enemy].flash = 1; foes[b.rec.enemy].wobble = 1; }
        fx.bullets.splice(i, 1);
      }
    }
    for (i = fx.beams.length - 1; i >= 0; i--) { fx.beams[i].life += dt; if (fx.beams[i].life >= fx.beams[i].max) fx.beams.splice(i, 1); }
    for (i = fx.blasts.length - 1; i >= 0; i--) { fx.blasts[i].life += dt; if (fx.blasts[i].life >= fx.blasts[i].max) fx.blasts.splice(i, 1); }
  }

  function bulletPos(b, f) {
    var tx = b.rec.x, ty = b.rec.y, g = 1 - f;
    return { x: g * g * b.sx + 2 * g * f * b.cx + f * f * tx, y: g * g * b.sy + 2 * g * f * b.cy + f * f * ty };
  }

  function drawCombos() {
    var i, W = world.cfg.field.w, H = world.cfg.field.h;
    for (i = 0; i < fx.blasts.length; i++) {
      var bl = fx.blasts[i], f = bl.life / bl.max, a = 1 - f;
      var rr = bl.r * Math.min(1, 0.3 + f * 2.2);
      var g = ctx.createRadialGradient(bl.x, bl.y, 0, bl.x, bl.y, rr);
      g.addColorStop(0, 'rgba(255,250,220,' + (0.9 * a).toFixed(3) + ')');
      g.addColorStop(0.5, 'rgba(255,170,60,' + (0.6 * a).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,90,40,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(bl.x, bl.y, rr, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,220,140,' + a.toFixed(3) + ')'; ctx.lineWidth = 4 * a + 1;
      ctx.beginPath(); ctx.arc(bl.x, bl.y, bl.r, 0, Math.PI * 2); ctx.stroke();
    }
    for (i = 0; i < fx.beams.length; i++) {
      var bm = fx.beams[i], fa = 1 - bm.life / bm.max;
      var grow = Math.min(1, bm.life / 0.08), w = bm.w * (0.4 + 0.6 * grow) * (0.6 + 0.4 * fa);
      ctx.globalAlpha = fa;
      ctx.fillStyle = 'rgba(255,120,80,.45)';
      ctx.fillRect(0, bm.y - w, W, w * 2);
      ctx.fillRect(bm.x - w, 0, w * 2, H);
      ctx.fillStyle = 'rgba(255,200,160,.9)';
      ctx.fillRect(0, bm.y - w / 2, W, w);
      ctx.fillRect(bm.x - w / 2, 0, w, H);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, bm.y - w / 6, W, w / 3);
      ctx.fillRect(bm.x - w / 6, 0, w / 3, H);
      ctx.globalAlpha = 1;
    }
    for (i = 0; i < fx.bullets.length; i++) {
      var b = fx.bullets[i];
      if (b.t < 0) continue;
      var f2 = Math.min(1, b.t / b.dur);
      for (var k = 4; k >= 0; k--) {
        var p = bulletPos(b, Math.max(0, f2 - k * 0.05));
        ctx.fillStyle = k ? 'rgba(125,240,255,' + (0.35 - k * 0.06).toFixed(3) + ')' : '#e8fdff';
        ctx.beginPath(); ctx.arc(p.x, p.y, k ? 9 - k : 7, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function bump(id) {
    var f = foes[id];
    if (f) { f.flash = 1; f.wobble = 1; return; }
    var u = unitById(id);
    if (u) u.squash = Math.max(u.squash, 0.6);
  }

  // ---------------------------------------------------------------- 進行
  function update(dt) {
    var sdt = dt * game.timeScale;
    if (game.phase === 'moving') {
      if (fx.hitStop > 0) {
        fx.hitStop -= dt;
      } else {
        var step = world.cfg.step;
        game.acc += sdt;
        var n = 0;
        while (game.acc >= step && n < 400) {
          world.step(step);
          game.acc -= step;
          n++;
          var evs = world.drainEvents();
          if (evs.length) {
            handleEvents(evs);
            handleDamage(battle.apply(evs, world));
            startCombos(battle.drainCombos());
            handleHazards(battle.drainHazards());
            if (fx.hitStop > 0) { game.acc = 0; break; }
          }
        }
      }
      var m = game.mover;
      if (m) {
        if (m.body.moving) m.facing = Math.atan2(m.body.vy, m.body.vx);
        m.trail.push({ x: m.body.x, y: m.body.y });
        if (m.trail.length > 16) m.trail.shift();
      }
      if (world.isSettled()) {
        game.phase = 'settling';
        game.timer = 0.35;
        game.acc = 0;
      }
    } else if (game.phase === 'settling') {
      // 友情コンボの弾が飛んでいる間はターンを締めない
      if (!fx.bullets.length) game.timer -= sdt;
      if (game.mover && game.mover.trail.length) game.mover.trail.shift();
      if (game.timer <= 0) finishTurn();
    } else if (game.phase === 'enemy') {
      updateAttack(sdt);
    } else if (game.phase === 'wave') {
      game.timer -= sdt;
      if (game.timer <= 0) toReady();
    } else if (game.phase === 'ending') {
      game.timer -= sdt;
      if (game.timer <= 0) showResult(game.ending);
    }

    for (var i = 0; i < units.length; i++) {
      units[i].squash = Math.max(0, units[i].squash - dt * 5);
      units[i].glow = Math.max(0, units[i].glow - dt * 1.6);
    }
    updateCombos(dt);
    for (var id in foes) {
      var f = foes[id];
      f.flash = Math.max(0, f.flash - dt * 6);
      f.wobble = Math.max(0, f.wobble - dt * 3);
      f.spawn = Math.min(1, f.spawn + sdt * 2);
    }
    fx.shake = Math.max(0, fx.shake - dt * 30);
    fx.hurt = Math.max(0, fx.hurt - dt * 2.5);
    for (var side in fx.wallFlash) fx.wallFlash[side] = Math.max(0, fx.wallFlash[side] - dt * 3);
    updateFx(dt);
  }

  /** 止まった後: ウェーブ進行 / 敵の攻撃 / 勝敗 */
  function finishTurn() {
    if (game.mover) game.mover.trail.length = 0;
    game.mover = null;
    var res = battle.endTurn(world);
    game.active = (game.active + 1) % units.length;
    if (res.type === 'wave') {
      initFoes();
      var boss = battle.enemies.some(function (e) { return e.def.boss; });
      banner(boss ? 'BOSS BATTLE' : 'WAVE ' + (res.wave + 1), boss ? '#ff6b6b' : '#ffd166');
      game.phase = 'wave';
      game.timer = 1.4;
      sound.wave();
    } else if (res.type === 'won') {
      game.phase = 'ending';
      game.ending = 'won';
      game.timer = 0.6;
    } else if (res.type === 'lost' && !res.attacks.length) {
      // ダメージウォールで力尽きた
      game.phase = 'ending';
      game.ending = 'lost';
      game.timer = 0.4;
    } else if (res.attacks.length) {
      game.phase = 'enemy';
      game.attacks = res.attacks.slice();
      game.attack = null;
      game.timer = 0.2;
    } else {
      toReady();
    }
    updateHud();
  }

  function toReady() {
    game.phase = 'ready';
    var u = activeUnit();
    floatText(u.body.x, u.body.y - u.body.r - 30, 'NEXT', '#ffd166', 13);
    updateHud();
  }

  /** 敵の攻撃を1体ずつ: ためる(0.35秒) → 撃つ → 余韻 */
  function updateAttack(sdt) {
    if (!game.attack) {
      game.timer -= sdt;
      if (game.timer > 0) return;
      if (!game.attacks.length) {
        if (battle.state === 'lost') { game.phase = 'ending'; game.ending = 'lost'; game.timer = 0.5; }
        else toReady();
        return;
      }
      game.attack = { a: game.attacks.shift(), t: 0, fired: false };
      sound.charge();
      return;
    }
    var at = game.attack;
    at.t += sdt;
    if (!at.fired && at.t >= 0.35) { fireAttack(at.a); at.fired = true; }
    if (at.t >= 0.95) { game.attack = null; game.timer = 0.12; }
  }

  function fireAttack(a) {
    shownHp = a.hpAfter;
    fx.hurt = 1;
    fx.shake = Math.max(fx.shake, a.kind === 'all' ? 14 : 9);
    sound.enemy(a.kind === 'all');
    var e = battle.enemy(a.enemy);
    if (foes[a.enemy]) foes[a.enemy].wobble = 1;
    var targets = a.kind === 'single' ? [unitById(a.target)] : units;
    targets.forEach(function (u) {
      if (!u) return;
      u.squash = 1;
      burst(u.body.x, u.body.y, 0, -1, 14, '#ff6b6b', 360);
    });
    var tx = a.kind === 'single' && targets[0] ? targets[0].body.x : world.cfg.field.w / 2;
    var ty = a.kind === 'single' && targets[0] ? targets[0].body.y - 44 : units[0].body.y - 60;
    floatText(tx, ty, '-' + a.damage, '#ff6b6b', 24, 1.1);
    if (a.kind === 'all') floatText(e.def.x, e.def.y, 'ブレス!', '#ff9a6b', 20, 0.9);
    updateHud();
  }

  function showResult(kind) {
    game.phase = kind;
    el.result.hidden = false;
    el.resultTitle.textContent = kind === 'won' ? 'STAGE CLEAR' : 'GAME OVER';
    el.resultTitle.className = kind;
    var s = battle.stats;
    el.resultText.innerHTML = kind === 'won'
      ? D.stage.name + ' を <b>' + (battle.turn - 1) + 'ターン</b>でクリア！<br>ヒット ' + s.hits + '回（弱点 ' + s.weak + '回）・与ダメージ ' + s.damage
      : 'チームのHPが0になった…<br>WAVE ' + (battle.wave + 1) + ' / ' + D.stage.waves.length + '・与ダメージ ' + s.damage;
    if (kind === 'won') sound.win(); else sound.lose();
    updateHud();
  }

  function updateHud() {
    var u = activeUnit();
    el.turn.textContent = String(battle.turn);
    el.wave.textContent = (battle.wave + 1) + '/' + D.stage.waves.length;
    el.activeName.textContent = u.def.name;
    el.activeType.textContent = SHOT_LABEL[u.def.shot];
    el.activeType.className = 'type ' + u.def.shot;
    var ratio = shownHp / battle.teamHpMax;
    el.hpFill.style.width = (ratio * 100).toFixed(1) + '%';
    el.hpFill.className = ratio <= 0.25 ? 'low' : ratio <= 0.5 ? 'mid' : '';
    el.hpText.textContent = shownHp + ' / ' + battle.teamHpMax;
    var help;
    if (game.phase === 'pulling') help = '<b>離すと発射</b>。遠くまで引くほど強く、引きを戻すとキャンセル。';
    else if (game.phase === 'moving' || game.phase === 'settling') help = game.mover && game.mover.def.shot === 'pierce'
      ? '貫通タイプは敵を<b>すり抜けて</b>、そのたびに大きく減速します。'
      : '反射タイプは敵と壁の間で<b>何度も跳ね返る</b>と大ダメージ。';
    else if (game.phase === 'enemy') help = '敵の攻撃！ 数字が<b>0</b>になった敵が攻撃してきます。';
    else if (game.phase === 'wave') help = '次のウェーブ！';
    else if (game.phase === 'won' || game.phase === 'lost' || game.phase === 'ending') help = '';
    else {
      var ab = (u.def.abilities || []).map(function (a) { return ABILITY[a].name; });
      help = '<b>' + u.def.name + '（' + SHOT_LABEL[u.def.shot] + (ab.length ? '・' + ab.join('・') : '') + '）</b>の番。'
        + '<b>味方に当てると友情コンボ</b>。黄色い<b>電気の壁</b>はHPが減り、紫の<b>重力バリア</b>は大きく減速。';
    }
    el.help.innerHTML = help;
    canvas.dataset.phase = game.phase;
  }

  // ---------------------------------------------------------------- 演出の部品
  function burst(x, y, nx, ny, count, color, speed) {
    var base = Math.atan2(ny, nx);
    for (var i = 0; i < count; i++) {
      var a = base + (Math.random() - 0.5) * 2.2;
      var s = speed * (0.35 + Math.random() * 0.8);
      fx.particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0, max: 0.25 + Math.random() * 0.3, size: 2 + Math.random() * 3, color: color });
    }
  }
  function ring(x, y, r, color) { fx.rings.push({ x: x, y: y, r: r, life: 0, max: 0.35, color: color }); }
  function floatText(x, y, text, color, size, max) {
    fx.texts.push({ x: x, y: y, text: text, color: color, size: size, life: 0, max: max || 0.9 });
  }
  function banner(text, color) {
    fx.texts.push({ x: world.cfg.field.w / 2, y: world.cfg.field.h / 2 + 40, text: text, color: color, size: 40, life: 0, max: 1.4, still: true });
  }

  function updateFx(dt) {
    var i;
    for (i = fx.particles.length - 1; i >= 0; i--) {
      var p = fx.particles[i];
      p.life += dt;
      if (p.life >= p.max) { fx.particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 1 - 5 * dt; p.vy *= 1 - 5 * dt;
    }
    for (i = fx.rings.length - 1; i >= 0; i--) { fx.rings[i].life += dt; if (fx.rings[i].life >= fx.rings[i].max) fx.rings.splice(i, 1); }
    for (i = fx.texts.length - 1; i >= 0; i--) { fx.texts[i].life += dt; if (fx.texts[i].life >= fx.texts[i].max) fx.texts.splice(i, 1); }
  }

  // ---------------------------------------------------------------- 描画
  /** 床と壁は動かないので、サイズが変わったときだけ描いておく。 */
  function renderBackground() {
    var L = logicalSize();
    var c = document.createElement('canvas');
    c.width = canvas.width; c.height = canvas.height;
    var g = c.getContext('2d');
    var k = view.scale * view.dpr;
    g.setTransform(k, 0, 0, k, 0, 0);
    var W = world.cfg.field.w, H = world.cfg.field.h;

    // 壁（金属の枠）
    var frame = g.createLinearGradient(0, 0, L.w, L.h);
    frame.addColorStop(0, '#3a4a78'); frame.addColorStop(0.5, '#1b2446'); frame.addColorStop(1, '#2f3d6a');
    g.fillStyle = frame;
    roundRect(g, 0, 0, L.w, L.h, 18); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 2;
    roundRect(g, 3, 3, L.w - 6, L.h - 6, 15); g.stroke();
    g.fillStyle = 'rgba(200,220,255,.35)';
    for (var sx = WALL + 30; sx < L.w - WALL; sx += 60) { dot(g, sx, WALL / 2, 2.2); dot(g, sx, L.h - WALL / 2, 2.2); }
    for (var sy = WALL + 30; sy < L.h - WALL; sy += 60) { dot(g, WALL / 2, sy, 2.2); dot(g, L.w - WALL / 2, sy, 2.2); }

    g.save();
    g.translate(WALL, WALL);
    var floor = g.createLinearGradient(0, 0, 0, H);
    floor.addColorStop(0, '#16284e'); floor.addColorStop(1, '#0d1832');
    g.fillStyle = floor; g.fillRect(0, 0, W, H);
    // 端に半端な列が出ないよう、フィールドを割り切れる枚数で敷く
    var cols = Math.round(W / 60), rows = Math.round(H / 60);
    var tw = W / cols, th = H / rows, seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (var ty = 0; ty < rows; ty++) {
      for (var tx = 0; tx < cols; tx++) {
        g.fillStyle = 'rgba(120,160,255,' + (0.03 + rnd() * 0.05).toFixed(3) + ')';
        g.fillRect(tx * tw + 1.5, ty * th + 1.5, tw - 3, th - 3);
      }
    }
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1;
    for (var gx = 0; gx <= cols; gx++) { g.beginPath(); g.moveTo(gx * tw, 0); g.lineTo(gx * tw, H); g.stroke(); }
    for (var gy = 0; gy <= rows; gy++) { g.beginPath(); g.moveTo(0, gy * th); g.lineTo(W, gy * th); g.stroke(); }
    g.strokeStyle = 'rgba(140,200,255,.10)'; g.lineWidth = 2;
    g.beginPath(); g.arc(W / 2, H / 2, 150, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.arc(W / 2, H / 2, 118, 0, Math.PI * 2); g.stroke();
    g.beginPath();
    for (var s = 0; s <= 6; s++) {
      var a = -Math.PI / 2 + s * Math.PI * 4 / 5;
      var px = W / 2 + Math.cos(a) * 118, py = H / 2 + Math.sin(a) * 118;
      if (s === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.stroke();
    var vig = g.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75);
    vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,.45)');
    g.fillStyle = vig; g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(110,200,255,.55)'; g.lineWidth = 2;
    g.strokeRect(1, 1, W - 2, H - 2);
    g.strokeStyle = 'rgba(110,200,255,.15)'; g.lineWidth = 8;
    g.strokeRect(4, 4, W - 8, H - 8);
    g.restore();
    return c;
  }

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function dot(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
  function easeOutBack(x) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }

  function render(now) {
    var k = view.scale * view.dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var sx = fx.shake ? (Math.random() - 0.5) * fx.shake * 2 : 0;
    var sy = fx.shake ? (Math.random() - 0.5) * fx.shake * 2 : 0;
    if (view.bg) ctx.drawImage(view.bg, sx * k, sy * k);
    ctx.setTransform(k, 0, 0, k, (WALL + sx) * k, (WALL + sy) * k);

    var t = now / 1000;
    var i, alive = battle.alive();
    drawGimmicks(t);
    for (i = 0; i < alive.length; i++) drawEnemy(alive[i], t);
    for (i = 0; i < alive.length; i++) drawWeak(alive[i], t);
    if (game.mover) drawTrail(game.mover);
    if (pull && pull.aim) drawGuide(activeUnit(), pull.aim, t);
    for (i = 0; i < units.length; i++) if (units[i] !== game.mover) drawUnit(units[i], t);
    if (game.mover) drawUnit(game.mover, t);
    for (i = 0; i < alive.length; i++) drawEnemyUi(alive[i], t);
    drawCombos();
    if (game.attack) drawAttack(game.attack);
    if (pull) drawPullOrigin(pull);
    drawFx();
    drawBossBar(alive);
    drawCombo();
    if (fx.hurt > 0) {
      ctx.fillStyle = 'rgba(255,40,60,' + (0.28 * fx.hurt).toFixed(3) + ')';
      ctx.fillRect(0, 0, world.cfg.field.w, world.cfg.field.h);
    }
  }

  // --- 敵
  function drawEnemy(e, t) {
    var d = e.def, f = foes[e.id] || { flash: 0, wobble: 0, spawn: 1 };
    var s = easeOutBack(f.spawn);
    var wob = f.wobble * Math.sin(t * 40) * 0.08;
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.globalAlpha = Math.min(1, f.spawn * 2);
    // 攻撃をためている敵は赤く光る
    if (game.attack && game.attack.a.enemy === e.id && !game.attack.fired) {
      var size = d.shape === 'rect' ? Math.max(d.w, d.h) / 2 : d.r;
      var ch = game.attack.t / 0.35;
      var aura = ctx.createRadialGradient(0, 0, size * 0.5, 0, 0, size * (1.3 + ch * 0.6));
      aura.addColorStop(0, 'rgba(255,60,60,0)'); aura.addColorStop(0.6, 'rgba(255,60,60,' + (0.5 * ch).toFixed(3) + ')'); aura.addColorStop(1, 'rgba(255,60,60,0)');
      ctx.fillStyle = aura;
      ctx.beginPath(); ctx.arc(0, 0, size * (1.3 + ch * 0.6), 0, Math.PI * 2); ctx.fill();
    }
    ctx.scale(s * (1 + wob), s * (1 - wob));
    if (d.look === 'golem') drawGolem(d, t);
    else if (d.look === 'dragon') drawDragon(d, t);
    else drawSlime(d, t);
    if (f.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.75 * f.flash).toFixed(3) + ')';
      if (d.shape === 'rect') { roundRect(ctx, -d.w / 2, -d.h / 2, d.w, d.h, 10); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0, 0, d.r, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.restore();
  }

  function drawSlime(d, t) {
    var r = d.r, c = d.colors, sq = Math.sin(t * 3 + d.x) * 0.05;
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(4, r * 0.82, r * 0.95, r * 0.32, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.scale(1 + sq, 1 - sq);
    var g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
    g.addColorStop(0, c[0]); g.addColorStop(0.6, c[1]); g.addColorStop(1, c[2]);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2; ctx.stroke();
    // 目（怒り顔）
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-r * 0.32, -r * 0.08, r * 0.2, r * 0.23, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * 0.32, -r * 0.08, r * 0.2, r * 0.23, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#10152a';
    ctx.beginPath(); ctx.arc(-r * 0.28, -r * 0.02, r * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.28, -r * 0.02, r * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#10152a'; ctx.lineWidth = r * 0.08; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-r * 0.52, -r * 0.38); ctx.lineTo(-r * 0.14, -r * 0.24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r * 0.52, -r * 0.38); ctx.lineTo(r * 0.14, -r * 0.24); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, r * 0.42, r * 0.16, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(-r * 0.4, -r * 0.55, r * 0.3, r * 0.13, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawGolem(d, t) {
    var w = d.w, h = d.h;
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(4, h * 0.6, w * 0.52, h * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    var g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
    g.addColorStop(0, '#aab3c6'); g.addColorStop(0.5, '#6b7488'); g.addColorStop(1, '#3a4152');
    ctx.fillStyle = g;
    roundRect(ctx, -w / 2, -h / 2, w, h, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 2; ctx.stroke();
    // 石積み
    ctx.strokeStyle = 'rgba(20,24,36,.45)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-w / 2 + 4, 0); ctx.lineTo(w / 2 - 4, 0); ctx.stroke();
    for (var x = -w / 2 + 30; x < w / 2 - 10; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, -h / 2 + 3); ctx.lineTo(x, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 20, 0); ctx.lineTo(x + 20, h / 2 - 3); ctx.stroke();
    }
    // 苔
    ctx.fillStyle = '#4caf6a';
    ctx.beginPath(); ctx.moveTo(-w / 2 + 8, -h / 2);
    for (var mx = -w / 2 + 8; mx <= w / 2 - 8; mx += 12) ctx.quadraticCurveTo(mx + 6, -h / 2 + 7 + Math.sin(mx) * 2, mx + 12, -h / 2);
    ctx.closePath(); ctx.fill();
    // 光る目
    var glow = 0.7 + 0.3 * Math.sin(t * 4);
    ctx.shadowColor = '#ff9a3c'; ctx.shadowBlur = 12 * glow;
    ctx.fillStyle = '#ffb057';
    ctx.beginPath(); ctx.arc(-w * 0.12, -h * 0.02, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(w * 0.12, -h * 0.02, 6, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawDragon(d, t) {
    var r = d.r, flap = Math.sin(t * 3) * 0.12;
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.beginPath(); ctx.ellipse(6, r * 0.85, r * 1.2, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    // 翼
    [-1, 1].forEach(function (side) {
      ctx.save();
      ctx.scale(side, 1);
      ctx.rotate(-flap);
      var wg = ctx.createLinearGradient(r * 0.5, 0, r * 1.7, 0);
      wg.addColorStop(0, '#7a1420'); wg.addColorStop(1, '#3a0810');
      ctx.fillStyle = wg;
      ctx.beginPath();
      ctx.moveTo(r * 0.55, -r * 0.35);
      ctx.lineTo(r * 1.65, -r * 0.95);
      ctx.quadraticCurveTo(r * 1.55, -r * 0.3, r * 1.7, r * 0.15);
      ctx.quadraticCurveTo(r * 1.35, r * 0.0, r * 1.3, r * 0.4);
      ctx.quadraticCurveTo(r * 1.0, r * 0.2, r * 0.6, r * 0.35);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,140,120,.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(r * 0.6, -r * 0.3); ctx.lineTo(r * 1.65, -r * 0.95);
      ctx.moveTo(r * 0.65, -r * 0.1); ctx.lineTo(r * 1.7, r * 0.15);
      ctx.moveTo(r * 0.65, r * 0.1); ctx.lineTo(r * 1.3, r * 0.4); ctx.stroke();
      ctx.restore();
    });
    // 角
    ctx.fillStyle = '#f3e6c4';
    [-1, 1].forEach(function (side) {
      ctx.beginPath();
      ctx.moveTo(side * r * 0.3, -r * 0.8);
      ctx.quadraticCurveTo(side * r * 0.55, -r * 1.25, side * r * 0.78, -r * 1.35);
      ctx.quadraticCurveTo(side * r * 0.62, -r * 1.0, side * r * 0.58, -r * 0.62);
      ctx.closePath(); ctx.fill();
    });
    // 体
    var g = ctx.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#ff9a7a'); g.addColorStop(0.55, '#c0262d'); g.addColorStop(1, '#5a0c12');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 3; ctx.stroke();
    // うろこ
    ctx.strokeStyle = 'rgba(80,0,10,.35)'; ctx.lineWidth = 2;
    for (var i = 0; i < 5; i++) {
      ctx.beginPath(); ctx.arc(-r * 0.5 + i * r * 0.25, -r * 0.55, r * 0.14, 0, Math.PI); ctx.stroke();
    }
    // 腹
    ctx.fillStyle = 'rgba(255,210,150,.55)';
    ctx.beginPath(); ctx.ellipse(0, r * 0.45, r * 0.5, r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    // 目
    [-1, 1].forEach(function (side) {
      ctx.fillStyle = '#ffe14d';
      ctx.beginPath(); ctx.ellipse(side * r * 0.35, -r * 0.15, r * 0.2, r * 0.13, side * 0.35, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a0a04';
      ctx.beginPath(); ctx.ellipse(side * r * 0.35, -r * 0.15, r * 0.04, r * 0.12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#3a0508'; ctx.lineWidth = r * 0.06; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(side * r * 0.6, -r * 0.42); ctx.lineTo(side * r * 0.16, -r * 0.3); ctx.stroke();
    });
    // 口と牙
    ctx.fillStyle = '#3a0508';
    ctx.beginPath(); ctx.ellipse(0, r * 0.18, r * 0.32, r * 0.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    [-0.2, -0.07, 0.07, 0.2].forEach(function (fx0) {
      ctx.beginPath(); ctx.moveTo(r * (fx0 - 0.04), r * 0.1); ctx.lineTo(r * (fx0 + 0.04), r * 0.1); ctx.lineTo(r * fx0, r * 0.2); ctx.closePath(); ctx.fill();
    });
  }

  /** 弱点: 脈打つ光と照準 */
  function drawWeak(e, t) {
    var d = e.def;
    if (!d.weak) return;
    var f = foes[e.id];
    if (f && f.spawn < 1) return;
    for (var i = 0; i < d.weak.length; i++) {
      var w = d.weak[i], x = d.x + w.dx, y = d.y + w.dy, p = 0.5 + 0.5 * Math.sin(t * 6);
      var g = ctx.createRadialGradient(x, y, 0, x, y, w.r * (1.3 + 0.3 * p));
      g.addColorStop(0, 'rgba(255,255,220,1)'); g.addColorStop(0.35, 'rgba(255,209,102,.95)'); g.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, w.r * (1.3 + 0.3 * p), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,240,180,.9)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, w.r + 4, 0, Math.PI * 2); ctx.stroke();
      ctx.save(); ctx.translate(x, y); ctx.rotate(t * 1.5);
      for (var k = 0; k < 4; k++) {
        ctx.rotate(Math.PI / 2);
        ctx.beginPath(); ctx.moveTo(w.r + 7, 0); ctx.lineTo(w.r + 14, 0); ctx.stroke();
      }
      ctx.restore();
    }
  }

  /** HPゲージと攻撃ターン（ボスは画面上部のゲージ） */
  function drawEnemyUi(e, t) {
    var d = e.def, f = foes[e.id];
    if (f && f.spawn < 0.6) return;
    var ex = d.shape === 'rect' ? d.w / 2 : d.r, ey = d.shape === 'rect' ? d.h / 2 : d.r;
    if (!d.boss) {
      var bw = Math.max(56, Math.min(140, ex * 2)), bx = d.x - bw / 2, by = d.y + ey + 8;
      ctx.fillStyle = 'rgba(6,10,24,.8)';
      roundRect(ctx, bx - 2, by - 2, bw + 4, 10, 5); ctx.fill();
      var ratio = e.hp / e.maxHp;
      ctx.fillStyle = ratio > 0.5 ? '#6ee07a' : ratio > 0.25 ? '#ffd166' : '#ff5e5e';
      if (ratio > 0) { roundRect(ctx, bx, by, Math.max(6, bw * ratio), 6, 3); ctx.fill(); }
    }
    // 攻撃ターン
    var cx = d.x - ex * 0.8, cy = d.y - ey * 0.8 - (d.shape === 'rect' ? 6 : 0);
    var danger = e.counter <= 1;
    var pr = danger ? 1 + 0.12 * Math.sin(t * 10) : 1;
    ctx.fillStyle = danger ? '#e02b3c' : 'rgba(10,16,34,.92)';
    ctx.strokeStyle = danger ? '#ffd0d0' : 'rgba(255,255,255,.7)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 13 * pr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = '900 15px "Hiragino Sans","Noto Sans JP",system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(e.counter), cx, cy + 1);
  }

  function drawBossBar(alive) {
    var boss = null;
    for (var i = 0; i < alive.length; i++) if (alive[i].def.boss) boss = alive[i];
    if (!boss) return;
    var W = world.cfg.field.w, x = 16, y = 14, w = W - 32, h = 14;
    ctx.fillStyle = 'rgba(6,10,24,.8)';
    roundRect(ctx, x - 3, y - 3, w + 6, h + 6, 8); ctx.fill();
    var ratio = boss.hp / boss.maxHp;
    var g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#ff4d6d'); g.addColorStop(1, '#ff9f5a');
    ctx.fillStyle = g;
    if (ratio > 0) { roundRect(ctx, x, y, Math.max(8, w * ratio), h, 7); ctx.fill(); }
    ctx.font = '800 11px "Hiragino Sans","Noto Sans JP",system-ui,sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(6,10,24,.9)';
    var label = 'BOSS  ' + boss.def.name + '  ' + boss.hp + ' / ' + boss.maxHp;
    ctx.strokeText(label, x + 8, y + h / 2 + 1);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x + 8, y + h / 2 + 1);
  }

  function drawCombo() {
    if (!(game.phase === 'moving' || game.phase === 'settling') || game.shotHits < 1) return;
    var W = world.cfg.field.w;
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(6,10,24,.85)';
    ctx.font = '900 30px "Hiragino Sans","Noto Sans JP",system-ui,sans-serif';
    var y = battle.alive().some(function (e) { return e.def.boss; }) ? 70 : 48;
    ctx.strokeText(game.shotHits + ' HIT', W - 16, y);
    ctx.fillStyle = '#ffd166';
    ctx.fillText(game.shotHits + ' HIT', W - 16, y);
    ctx.font = '800 13px "Hiragino Sans","Noto Sans JP",system-ui,sans-serif';
    ctx.strokeText(game.shotDamage + ' DAMAGE', W - 16, y + 20);
    ctx.fillStyle = '#fff';
    ctx.fillText(game.shotDamage + ' DAMAGE', W - 16, y + 20);
  }

  /** 敵の攻撃: 単体はビーム、全体は衝撃波 */
  function drawAttack(at) {
    if (!at.fired) return;
    var e = battle.enemy(at.a.enemy);
    if (!e) return;
    var f = Math.min(1, (at.t - 0.35) / 0.6), a = 1 - f;
    if (at.a.kind === 'single') {
      var u = unitById(at.a.target);
      if (!u) return;
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(255,60,80,' + (0.6 * a).toFixed(3) + ')'; ctx.lineWidth = 22 * a + 2;
      ctx.beginPath(); ctx.moveTo(e.def.x, e.def.y); ctx.lineTo(u.body.x, u.body.y); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,240,240,' + a.toFixed(3) + ')'; ctx.lineWidth = 6 * a + 1;
      ctx.beginPath(); ctx.moveTo(e.def.x, e.def.y); ctx.lineTo(u.body.x, u.body.y); ctx.stroke();
    } else {
      var r0 = e.def.shape === 'rect' ? e.def.w / 2 : e.def.r;
      var rr = r0 + f * 900;
      ctx.strokeStyle = 'rgba(255,90,60,' + (0.8 * a).toFixed(3) + ')'; ctx.lineWidth = 30 * a + 2;
      ctx.beginPath(); ctx.arc(e.def.x, e.def.y, rr, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,220,160,' + a.toFixed(3) + ')'; ctx.lineWidth = 6 * a + 1;
      ctx.beginPath(); ctx.arc(e.def.x, e.def.y, rr, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // --- 味方
  function drawTrail(u) {
    var tr = u.trail;
    if (tr.length < 2) return;
    var col = u.def.shot === 'pierce' ? '255,122,69' : '60,200,255';
    for (var i = 0; i < tr.length; i++) {
      var a = (i + 1) / tr.length;
      ctx.fillStyle = 'rgba(' + col + ',' + (0.28 * a).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(tr[i].x, tr[i].y, u.body.r * (0.45 + 0.55 * a), 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawUnit(u, t) {
    var b = u.body, r = b.r, c = u.def.colors;
    var isActive = units[game.active] === u && (game.phase === 'ready' || game.phase === 'pulling');
    ctx.save();
    ctx.translate(b.x, b.y);

    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.beginPath(); ctx.ellipse(3, r * 0.82, r * 0.9, r * 0.32, 0, 0, Math.PI * 2); ctx.fill();

    if (u.glow > 0) {
      var gg = ctx.createRadialGradient(0, 0, r * 0.8, 0, 0, r * 2.2);
      gg.addColorStop(0, 'rgba(255,255,255,' + (0.6 * u.glow).toFixed(3) + ')');
      gg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(0, 0, r * 2.2, 0, Math.PI * 2); ctx.fill();
    }

    if (isActive) {
      var pulse = 0.5 + 0.5 * Math.sin(t * 5);
      ctx.strokeStyle = 'rgba(255,209,102,' + (0.45 + 0.4 * pulse).toFixed(3) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r + 9 + pulse * 3, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#ffd166';
      var ay = -r - 22 - pulse * 4;
      ctx.beginPath(); ctx.moveTo(-7, ay); ctx.lineTo(7, ay); ctx.lineTo(0, ay + 9); ctx.closePath(); ctx.fill();
    }

    ctx.rotate(u.facing);
    var sq = u.squash * 0.18;
    ctx.scale(1 - sq, 1 + sq * 0.7);

    // 撃種の印: 貫通は進行方向の槍先、反射は二重の輪
    if (u.def.shot === 'pierce') {
      var tip = ctx.createLinearGradient(r - 4, 0, r + 20, 0);
      tip.addColorStop(0, '#ffe7b8'); tip.addColorStop(1, '#ffffff');
      ctx.fillStyle = tip;
      ctx.beginPath(); ctx.moveTo(r - 6, -11); ctx.lineTo(r + 20, 0); ctx.lineTo(r - 6, 11); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#8a1f14'; ctx.lineWidth = 1.5; ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(160,235,255,.85)'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, r + 4.5, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(60,200,255,.35)'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(0, 0, r + 8, 0, Math.PI * 2); ctx.stroke();
    }

    var body = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
    body.addColorStop(0, c[0]); body.addColorStop(0.55, c[1]); body.addColorStop(1, c[2]);
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2.5; ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(r * 0.28, -r * 0.3, r * 0.2, r * 0.24, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * 0.28, r * 0.3, r * 0.2, r * 0.24, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#10152a';
    ctx.beginPath(); ctx.arc(r * 0.36, -r * 0.3, r * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.36, r * 0.3, r * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(b.x - r * 0.35, b.y - r * 0.5, r * 0.35, r * 0.16, -0.5, 0, Math.PI * 2); ctx.fill();

    var label = u.def.name + ' ' + SHOT_LABEL[u.def.shot];
    var abil = (u.def.abilities || []).map(function (a) { return ABILITY[a]; });
    ctx.font = '700 12px "Hiragino Sans","Noto Sans JP",system-ui,sans-serif';
    var lw = ctx.measureText(label).width;
    ctx.font = '800 10px "Hiragino Sans","Noto Sans JP",system-ui,sans-serif';
    var aw = abil.reduce(function (a, x) { return a + ctx.measureText(x.short).width + 6; }, 0);
    var tw = lw + aw + 12;
    var ly = b.y + r + 10, lx = b.x - tw / 2;
    ctx.fillStyle = 'rgba(6,10,24,.75)';
    roundRect(ctx, lx, ly, tw, 18, 9); ctx.fill();
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.font = '700 12px "Hiragino Sans","Noto Sans JP",system-ui,sans-serif';
    ctx.fillStyle = u.def.accent;
    ctx.fillText(label, lx + 6, ly + 9.5);
    ctx.font = '800 10px "Hiragino Sans","Noto Sans JP",system-ui,sans-serif';
    var ax = lx + 6 + lw + 6;
    abil.forEach(function (x) { ctx.fillStyle = x.color; ctx.fillText(x.short, ax, ly + 10); ax += ctx.measureText(x.short).width + 6; });
    ctx.textAlign = 'center';
    if (u.def.combo) {
      ctx.font = '700 10px "Hiragino Sans","Noto Sans JP",system-ui,sans-serif';
      ctx.fillStyle = 'rgba(220,230,255,.75)';
      ctx.fillText('友情: ' + u.def.combo.name, b.x, ly + 27);
    }
  }

  function drawGuide(u, aim, t) {
    var v = aim.v, pts = aim.pred.points, b = u.body;
    var col = u.def.shot === 'pierce' ? '255,122,69' : '120,220,255';

    var total = 0, lens = [0];
    for (var i = 1; i < pts.length; i++) { total += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); lens.push(total); }
    var gap = 16, off = (t * 60) % gap, seg = 1;
    for (var d = b.r + 10 + off; d < total; d += gap) {
      while (seg < pts.length - 1 && lens[seg] < d) seg++;
      var p0 = pts[seg - 1], p1 = pts[seg], L = lens[seg] - lens[seg - 1] || 1;
      var f = (d - lens[seg - 1]) / L;
      var x = p0.x + (p1.x - p0.x) * f, y = p0.y + (p1.y - p0.y) * f;
      var a = 1 - d / total;
      ctx.fillStyle = 'rgba(' + col + ',' + (0.15 + 0.75 * a).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(x, y, 3 + 2 * a, 0, Math.PI * 2); ctx.fill();
    }
    for (var j = 0; j < aim.pred.contacts.length; j++) {
      var cp = aim.pred.contacts[j];
      ctx.strokeStyle = cp.type === 'weak' ? 'rgba(255,209,102,.95)' : 'rgba(' + col + ',.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cp.x, cp.y, 7 + Math.sin(t * 8) * 1.5, 0, Math.PI * 2); ctx.stroke();
    }

    var ang = Math.atan2(v.vy, v.vx);
    var len = 36 + 96 * v.power, wid = 12 + 10 * v.power;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(ang);
    var grad = ctx.createLinearGradient(b.r, 0, b.r + len + 22, 0);
    grad.addColorStop(0, 'rgba(255,255,255,.2)');
    grad.addColorStop(1, v.power > 0.98 ? '#ffd166' : 'rgba(' + col + ',1)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(b.r + 6, -wid / 2 * 0.55);
    ctx.lineTo(b.r + 6 + len, -wid / 2 * 0.55);
    ctx.lineTo(b.r + 6 + len, -wid);
    ctx.lineTo(b.r + 6 + len + 24, 0);
    ctx.lineTo(b.r + 6 + len, wid);
    ctx.lineTo(b.r + 6 + len, wid / 2 * 0.55);
    ctx.lineTo(b.r + 6, wid / 2 * 0.55);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();

    ctx.strokeStyle = v.power > 0.98 ? '#ffd166' : 'rgba(' + col + ',.9)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 14, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0.02, v.power)); ctx.stroke();
  }

  function drawPullOrigin(p) {
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2;
    ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(p.sx, p.sy); ctx.lineTo(p.sx + p.dx, p.sy + p.dy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(p.sx, p.sy, world.cfg.pull.dead, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(p.sx + p.dx, p.sy + p.dy, 6, 0, Math.PI * 2); ctx.fill();
  }

  function drawFx() {
    var i;
    for (i = 0; i < fx.rings.length; i++) {
      var r = fx.rings[i], a = 1 - r.life / r.max;
      ctx.globalAlpha = a;
      ctx.strokeStyle = r.color; ctx.lineWidth = 3 * a + 1;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (0.4 + (1 - a)), 0, Math.PI * 2); ctx.stroke();
    }
    for (i = 0; i < fx.particles.length; i++) {
      var p = fx.particles[i], pa = 1 - p.life / p.max;
      ctx.globalAlpha = pa;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * pa + 0.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (i = 0; i < fx.texts.length; i++) {
      var tx = fx.texts[i], ta = 1 - tx.life / tx.max;
      ctx.globalAlpha = Math.min(1, ta * 2.5);
      var pop = tx.life < 0.12 ? 1 + (0.12 - tx.life) * 4 : 1;
      ctx.font = '900 ' + Math.round(tx.size * pop) + 'px "Hiragino Sans","Noto Sans JP",system-ui,sans-serif';
      ctx.lineWidth = Math.max(4, tx.size / 6); ctx.strokeStyle = 'rgba(6,10,24,.85)';
      var y = tx.still ? tx.y : tx.y - (1 - ta) * 24;
      ctx.strokeText(tx.text, tx.x, y);
      ctx.fillStyle = tx.color;
      ctx.fillText(tx.text, tx.x, y);
    }
    ctx.globalAlpha = 1;
  }

  // ---------------------------------------------------------------- 調整パネル
  var TUNE = [
    { key: 'speed.max', label: '最大初速', min: 1000, max: 3200, step: 50, fmt: 0 },
    { key: 'speed.min', label: '最小初速', min: 200, max: 1200, step: 20, fmt: 0 },
    { key: 'friction.linear', label: '摩擦（一定分）', min: 0, max: 700, step: 10, fmt: 0 },
    { key: 'friction.drag', label: '摩擦（速さに比例）', min: 0, max: 1.2, step: 0.01, fmt: 2 },
    { key: 'wall.restitution', label: '壁の反発（残る速さ）', min: 0.5, max: 1, step: 0.01, fmt: 2 },
    { key: 'reflect.restitution', label: '反射の反発（残る速さ）', min: 0.5, max: 1, step: 0.01, fmt: 2 },
    { key: 'pierce.enterFactor', label: '貫通の減速（残る速さ）', min: 0.3, max: 1, step: 0.01, fmt: 2 },
    { key: 'pierce.insideDrag', label: '貫通中の摩擦倍率', min: 1, max: 6, step: 0.1, fmt: 1 }
  ];

  function getPath(o, key) { return key.split('.').reduce(function (a, k) { return a[k]; }, o); }
  function setPath(o, key, v) {
    var ks = key.split('.'), last = ks.pop();
    var tgt = ks.reduce(function (a, k) { if (!a[k]) a[k] = {}; return a[k]; }, o);
    tgt[last] = v;
  }

  function buildTune() {
    el.tuneList.innerHTML = '';
    TUNE.forEach(function (d) {
      var label = document.createElement('label');
      var name = document.createElement('span'); name.textContent = d.label;
      var out = document.createElement('output');
      var input = document.createElement('input');
      input.type = 'range'; input.min = d.min; input.max = d.max; input.step = d.step;
      input.value = getPath(world.cfg, d.key);
      input.dataset.key = d.key;
      out.textContent = Number(input.value).toFixed(d.fmt);
      input.addEventListener('input', function () {
        var v = Number(input.value);
        setPath(world.cfg, d.key, v);
        setPath(cfgOverrides, d.key, v);
        out.textContent = v.toFixed(d.fmt);
      });
      label.appendChild(name); label.appendChild(out); label.appendChild(input);
      el.tuneList.appendChild(label);
    });
  }

  el.tuneBtn.addEventListener('click', function () {
    var open = el.tune.hidden;
    el.tune.hidden = !open;
    el.tuneBtn.setAttribute('aria-expanded', String(open));
  });
  document.getElementById('btn-tune-close').addEventListener('click', function () {
    el.tune.hidden = true;
    el.tuneBtn.setAttribute('aria-expanded', 'false');
  });
  document.getElementById('btn-tune-default').addEventListener('click', function () {
    cfgOverrides = {};
    world.cfg = P.mergeDeep(P.DEFAULTS, {});
    buildTune();
  });
  function restart() {
    buildWorld();
    buildTune();
    resize();
  }
  document.getElementById('btn-reset').addEventListener('click', restart);
  document.getElementById('btn-retry').addEventListener('click', restart);
  el.sound.addEventListener('click', function () {
    var on = sound.toggle();
    el.sound.textContent = on ? '音 ON' : '音 OFF';
    el.sound.setAttribute('aria-pressed', String(on));
  });

  // ---------------------------------------------------------------- 起動
  buildWorld();
  buildTune();
  el.sound.textContent = sound.on ? '音 ON' : '音 OFF';
  el.sound.setAttribute('aria-pressed', String(sound.on));
  resize();
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    update(dt);
    render(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /** テストと調整用の窓口。ゲームの進行はここを通さなくても完結する。 */
  window.__ms = {
    get world() { return world; },
    get battle() { return battle; },
    get phase() { return game.phase; },
    get turn() { return battle.turn; },
    get active() { return activeUnit().def.id; },
    get shownHp() { return shownHp; },
    get aim() { return pull && pull.aim ? { power: pull.aim.v.power, points: pull.aim.pred.points.length, contacts: pull.aim.pred.contacts.length } : null; },
    body: function (id) { var b = world.get(id); return b && { x: b.x, y: b.y, r: b.r, vx: b.vx, vy: b.vy, moving: b.moving }; },
    /** フィールド座標 → ページ座標（E2E でキャラを掴むため） */
    toClient: function (x, y) {
      var r = canvas.getBoundingClientRect();
      return { x: r.left + (x + WALL) * view.scale, y: r.top + (y + WALL) * view.scale };
    },
    get scale() { return view.scale; },
    setTimeScale: function (s) { game.timeScale = s; }
  };
})();
</script>
</body>
