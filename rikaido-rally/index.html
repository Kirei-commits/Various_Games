<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="記述式5問の理解度テストラリー。正解するまでヒントで伴走し、A〜Eで評価します。採点基準と制御の中身をその場で開示します。" />
<title>理解度アップ・テストラリー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1220'/%3E%3Cpath d='M7 21l5-10 5 10' stroke='%2364e3b0' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M9.4 18h5.2' stroke='%2364e3b0' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='12' r='3' fill='%23ffc857'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="top-main">
      <h1>理解度アップ・<span>テストラリー</span></h1>
      <p class="lead">記述式で5問。正解するまでヒントで伴走します。評価は A〜E。</p>
    </div>
    <div class="top-side">
      <div class="banks" id="bank-tabs" role="tablist" aria-label="問題集"></div>
      <label class="toggle">
        <input type="checkbox" id="teacher" />
        <span>講師モード（採点基準を先に開示）</span>
      </label>
    </div>
  </header>

  <main class="grid">

    <section class="stage" aria-label="出題">
      <div class="rally-head">
        <div class="rally-title">
          <span class="tag">今回の単元（自動生成）</span>
          <strong id="unit-title">—</strong>
          <p id="unit-reason" class="muted"></p>
        </div>
        <ol class="steps" id="steps" aria-label="進行"></ol>
      </div>

      <div class="chat" id="chat" aria-live="polite"></div>

      <form class="answer" id="answer-form">
        <label class="sr-only" for="answer">回答</label>
        <textarea id="answer" rows="3" placeholder="自分の言葉で書いてください（用語だけでなく理由も）" autocomplete="off"></textarea>
        <div class="answer-actions">
          <button type="submit" id="submit" class="btn primary">回答する</button>
          <button type="button" id="next" class="btn" hidden>次の問題へ</button>
          <button type="button" id="finish" class="btn primary" hidden>結果を見る</button>
          <span class="hintcount" id="hintcount"></span>
        </div>
      </form>
    </section>

    <section class="result" id="result" hidden aria-label="結果"></section>

    <aside class="mech" aria-label="しくみ">
      <h2>しくみを見る</h2>
      <p class="muted small">ここに出る説明文と数字は、実際に動いているコードの定数と戻り値をそのまま表示しています。</p>

      <details open id="m-plan"><summary>1. このラリーの組み立て</summary><div class="m-body"></div></details>
      <details id="m-criteria"><summary>2. いまの問題の採点基準</summary><div class="m-body"></div></details>
      <details open id="m-log"><summary>3. 直前の判定ログ</summary><div class="m-body"></div></details>
      <details id="m-grade"><summary>4. 評価（A〜E）の出し方</summary><div class="m-body"></div></details>
      <details id="m-state"><summary>5. 進行の制御（状態）</summary><div class="m-body"></div></details>
      <details id="m-levels"><summary>6. 問題レベルの決め方と品揃え</summary><div class="m-body"></div></details>
    </aside>

  </main>

  <footer>
    <button type="button" id="restart" class="btn ghost">このラリーをやり直す</button>
    <button type="button" id="wipe" class="btn ghost">成績を消す</button>
    <span class="muted small" id="progress-note"></span>
  </footer>

</div>

<script src="js/judge.js"></script>
<script src="js/grade.js"></script>
<script src="js/hint.js"></script>
<script src="js/banks.js"></script>
<script src="js/bank-java.js"></script>
<script src="js/bank-kuwata.js"></script>
<script src="js/rally.js"></script>
<script src="js/storage.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
