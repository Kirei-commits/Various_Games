# 開発用の依存（Playwright）と Actions のバージョンを追従させる。
# 実行時の依存はゼロなので、更新が配信物に影響することはない。
version: 2
updates:
  - package-ecosystem: npm
    directory: /god-arena
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /gomoku-narabe
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  # react-training は React を index.html に埋めこんでいる。更新を取りこんだら npm run build し直すこと
  # （ビルドし直さなくても lint は落ちないが、配っている index.html は古い版のまま）。
  - package-ecosystem: npm
    directory: /react-training
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
