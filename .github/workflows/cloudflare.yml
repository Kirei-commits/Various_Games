# SwipeTalk（eikaiwa-swipe）を Cloudflare に公開する。
# ほかのゲームと別の住所（オリジン）に置くためのもの。GitHub Pages（pages.yml）はそのまま動く。
#
# 初回だけ手作業が要る（くわしくは eikaiwa-swipe/CLOUDFLARE_SETUP.md）:
#   Settings → Secrets and variables → Actions → Secrets に
#   CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を作る。作るまで、このワークフローは何もせず緑で終わる。
#
# デフォルトブランチへの push: 本番を入れ替える。
# 手動実行（workflow_dispatch）でほかのブランチを選ぶ: 本番は変えず、お試し用の URL だけ作る。
name: Cloudflare

on:
  push:
    branches: [main, claude/cyberpunk-gomoku-game-70crr8]
    paths: ['eikaiwa-swipe/**', '.github/workflows/cloudflare.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 公開（SwipeTalk）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: eikaiwa-swipe
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # wrangler は版を固定する（公開の鍵を持った状態で動くので、勝手に新しい版へ上がらないようにする）
      WRANGLER: wrangler@4.161.0
    steps:
      - id: ready
        name: Cloudflare の鍵があるか確かめる
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定なので、公開せずに終わります"
          fi
        working-directory: .

      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v7

      - if: steps.ready.outputs.ok == 'true'
        name: ビルド済みの index.html が最新か確かめ、公開するファイルを集める
        run: |
          node tests/lint.mjs
          node tools/cf-site.mjs

      - if: steps.ready.outputs.ok == 'true' && (github.ref_name == github.event.repository.default_branch || github.ref_name == 'main')
        name: 本番を公開する
        run: npx --yes "$WRANGLER" deploy 2>&1 | tee deploy.log

      - if: steps.ready.outputs.ok == 'true' && github.ref_name != github.event.repository.default_branch && github.ref_name != 'main'
        name: お試し用の URL を作る（本番は変えない）
        run: npx --yes "$WRANGLER" versions upload 2>&1 | tee deploy.log

      # 公開された URL を開いて、リポジトリと同じ版が出ているか・守りのヘッダーが付いているかを確かめる
      - if: steps.ready.outputs.ok == 'true'
        name: 公開されたページを確かめる
        run: |
          url=$(grep -o 'https://[a-z0-9.-]*\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "公開先の URL が分からない"; exit 1; }
          echo "公開先: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          want=$(grep -o 'source-hash: [0-9a-f]*' index.html)
          for try in 1 2 3 4 5 6; do
            if curl -fsS -D headers.txt "$url/" | grep -q "$want" && grep -qi '^content-security-policy:' headers.txt; then
              echo "最新の版が、守りのヘッダー付きで公開されている"; exit 0
            fi
            sleep 10
          done
          echo "公開されたページが確かめられない"; exit 1
