# 静的サイトとして GitHub Pages に公開する。
# 配るものの選び方は `.github/scripts/build-site.mjs` が持っていて、CIの「配信物の組み立て」
# ジョブと同じものを使う。ここでゲーム名を数え上げない（増えても直さなくてよい）。
#
# 初回だけ手作業が要る:
#   リポジトリの Settings → Pages → Build and deployment → Source を
#   「GitHub Actions」にする。それまでこのワークフローは失敗する
#   （CIとは別のワークフローなので、CIの緑には影響しない）。
name: Pages

on:
  push:
    # このリポジトリには main が無く、デフォルトブランチは
    # claude/cyberpunk-gomoku-game-70crr8 になっている（作られた経緯のまま）。
    # main しか書かないと永久に発火しないので、実際のデフォルトブランチを書く。
    # main へ改名したらこの行を main だけにする。
    branches: [main, claude/cyberpunk-gomoku-game-70crr8]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は最新のものだけでよいので、走っている途中でも新しい方を優先する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 公開
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 配信物に開発用のもの（node_modules・テスト・レポート）を混ぜない
      - name: 配信するファイルを集める
        run: node .github/scripts/build-site.mjs --out _site --budget 600

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
