# 静的サイトとして GitHub Pages に公開する。
# ビルド工程は無く、リポジトリの中身をそのまま配る（各ゲームは index.html だけで動く）。
#
# 初回だけ手作業が要る:
#   リポジトリの Settings → Pages → Build and deployment → Source を
#   「GitHub Actions」にする。それまでこのワークフローは失敗する
#   （CIとは別のワークフローなので、CIの緑には影響しない）。
#
# プレビュー: claude/monster-strike-* のブランチに push すると、マージ前の版を
#   https://<owner>.github.io/<repo>/preview/monster-strike/ で遊べる（ほかはデフォルトブランチの中身）。
#   デフォルトブランチに push すると、プレビューは消えて本番だけになる。
#   Settings → Environments → github-pages の「Deployment branches」がデフォルトブランチだけに
#   なっていると、プレビューの公開は断られる（その場合は claude/monster-strike-* を足す）。
#   ブランチを許したら、Settings → Secrets and variables → Actions → Variables に PAGES_PREVIEW = true を作る。
name: Pages

on:
  push:
    # このリポジトリには main が無く、デフォルトブランチは
    # claude/cyberpunk-gomoku-game-70crr8 になっている（作られた経緯のまま）。
    # main しか書かないと永久に発火しないので、実際のデフォルトブランチを書く。
    # main へ改名したらこの行を main だけにする。
    branches: [main, claude/cyberpunk-gomoku-game-70crr8, 'claude/monster-strike-*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は最新のものだけでよいので、走っている途中でも新しい方を優先する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 公開
    # プレビューのブランチは、リポジトリの変数 PAGES_PREVIEW が 'true' のときだけ公開する
    # （github-pages の環境の保護でブランチが許されていないと失敗するので、設定するまでは走らせない）
    if: github.ref_name == github.event.repository.default_branch || github.ref_name == 'main' || vars.PAGES_PREVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 本番はいつもデフォルトブランチの中身
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      # プレビューのブランチなら、そのブランチも取ってくる
      - if: github.ref_name != github.event.repository.default_branch && github.ref_name != 'main'
        uses: actions/checkout@v7
        with:
          path: _preview

      # src/ からビルドするゲームは、index.html が古いまま公開されないように確かめる（依存なしで動く）
      - name: ビルド済みの index.html が最新か確かめる
        run: |
          for game in */; do
            game=${game%/}
            # --check を実装しているビルドだけ（ほかのビルドは --check を知らずに作り直してしまう）
            if [ -f "$game/tools/build.mjs" ] && grep -q -- "'--check'" "$game/tools/build.mjs"; then
              (cd "$game" && node tools/build.mjs --check)
            fi
          done

      # 配信物に開発用のものを混ぜない（node_modules やテスト結果）
      - name: 配信するファイルだけを集める
        run: |
          mkdir -p _site
          cp index.html _site/ 2>/dev/null || true
          # eikaiwa-swipe は index.html に CSS/JS・絵をすべて埋め込んである。録音（audio/）だけは大きいので別ファイルで配る
          for game in god-arena gomoku-narabe tsuri-quest eikaiwa-swipe monster-strike pachinko-gokugoku minigame-rush; do
            mkdir -p "_site/$game"
            cp -r "$game/index.html" "$game/css" "$game/js" "$game/audio" "_site/$game/" 2>/dev/null || true
          done
          if [ -f _preview/monster-strike/index.html ]; then
            mkdir -p _site/preview/monster-strike
            cp _preview/monster-strike/index.html _site/preview/monster-strike/
            echo "プレビュー: ${GITHUB_REF_NAME}"
          fi
          ls -R _site | head -40

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5

      # 公開したあと、実際の URL を開いて全部のゲームが返ってくるか確かめる。
      # src/ からビルドするゲームは、公開された版のハッシュがリポジトリと同じか（＝最新が出たか）も見る。
      # 反映に少し時間がかかるので、数回待ってやり直す。
      - name: 公開されたページを確かめる
        if: github.ref_name == github.event.repository.default_branch || github.ref_name == 'main'
        env:
          URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          ok=0
          for try in 1 2 3 4 5 6; do
            ok=1
            curl -fsS "$URL" -o /dev/null || ok=0
            for game in god-arena gomoku-narabe tsuri-quest eikaiwa-swipe monster-strike pachinko-gokugoku minigame-rush; do
              page=$(curl -fsS "$URL$game/" || true)
              if [ -z "$page" ]; then echo "まだ開けない: $game"; ok=0; continue; fi
              want=$(grep -o 'name="[a-z]*-source-hash" content="[0-9a-f]*"' "$game/index.html" || true)
              if [ -n "$want" ] && ! printf '%s' "$page" | grep -q "$want"; then echo "古い版のまま: $game"; ok=0; fi
            done
            [ $ok = 1 ] && break
            sleep 20
          done
          [ $ok = 1 ] || { echo "公開されたページが確かめられない"; exit 1; }
          echo "全部のゲームが最新の版で公開されている"