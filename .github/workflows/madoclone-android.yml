name: madoclone Android ビルド

# 手動で実行する（Actions タブ → 「madoclone Android ビルド」→ Run workflow）。
# 必要な Secrets（Unity の個人ライセンス。GameCI の手順に従って取得）：UNITY_LICENSE、UNITY_EMAIL、UNITY_PASSWORD
# 出力：成果物 madoclone-apk（APK）。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Library のキャッシュ
        uses: actions/cache@v4
        with:
          path: madoclone/Library
          key: madoclone-Library-${{ hashFiles('madoclone/Packages/manifest.json', 'madoclone/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: madoclone-Library-

      - name: マスタ JSON の検証（dotnet）
        working-directory: madoclone
        run: bash scripts/check.sh

      - name: Android ビルド
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: madoclone
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: Mado.View.Editor.MadoBuild.BuildAndroid

      - uses: actions/upload-artifact@v4
        with:
          name: madoclone-apk
          path: madoclone/Builds/
