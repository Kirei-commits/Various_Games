# ゲームを追加したら、下の changes ジョブの ALL にディレクトリ名を足すこと。
# 各ゲームの検査は、そのゲームのディレクトリ（か、この ci.yml）が変わったときだけ走る。
# 関係ないゲームの検査で待たされたり、そちらの不安定なテストで赤くなったりしないようにするため。
name: CI

on:
  push:
    # このリポジトリのデフォルトブランチは claude/cyberpunk-gomoku-game-70crr8。
    # 作業ブランチでも回して、PRを開く前に緑かどうかを確かめられるようにする
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチへ続けてpushしたら古い実行は打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 変わったゲームを調べて、下のジョブの matrix に渡す
  changes:
    name: 変わったゲームを調べる
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      games: ${{ steps.pick.outputs.games }}
      kyozai: ${{ steps.pick.outputs.kyozai }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: pick
        name: 比べる相手を決めて差分を取る
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          ALL="god-arena gomoku-narabe tsuri-quest eikaiwa-swipe monster-strike pachinko-gokugoku minigame-rush"
          from=""
          if [ "$EVENT" = pull_request ]; then
            from="$BASE"
          elif [ "$EVENT" = push ]; then
            # 新しいブランチの最初の push（before が 0 だけ）はデフォルトブランチとの分かれ目から比べる
            if [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              from="$BEFORE"
            else
              from=$(git merge-base HEAD "origin/$DEFAULT" 2>/dev/null || true)
            fi
          fi
          # 手動実行や、比べる相手が分からないときは全部
          if [ -z "$from" ]; then
            changed="*"
          else
            changed=$(git diff --name-only "$from" HEAD)
            echo "$changed"
            # CI の設定そのものを変えたときは全部
            if printf '%s\n' "$changed" | grep -qx '.github/workflows/ci.yml'; then changed="*"; fi
          fi
          games=""
          for g in $ALL; do
            if [ "$changed" = "*" ] || printf '%s\n' "$changed" | grep -q "^$g/"; then
              games="$games${games:+,}\"$g\""
            fi
          done
          echo "games=[$games]" | tee -a "$GITHUB_OUTPUT"
          # kyozai-quiz はゲームではなく Python のアプリなので、上の matrix とは別のジョブで調べる
          kyozai=false
          if [ "$changed" = "*" ] || printf '%s\n' "$changed" | grep -q "^kyozai-quiz/"; then kyozai=true; fi
          echo "kyozai=$kyozai" | tee -a "$GITHUB_OUTPUT"

  checks:
    name: 静的検査とロジックテスト (${{ matrix.game }})
    needs: changes
    if: needs.changes.outputs.games != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.changes.outputs.games) }}
    defaults:
      run:
        working-directory: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.game }}/package-lock.json

      # lint は Node の標準機能だけで動くので依存のインストール前に実行できる
      - name: 構文チェックと参照ファイルの整合性
        run: npm run lint

      - name: 依存をインストール
        run: npm ci

      - name: ロジックテスト
        run: npm run test:logic

  e2e:
    name: ブラウザテスト (${{ matrix.game }})
    needs: changes
    if: needs.changes.outputs.games != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.changes.outputs.games) }}
    defaults:
      run:
        working-directory: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.game }}/package-lock.json

      - name: 依存をインストール
        run: npm ci

      # --with-deps を省くとローカルでは通るのにCIだけ落ちる（libnss等が入らない）
      - name: Chromium と実行に必要なシステムライブラリを導入
        run: npx playwright install --with-deps chromium

      - name: E2Eテスト（デスクトップ + スマホのタッチ操作）
        run: npm run test:e2e

      # 失敗したときこそレポートが要るので if: always() を必ず付ける
      - name: テストレポートを保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.game }}
          path: ${{ matrix.game }}/playwright-report/
          retention-days: 14

      - name: 失敗時のトレースとスクリーンショットを保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.game }}
          path: ${{ matrix.game }}/test-results/
          retention-days: 7

  # 決められた局面を確かめる E2E とは別に、実ブラウザで決着まで通しプレイして
  # 「詰み・停止・表示崩れ」を探す。E2Eでは見つからない種類の壊れ方を拾う。
  playtest:
    name: 通しプレイ (god-arena)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.games), 'god-arena')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: god-arena
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: god-arena/package-lock.json

      - name: 依存をインストール
        run: npm ci

      - name: Chromium と実行に必要なシステムライブラリを導入
        run: npx playwright install --with-deps chromium

      # 局数はCIの時間に合わせて絞る。手元では --games を増やして回す。
      - name: 決着までの通しプレイ
        run: npm run playtest -- --games 1 --keep

      - name: 通しプレイのスクリーンショットを保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playtest-shots
          path: god-arena/playtest-shots/
          retention-days: 7

  # ミニゲームラッシュのバランスを表にして、ジョブのサマリーに出す（PR で難しさの変化が一目で分かる）。
  # 合否はロジックテスト（balance.test.mjs）が決めるので、ここは情報だけ。依存のインストールも要らない。
  balance:
    name: バランスの測定 (minigame-rush)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.games), 'minigame-rush')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: minigame-rush
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: ボットで各ステージを遊んで表にする
        run: node tools/measure.mjs 1,5,10,20,30,45,60,80,99 normal 3 --md | tee -a "$GITHUB_STEP_SUMMARY"

  # 教材登録・問題生成アプリ（Python）。Gemini は呼ばず、偽のクライアントで登録〜問題生成まで通す。
  kyozai-quiz:
    name: テスト (kyozai-quiz)
    needs: changes
    if: needs.changes.outputs.kyozai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kyozai-quiz
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kyozai-quiz/mermaid-validator/package-lock.json

      # pptx → PDF の変換に使う
      - name: LibreOffice を導入
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libreoffice-impress

      - name: Mermaid 構文チェッカーの依存をインストール
        run: npm ci --prefix mermaid-validator

      - name: 依存をインストール
        run: pip install -e '.[dev]'

      - name: テスト
        run: pytest -q -rs

      # ブラウザ版（GitHub Pages で公開する kyozai-quiz/web）
      - name: ブラウザ版の依存をインストール
        run: npm ci --prefix web

      - name: ブラウザ版のロジックテスト（Python 版との一致も確かめる）
        working-directory: kyozai-quiz/web
        run: npm run test:logic

      - name: Chromium を導入
        working-directory: kyozai-quiz/web
        run: npx playwright install --with-deps chromium

      # Gemini API は偽物に差し替える。pdf.js・mermaid などは CDN から読む
      - name: ブラウザ版の E2E テスト
        working-directory: kyozai-quiz/web
        run: npm run test:e2e

      - name: E2E のレポートを保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-kyozai-quiz
          path: kyozai-quiz/web/playwright-report/
          retention-days: 7
