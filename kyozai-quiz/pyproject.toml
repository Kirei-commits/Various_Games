[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyozai-quiz"
version = "0.1.0"
description = "pptx教材を登録し、図解を含む内容に沿った問題を生成するCLI"
requires-python = ">=3.10"
dependencies = [
  "python-pptx>=1.0",
  "pymupdf>=1.24",
  "google-genai>=1.0",
  "pydantic>=2.6",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kyozai = "kyozai_quiz.cli:app"

[tool.setuptools]
packages = ["kyozai_quiz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
