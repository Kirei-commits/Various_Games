<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI組織ボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" />
<style>
/* Layout: 上に投稿先と社長、中央に CEO→部署の組織図（光る配線つき）、右に道具、下に今日の投稿と流れるログ */
:root {
  color-scheme: dark;
  --bg: #090c1a;
  --panel: #10152b;
  --card: #151b36;
  --line: #262f57;
  --fg: #e8ebff;
  --dim: #8a92bd;
  --faint: #4b5384;
  --gold: #ffb547;
  --c-research: #a77bff;
  --c-write: #ff9c3a;
  --c-image: #ff6fb0;
  --c-review: #ffd84a;
  --c-post: #4ab3ff;
  --c-analysis: #3ee39b;
  --ok: #3ee39b;
  --ng: #ff6a6a;
  --bubble: #f6f7ff;
  --bubble-fg: #101428;
  --f-body: "M PLUS 1", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(1200px 600px at 40% 20%, #141a3a 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 13px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 0;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.app { position: relative; max-width: 1500px; margin: 0 auto; display: grid; gap: 12px; }
#wires { position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: visible; }
.panel { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 14px; }

/* ---------- top ---------- */
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: stretch; }
.accounts { padding: 10px 14px; min-width: 0; }
.label { font-size: 11px; color: var(--dim); letter-spacing: .06em; display: flex; gap: 10px; align-items: center; }
.live { color: var(--ok); font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .35; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.acct { font-family: var(--f-mono); font-size: 11px; font-weight: 700; padding: 6px 9px; border-radius: 9px; background: var(--card); border: 1px solid var(--line); color: var(--dim); transition: all .3s; position: relative; }
.acct.x { color: #c9cff5; }
.acct.th { color: #a9b6ff; }
.acct .n { font-weight: 500; color: var(--faint); margin-left: 4px; }
.acct.flash { border-color: var(--ok); color: var(--fg); box-shadow: 0 0 14px color-mix(in srgb, var(--ok) 60%, transparent), inset 0 0 8px color-mix(in srgb, var(--ok) 30%, transparent); }

.stats { padding: 10px 14px; display: grid; grid-template-columns: repeat(3, auto); gap: 6px 18px; align-content: center; }
.stat b { display: block; font-family: var(--f-mono); font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 10px; color: var(--dim); letter-spacing: .05em; }
.stat.clock b { color: var(--gold); }
.speed { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; }
.speed button { background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 3px 8px; font-family: var(--f-mono); font-size: 11px; cursor: pointer; color: var(--dim); }
.speed button[aria-pressed="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); }

.owner { padding: 10px 14px; display: flex; gap: 10px; align-items: center; position: relative; min-width: 0; }
.owner .who small { display: block; font-size: 10px; color: var(--dim); }
.owner .who strong { font-size: 17px; }
.owner .who em { display: block; font-style: normal; font-size: 10px; color: var(--faint); }
.order { display: flex; gap: 6px; margin-top: 6px; }
.order input { width: 170px; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; color: var(--fg); font: inherit; font-size: 12px; }
.order button { background: var(--gold); color: var(--bg); border: 0; border-radius: 8px; padding: 5px 10px; font-weight: 800; font-size: 12px; cursor: pointer; white-space: nowrap; }

/* ---------- main ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 12px; }
.board { padding: 14px 16px 16px; min-width: 0; position: relative; }
.board-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 12px; margin-bottom: 34px; }
.brand h1 { margin: 0; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.brand h1::before { content: "✳"; color: var(--gold); font-size: 18px; }
.brand p { margin: 2px 0 0; font-family: var(--f-mono); font-size: 10px; letter-spacing: .3em; color: var(--dim); }
.ceo { display: flex; gap: 12px; align-items: center; padding: 10px 18px 10px 10px; border-radius: 14px; background: var(--card); border: 1px solid color-mix(in srgb, var(--gold) 60%, transparent); box-shadow: 0 0 22px color-mix(in srgb, var(--gold) 25%, transparent); position: relative; }
.ceo small { display: block; font-size: 10px; color: var(--dim); }
.ceo strong { font-size: 19px; }
.ceo .st { font-size: 10px; color: var(--dim); }
.ceo .ring { position: absolute; inset: -10px; border-radius: 50%; border: 3px solid var(--gold); opacity: 0; pointer-events: none; }
.ceo.burst .ring { animation: ring 1.1s ease-out; }
@keyframes ring { 0% { transform: scale(.4); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }
.ceo .shout { position: absolute; left: 50%; top: -24px; transform: translateX(-50%); font-weight: 800; color: var(--gold); font-size: 15px; text-shadow: 0 0 10px var(--gold); opacity: 0; white-space: nowrap; pointer-events: none; }
.ceo.burst .shout { animation: shout 1.4s ease-out; }
@keyframes shout { 0% { opacity: 0; transform: translate(-50%, 6px) scale(.8); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -8px); } }
.lv { font-family: var(--f-mono); font-size: 10px; color: var(--dim); margin-left: 6px; }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); margin-right: 4px; vertical-align: 1px; }

.depts { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.dept { --c: var(--fg); display: flex; flex-direction: column; gap: 8px; min-width: 0; position: relative; }
.dept::before { content: ""; position: absolute; left: 6px; top: 34px; bottom: 10px; width: 2px; background: linear-gradient(var(--c), transparent); opacity: .5; }
.dhead { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-radius: 9px; border: 1px solid color-mix(in srgb, var(--c) 70%, transparent); color: var(--c); font-weight: 800; font-size: 12px; background: color-mix(in srgb, var(--c) 8%, var(--panel)); }
.dhead span { color: var(--dim); font-weight: 600; font-size: 11px; font-family: var(--f-mono); }
.agent { position: relative; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 8px; align-items: center; padding: 7px 8px; border-radius: 11px; background: var(--card); border: 1px solid var(--line); transition: border-color .3s, box-shadow .3s; margin-left: 12px; }
.agent .av { width: 38px; height: 38px; }
.agent .nm { font-weight: 800; font-size: 13px; white-space: nowrap; }
.agent .role { font-size: 10px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent .st { font-size: 10px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent.work { border-color: var(--c); box-shadow: 0 0 14px color-mix(in srgb, var(--c) 40%, transparent); }
.agent.work .st { color: var(--fg); }
.agent.work .dot { background: var(--c); box-shadow: 0 0 6px var(--c); }
.agent.done .dot { background: var(--ok); }
.agent .bar { position: absolute; left: 8px; right: 8px; bottom: 3px; height: 2px; border-radius: 2px; background: var(--c); transform-origin: left; transform: scaleX(0); opacity: .9; }
.bubble { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); background: var(--bubble); color: var(--bubble-fg); font-weight: 800; font-size: 11px; padding: 4px 9px; border-radius: 9px; white-space: nowrap; z-index: 8; box-shadow: 0 4px 14px #0008; animation: pop .25s ease-out; pointer-events: none; }
.bubble::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -5px; border: 5px solid transparent; border-top-color: var(--bubble); }
.bubble.ng { background: #ffe3e3; }
.bubble.lvup { background: var(--gold); }
@keyframes pop { from { transform: translate(-50%, 6px) scale(.7); opacity: 0; } }
.sub { margin-left: 12px; font-size: 11px; padding: 6px 9px; border-radius: 9px; border: 1px dashed color-mix(in srgb, var(--c) 45%, transparent); color: var(--dim); transition: all .3s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub::before { content: "◆ "; color: var(--c); }
.sub.on { color: var(--fg); border-style: solid; border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
.sub b { font-family: var(--f-mono); font-weight: 500; color: var(--c); margin-left: 4px; }

.posts { margin-top: 18px; }
.posts h2 { font-size: 13px; margin: 0 0 8px; display: flex; align-items: baseline; gap: 10px; }
.posts h2 small { font-weight: 400; color: var(--dim); font-size: 11px; }
.timeline { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scroll-behavior: smooth; }
.pc { flex: 0 0 158px; padding: 8px 10px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); min-height: 92px; display: flex; flex-direction: column; gap: 4px; }
.pc .tm { font-family: var(--f-mono); font-weight: 700; font-size: 12px; display: flex; justify-content: space-between; }
.pc .tm i { font-style: normal; font-size: 10px; color: var(--dim); }
.pc .tt { font-size: 11px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pc .mt { margin-top: auto; font-family: var(--f-mono); font-size: 10px; color: var(--dim); display: flex; gap: 8px; }
.pc .mt .lk { color: #ff7aa8; }
.pc.new { border-color: var(--ok); animation: newpost 1.5s ease-out; }
@keyframes newpost { 0% { box-shadow: 0 0 22px var(--ok); } 100% { box-shadow: none; } }
.pc.late .tm i { color: var(--ng); }
.pc.wait { opacity: .45; border-style: dashed; }
.pc.wait .tt { color: var(--dim); }
.pc.wait.ready { opacity: .75; }

/* ---------- tools ---------- */
.tools { padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tools h2 { margin: 0 0 2px; font-size: 13px; }
.tool { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 8px 10px; border-radius: 11px; background: var(--card); border: 1px solid var(--line); transition: all .3s; }
.tool .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-family: var(--f-mono); background: color-mix(in srgb, var(--tc) 18%, var(--panel)); color: var(--tc); border: 1px solid color-mix(in srgb, var(--tc) 40%, transparent); }
.tool b { display: block; font-size: 13px; }
.tool small { color: var(--dim); font-size: 10px; }
.tool .ct { font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
.tool.on { border-color: var(--tc); box-shadow: 0 0 16px color-mix(in srgb, var(--tc) 45%, transparent); }
.tool.on .ct { color: var(--fg); }

/* ---------- ticker ---------- */
.ticker { position: sticky; bottom: 0; z-index: 9; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; padding: 7px max(16px, env(safe-area-inset-left, 0px)) calc(7px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--bg) 92%, transparent); border-top: 1px solid var(--line); overflow: hidden; white-space: nowrap; font-size: 11px; backdrop-filter: blur(6px); }
.ticker .row { display: flex; gap: 22px; }
.ticker .ln { color: var(--dim); }
.ticker .ln b { font-family: var(--f-mono); color: var(--gold); font-weight: 700; margin-right: 6px; }
.ticker .ln:first-child { color: var(--fg); animation: slidein .4s ease-out; }
@keyframes slidein { from { transform: translateX(-30px); opacity: 0; } }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .depts { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 18px; }
  .board-head { margin-bottom: 26px; }
}
@media (max-width: 960px) {
  .top { grid-template-columns: 1fr 1fr; }
  .accounts { grid-column: 1 / -1; }
  .main { grid-template-columns: 1fr; }
  .tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .tools h2 { grid-column: 1 / -1; }
}
@media (max-width: 640px) {
  .top { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .board { padding: 12px 10px; }
  .board-head { grid-template-columns: 1fr; justify-items: start; gap: 10px; }
  .board-head > :last-child { display: none; }
  .depts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .order input { width: 100%; }
  .order { width: 100%; }
  .owner { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <svg id="wires" aria-hidden="true">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2.4" result="b" />
        <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </defs>
    <g id="wireLayer"></g>
    <g id="flyLayer"></g>
    <g id="dotLayer" filter="url(#glow)"></g>
  </svg>

  <header class="top">
    <section class="panel accounts" aria-label="投稿先アカウント">
      <div class="label">投稿先 <span class="live" id="liveLabel">自動で投稿中</span></div>
      <div class="chips" id="accounts"></div>
    </section>
    <section class="panel stats" aria-label="今日の状況">
      <div class="stat clock"><b id="sClock">05:59:50</b><span id="sDay">DAY 1</span></div>
      <div class="stat"><b id="sPosts">0/70</b><span>今日の投稿</span></div>
      <div class="stat"><b id="sBusy">0/16</b><span>稼働中</span></div>
      <div class="stat"><b id="sReject">0</b><span>差し戻し</span></div>
      <div class="stat"><b id="sApi">0</b><span>API呼び出し</span></div>
      <div class="stat"><b id="sReply">0</b><span>返信</span></div>
      <div class="speed" role="group" aria-label="時間の速さ">
        <button id="btnPause" aria-pressed="false">❚❚</button>
        <button data-speed="10" aria-pressed="false">×10</button>
        <button data-speed="60" aria-pressed="true">×60</button>
        <button data-speed="240" aria-pressed="false">×240</button>
        <button data-speed="900" aria-pressed="false">×900</button>
      </div>
    </section>
    <section class="panel owner" id="owner" aria-label="社長">
      <svg class="av" id="ownerAv" width="46" height="46" aria-hidden="true"></svg>
      <div class="who">
        <small>社長・最終決定</small>
        <strong>あなた</strong>
        <em>朝に指示を出して、昼に確認するだけ</em>
        <form class="order" id="orderForm">
          <input id="orderInput" maxlength="24" value="AIで仕事を早くする" aria-label="今日のテーマ" />
          <button type="submit">指示を出す</button>
        </form>
      </div>
    </section>
  </header>

  <div class="main">
    <section class="panel board" id="board">
      <div class="board-head">
        <div class="brand">
          <h1>Claude Code</h1>
          <p>AUTONOMOUS SNS SYSTEM</p>
        </div>
        <div class="ceo" id="ceo">
          <span class="ring"></span><span class="shout" id="ceoShout">全員集合！</span>
          <svg class="av" id="ceoAv" width="52" height="52" aria-hidden="true"></svg>
          <div>
            <small>CEO・Claude Code</small>
            <strong>アカリ</strong><span class="lv" id="ceoLv">Lv.99</span>
            <div class="st"><span class="dot" style="background:var(--ok)"></span><span id="ceoSt">朝の指示を待っています</span></div>
          </div>
        </div>
        <div></div>
      </div>
      <div class="depts" id="depts"></div>
      <div class="posts">
        <h2>今日できた投稿 <small id="nextInfo"></small></h2>
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <aside class="panel tools" id="tools" aria-label="つないでいる道具">
      <h2>つないでいる道具</h2>
    </aside>
  </div>

  <footer class="ticker" aria-live="polite"><div class="row" id="ticker"></div></footer>
</div>

<script>
"use strict";
// ================= データ =================
const DEPTS = [
  { id: "research", name: "リサーチ", c: "var(--c-research)", hex: "#a77bff",
    agents: [["ミナ", 9, "伸びた投稿を集める"], ["トワ", 8, "数字の裏を取る"], ["ユキ", 6, "ネタを掘る"]], subs: [] },
  { id: "write", name: "執筆", c: "var(--c-write)", hex: "#ff9c3a",
    agents: [["ナギ", 10, "1行目を5案"], ["コハク", 9, "本文を書く"], ["ソウ", 7, "長めの記事を書く"]], subs: [] },
  { id: "image", name: "画像", c: "var(--c-image)", hex: "#ff6fb0",
    agents: [["モエ", 8, "画像を作る"], ["ジン", 7, "動画を編集"]], subs: [["thumb", "サムネ担当"], ["ledger", "画像台帳"]] },
  { id: "review", name: "審査", c: "var(--c-review)", hex: "#ffd84a",
    agents: [["リツ", 10, "20項目チェック"], ["カイ", 9, "AIっぽさを消す"]], subs: [["similar", "似すぎチェック"], ["facts", "実績の数字チェック"]] },
  { id: "post", name: "予約・投稿", c: "var(--c-post)", hex: "#4ab3ff",
    agents: [["アオイ", 8, "枠に予約"], ["ルカ", 9, "時間ぴったり投稿"], ["スズ", 7, "来た返信に返す"]], subs: [] },
  { id: "analysis", name: "分析", c: "var(--c-analysis)", hex: "#3ee39b",
    agents: [["シオン", 9, "毎朝7時に報告"]], subs: [["pattern", "伸びた型レポート"], ["api", "API使用量"], ["rescue", "遅れた投稿の救出"]] },
];
const TOOLS = [
  { id: "x", ic: "X", name: "X API", desc: "投稿・返信・数字", tc: "#e8ebff" },
  { id: "threads", ic: "@", name: "Threads API", desc: "転載・投稿", tc: "#b38cff" },
  { id: "img", ic: "G", name: "画像生成AI", desc: "画像を作る", tc: "#3ee39b" },
  { id: "launchd", ic: "⏰", name: "launchd", desc: "時間どおりに起動", tc: "#ff8a5c" },
  { id: "pw", ic: "P", name: "Playwright", desc: "伸びた投稿を集める", tc: "#4ab3ff" },
  { id: "xlsx", ic: "▦", name: "xlsx", desc: "投稿の台帳", tc: "#3ee39b" },
  { id: "ai2", ic: "✓", name: "別のAI", desc: "最後のダブルチェック", tc: "#ff6fb0" },
];
const ACCOUNTS = ["X-1", "X-2", "X-3", "X-4", "TH-1", "TH-2", "TH-3", "TH-4", "TH-5", "TH-6", "TH-7"];
const DAILY = 70, DAY_START = 7.5 * 3600, DAY_END = 23 * 3600;

// 各工程: 担当部署、所要時間（シミュレーション上の分）、使う道具、作業中の表示
const STAGES = {
  research: { dept: "research", min: [18, 32], tool: "pw", doing: ["伸びた投稿を収集中", "数字の出どころを確認中", "ネタを洗い出し中"] },
  write:    { dept: "write", min: [16, 28], tool: null, doing: ["1行目を5案出し中", "本文を執筆中", "構成を組み立て中"] },
  image:    { dept: "image", min: [9, 16], tool: "img", doing: ["画像を作成中", "サムネを調整中"] },
  review:   { dept: "review", min: [6, 11], tool: "ai2", doing: ["20項目チェック中", "AIっぽさを消し中"] },
  schedule: { dept: "post", min: [2, 4], tool: "xlsx", doing: ["枠に予約中"] },
};
const ORDER = ["research", "write", "image", "review", "schedule"];
const REJECTS = ["数字の根拠なし→差し戻し", "AIっぽい言い回し→差し戻し", "過去投稿と似すぎ→差し戻し", "1行目が弱い→差し戻し"];

const $ = (s, r = document) => r.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const pad = (n) => String(n).padStart(2, "0");
const hhmm = (t) => `${pad(Math.floor(t / 3600) % 24)}:${pad(Math.floor(t / 60) % 60)}`;
const hhmmss = (t) => `${hhmm(t)}:${pad(Math.floor(t) % 60)}`;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

// 顔アイコンを SVG で描く（髪の色と形を名前ごとに変える）
function drawAvatar(el, hue, seed, ring) {
  const s = +el.getAttribute("width");
  el.setAttribute("viewBox", "0 0 40 40");
  el.innerHTML = "";
  const id = "g" + Math.random().toString(36).slice(2, 8);
  const d = svg("defs", {}, el);
  const g = svg("radialGradient", { id, cx: "50%", cy: "35%", r: "70%" }, d);
  svg("stop", { offset: "0%", "stop-color": `hsl(${hue} 70% 32%)` }, g);
  svg("stop", { offset: "100%", "stop-color": `hsl(${hue} 60% 14%)` }, g);
  svg("circle", { cx: 20, cy: 20, r: 19, fill: `url(#${id})`, stroke: ring || `hsl(${hue} 80% 60%)`, "stroke-width": 1.4 }, el);
  const hair = `hsl(${(hue + seed * 37) % 360} 65% ${40 + (seed % 3) * 10}%)`;
  svg("ellipse", { cx: 20, cy: 34, rx: 11, ry: 6, fill: `hsl(${hue} 40% 30%)` }, el);
  svg("circle", { cx: 20, cy: 21, r: 10, fill: "#ffe2cc" }, el);
  const style = seed % 4;
  const hp = [
    "M9 22 Q9 9 20 9 Q31 9 31 22 Q28 14 20 14 Q13 14 9 22Z",
    "M8 24 Q8 8 20 8 Q32 8 32 24 L29 17 Q24 13 17 15 Q12 17 8 24Z",
    "M9 21 Q10 8 21 9 Q31 10 31 20 Q26 16 23 12 Q18 17 9 21Z",
    "M8 27 Q7 8 20 8 Q33 8 32 27 L30 18 Q26 12 20 13 Q14 12 10 18Z",
  ][style];
  svg("path", { d: hp, fill: hair }, el);
  const ey = 22.5;
  svg("ellipse", { cx: 16, cy: ey, rx: 1.6, ry: 2.1, fill: "#2a2440" }, el);
  svg("ellipse", { cx: 24, cy: ey, rx: 1.6, ry: 2.1, fill: "#2a2440" }, el);
  svg("circle", { cx: 16.5, cy: ey - .8, r: .6, fill: "#fff" }, el);
  svg("circle", { cx: 24.5, cy: ey - .8, r: .6, fill: "#fff" }, el);
  svg("path", { d: seed % 2 ? "M18 26.5 Q20 28.3 22 26.5" : "M18.5 27 L21.5 27", stroke: "#b0546a", "stroke-width": 1, fill: "none", "stroke-linecap": "round" }, el);
  svg("ellipse", { cx: 13.5, cy: 25, rx: 1.8, ry: 1, fill: "#ff9eb0", opacity: .6 }, el);
  svg("ellipse", { cx: 26.5, cy: 25, rx: 1.8, ry: 1, fill: "#ff9eb0", opacity: .6 }, el);
  return s;
}

// ================= 配線（光る線と流れる粒） =================
const app = $("#app");
const wireSvg = $("#wires");
const wires = []; // {from, to, color, path, len, kind}
const dots = [];  // {wire, t, v}
const flies = []; // 一回きりの粒 {path, len, t, dur, dot}

function anchor(el, side) {
  const r = el.getBoundingClientRect(), a = app.getBoundingClientRect();
  const x = { l: r.left, r: r.right, c: (r.left + r.right) / 2 }, y = { t: r.top, b: r.bottom, m: (r.top + r.bottom) / 2 };
  const m = { top: [x.c, y.t], bottom: [x.c, y.b], left: [x.l, y.m], right: [x.r, y.m] }[side];
  return [m[0] - a.left, m[1] - a.top];
}
function curve(p, q, vertical) {
  if (vertical) {
    const my = (p[1] + q[1]) / 2;
    return `M${p[0]},${p[1]} C${p[0]},${my} ${q[0]},${my} ${q[0]},${q[1]}`;
  }
  const mx = (p[0] + q[0]) / 2;
  return `M${p[0]},${p[1]} C${mx},${p[1]} ${mx},${q[1]} ${q[0]},${q[1]}`;
}
function defineWires() {
  const ceo = $("#ceo"), owner = $("#owner");
  wires.push({ a: [owner, "bottom"], b: [ceo, "top"], color: "#ffb547", v: true, w: 2 });
  DEPTS.forEach((d) => wires.push({ a: [ceo, "bottom"], b: [$(".dhead", deptEls[d.id]), "top"], color: d.hex, v: true, w: 1.6, dept: d.id }));
  wires.push({ a: [ceo, "right"], b: [$("#tools h2"), "left"], color: "#cfd5ff", v: false, w: 1.2 });
  for (const w of wires) {
    w.glow = svg("path", { fill: "none", stroke: w.color, "stroke-width": w.w * 3, opacity: .12 }, $("#wireLayer"));
    w.path = svg("path", { fill: "none", stroke: w.color, "stroke-width": w.w, opacity: .65 }, $("#wireLayer"));
  }
  for (const w of wires) for (let i = 0; i < 2; i++) addDot(w, Math.random(), rnd(.12, .22));
}
function addDot(w, t, v) {
  const c = svg("circle", { r: 2.4, fill: "#fff" }, $("#dotLayer"));
  c.style.fill = w.color;
  dots.push({ w, t, v, c });
}
function layoutWires() {
  wireSvg.setAttribute("width", app.scrollWidth);
  wireSvg.setAttribute("height", app.scrollHeight);
  // 部署が2段以上に折り返す幅では、線がカードの上を横切るので部署・道具への線は出さない
  const wide = innerWidth > 1180;
  for (const w of wires) {
    w.off = !wide && w !== wires[0];
    for (const e of [w.path, w.glow]) e.style.display = w.off ? "none" : "";
    if (w.off) continue;
    const p = anchor(...w.a), q = anchor(...w.b);
    const d = curve(p, q, w.v);
    w.path.setAttribute("d", d);
    w.glow.setAttribute("d", d);
    w.len = w.path.getTotalLength();
  }
}
function fly(fromEl, toEl, color, dur = 0.9) {
  if (reduced || flies.length > 10 || innerWidth <= 1180) return;
  const p = anchor(fromEl, "right"), q = anchor(toEl, "left");
  if (q[0] < p[0]) { // 道具欄が下にあるときは上下でつなぐ
    const p2 = anchor(fromEl, "bottom"), q2 = anchor(toEl, "top");
    return makeFly(curve(p2, q2, true), color, dur);
  }
  makeFly(curve(p, q, false), color, dur);
}
function flyV(fromEl, toEl, color, dur = 0.9, always = false) {
  if (reduced || flies.length > 10 || (!always && innerWidth <= 1180)) return;
  makeFly(curve(anchor(fromEl, "bottom"), anchor(toEl, "top"), true), color, dur);
}
function makeFly(d, color, dur) {
  const path = svg("path", { d, fill: "none", stroke: color, "stroke-width": 1.4, opacity: .55, "stroke-dasharray": "3 4" }, $("#flyLayer"));
  const dot = svg("circle", { r: 3.6 }, $("#dotLayer"));
  dot.style.fill = color;
  flies.push({ path, dot, len: path.getTotalLength(), t: 0, dur });
}
function animateWires(dtReal) {
  for (const d of dots) {
    d.c.style.display = d.w.off ? "none" : "";
    if (!d.w.len || d.w.off) continue;
    d.t = (d.t + d.v * dtReal) % 1;
    const pt = d.w.path.getPointAtLength(d.t * d.w.len);
    d.c.setAttribute("cx", pt.x);
    d.c.setAttribute("cy", pt.y);
  }
  for (let i = flies.length - 1; i >= 0; i--) {
    const f = flies[i];
    f.t += dtReal / f.dur;
    if (f.t >= 1) { f.path.remove(); f.dot.remove(); flies.splice(i, 1); continue; }
    const pt = f.path.getPointAtLength(f.t * f.len);
    f.dot.setAttribute("cx", pt.x);
    f.dot.setAttribute("cy", pt.y);
    f.path.setAttribute("opacity", (0.55 * (1 - f.t)).toFixed(2));
  }
}

// ================= シミュレーション =================
const S = {
  t: 5 * 3600 + 59 * 60 + 50, day: 1, speed: 60, paused: false,
  theme: "AIで仕事を早くする", jobs: [], posts: [], postedToday: 0, rejects: 0, api: 0, replies: 0,
  ordered: false, schedule: [], nextJobIdx: 0, replyQueue: [], events: [], acctCount: {},
};

function themeFrag() {
  // 「〜する」→「〜する」のまま、テンプレの {t} に入る形へ
  const t = S.theme.trim() || "仕事を早くする";
  return t;
}
function makeTitle() { return pick(TITLES).replace("{t}", themeFrag()); }

function buildSchedule() {
  S.schedule = [];
  const span = DAY_END - DAY_START;
  for (let i = 0; i < DAILY; i++) {
    const base = DAY_START + (span * i) / (DAILY - 1);
    const t = Math.round((base + rnd(-240, 240)) / 300) * 300; // 5分刻み
    S.schedule.push({ at: Math.min(DAY_END, Math.max(DAY_START, t)), acct: ACCOUNTS[i % ACCOUNTS.length] });
  }
  S.schedule.sort((a, b) => a.at - b.at);
  S.nextJobIdx = 0;
}

function log(msg) {
  S.events.unshift({ t: S.t, msg });
  if (S.events.length > 14) S.events.length = 14;
  renderTicker();
}
function renderTicker() {
  $("#ticker").innerHTML = S.events.map((e) => `<span class="ln"><b>${hhmm(e.t)}</b>${e.msg}</span>`).join("");
}

function say(target, text, cls = "") {
  const host = target.el || target;
  const old = host.querySelector(":scope > .bubble");
  if (old) old.remove();
  const b = document.createElement("div");
  b.className = "bubble " + cls;
  b.textContent = text;
  host.appendChild(b);
  setTimeout(() => b.remove(), 2300);
}
function useTool(id, fromEl) {
  const t = toolEls[id];
  if (!t) return;
  t.n++; S.api++;
  $(".ct", t.el).textContent = t.n;
  t.el.classList.add("on");
  t.off = performance.now() + 900;
  if (fromEl) fly(fromEl, t.el, getComputedStyle(t.el).getPropertyValue("--tc").trim());
}
function flashSub(id, ms = 1500) {
  const s = subEls[id];
  if (!s) return;
  s.classList.add("on");
  clearTimeout(s._t);
  s._t = setTimeout(() => s.classList.remove("on"), ms);
}

function setAgent(a, text, busy) {
  a.busy = busy;
  a.el.classList.toggle("work", busy);
  $(".stt", a.el).textContent = text;
  if (!busy) $(".bar", a.el).style.transform = "scaleX(0)";
}
function gainXp(a) {
  a.xp++;
  if (a.xp >= 4 + a.lv) {
    a.xp = 0; a.lv++;
    $(".lv", a.el).textContent = "Lv." + a.lv;
    say(a, `Lv.${a.lv} にアップ！`, "lvup");
    log(`${a.name} が Lv.${a.lv} に上がった`);
    return true;
  }
  return false;
}

function spawnJobs() {
  // 投稿時刻の2時間半前から作り始める
  while (S.nextJobIdx < S.schedule.length && S.schedule[S.nextJobIdx].at - S.t <= 150 * 60) {
    const s = S.schedule[S.nextJobIdx++];
    S.jobs.push({ id: S.nextJobIdx, postAt: s.at, acct: s.acct, stage: "research", waiting: true, title: makeTitle(), late: false, tries: 0 });
  }
}

function assignWork() {
  for (const a of agents) {
    if (a.busy || a.dept === "analysis") continue;
    // 投稿担当は返信の仕事もある
    if (a.dept === "post" && a.role.includes("返信") && S.replyQueue.length) {
      const r = S.replyQueue.shift();
      startTask(a, { kind: "reply", post: r, dur: rnd(3, 6) * 60, text: `${r.acct} の返信に返し中` });
      continue;
    }
    const cand = S.jobs.filter((j) => j.waiting && STAGES[j.stage] && STAGES[j.stage].dept === a.dept)
      .sort((x, y) => x.postAt - y.postAt)[0];
    if (!cand) continue;
    const st = STAGES[cand.stage];
    cand.waiting = false;
    const dur = rnd(...st.min) * 60;
    startTask(a, { kind: "stage", job: cand, dur, text: cand.stage === "write" && a.role.includes("1行目") ? "1行目を5案出し中" : pick(st.doing) });
    if (st.tool) useTool(st.tool, a.el);
    if (cand.stage === "image") flashSub("thumb", 2500);
    if (cand.stage === "review") { flashSub(Math.random() < .5 ? "similar" : "facts", 2500); }
  }
}
function startTask(a, task) {
  task.start = S.t; task.end = S.t + task.dur;
  a.task = task;
  setAgent(a, task.text, true);
}

function finishTask(a) {
  const task = a.task;
  a.task = null;
  setAgent(a, task.kind === "reply" ? "返信済み ✓" : "納品済み ✓", false);
  a.el.classList.add("done");
  setTimeout(() => a.el.classList.remove("done"), 1200);
  const lvUp = gainXp(a);
  if (task.kind === "reply") {
    useTool(task.post.acct.startsWith("X") ? "x" : "threads", a.el);
    S.replies++;
    if (!lvUp && Math.random() < .3) say(a, "返信しました！");
    return;
  }
  const j = task.job;
  const idx = ORDER.indexOf(j.stage);
  if (j.stage === "review") {
    const rejectP = j.tries === 0 ? .24 : .08;
    if (Math.random() < rejectP) {
      j.tries++; S.rejects++;
      const why = pick(REJECTS);
      if (!lvUp) say(a, why, "ng");
      log(`${a.name}：「${j.title}」${why}`);
      j.stage = "write"; j.waiting = true;
      return;
    }
    if (!lvUp && Math.random() < .35) say(a, pick(PASSES));
  }
  if (j.stage === "image") { flashSub("ledger"); if (!lvUp && Math.random() < .35) say(a, "画像できた！"); }
  if (j.stage === "research" && !lvUp && Math.random() < .25) say(a, pick(["いいネタあった！", "伸びてる型を発見", "数字そろいました"]));
  if (j.stage === "write" && !lvUp && Math.random() < .25) say(a, pick(["本文できた！", "5案出しました", "書けました！"]));
  if (j.stage === "schedule") {
    j.stage = "scheduled"; j.waiting = false;
    log(`${a.name}：${hhmm(j.postAt)} ${j.acct} に予約`);
    renderTimeline();
    return;
  }
  j.stage = ORDER[idx + 1];
  j.waiting = true;
}

function doPost(j) {
  const poster = agents.find((a) => a.role.includes("投稿") && !a.busy) || agents.find((a) => a.role.includes("投稿"));
  S.jobs.splice(S.jobs.indexOf(j), 1);
  const late = S.t - j.postAt > 120;
  const post = { at: S.t, acct: j.acct, title: j.title, likes: 0, imp: 0, q: rnd(.5, 1.6) * (late ? .7 : 1), late, fresh: true };
  S.posts.push(post);
  S.postedToday++;
  S.acctCount[j.acct] = (S.acctCount[j.acct] || 0) + 1;
  $(".n", acctEls[j.acct]).textContent = S.acctCount[j.acct];
  acctEls[j.acct].classList.add("flash");
  setTimeout(() => acctEls[j.acct].classList.remove("flash"), 1300);
  useTool("launchd", null);
  useTool(j.acct.startsWith("X") ? "x" : "threads", poster.el);
  if (!poster.bubbleBusy) say(poster, late ? "遅れたけど投稿！" : "時間ぴったり投稿！");
  log(`${j.acct} に投稿：「${j.title}」${late ? "（遅延）" : ""}`);
  // 返信が来る
  const n = Math.random() < .6 ? 1 + Math.floor(Math.random() * 2) : 0;
  for (let i = 0; i < n; i++) post.replyAt = (post.replyAt || []).concat(S.t + rnd(10, 60) * 60);
  renderTimeline();
}

function rescueLate() {
  for (const j of S.jobs) {
    if (!j.late && j.stage !== "scheduled" && S.t > j.postAt) {
      j.late = true;
      flashSub("rescue", 3000);
      const sh = agents.find((a) => a.dept === "analysis");
      say(sh, "遅れた投稿を救出！", "ng");
      log(`シオン：${hhmm(j.postAt)} の投稿が遅れています。優先して回します`);
    }
  }
}

let lastHour = -1;
function hourly() {
  const h = Math.floor(S.t / 3600) % 24;
  if (h === lastHour) return;
  lastHour = h;
  const an = agents.find((a) => a.dept === "analysis");
  if (h === 7) {
    setAgent(an, "朝の報告を作成中", true);
    useTool("x", an.el); useTool("xlsx", an.el);
    flashSub("pattern", 3000);
    setTimeout(() => { setAgent(an, "朝の報告を送信済み ✓", false); }, 2200);
    say(an, "朝の報告：昨日の伸びた型を共有");
    log("シオン：朝7時の報告。昨日いちばん伸びたのは『数字から入る1行目』");
  } else if (h === 12) {
    const o = $("#owner");
    say(o, `昼の確認：${S.postedToday}本、問題なし`);
    log(`社長：昼の確認。ここまで ${S.postedToday} 本、差し戻し ${S.rejects} 回`);
  } else if (h >= 9 && h <= 22 && h % 3 === 0) {
    flashSub("pattern", 3000);
    useTool("x", an.el);
    const best = S.posts.slice().sort((a, b) => b.likes - a.likes)[0];
    say(an, "伸びた型レポート");
    if (best) log(`シオン：いま一番伸びているのは「${best.title}」（♡${best.likes}）`);
  } else if (h === 23) {
    const ceo = $("#ceo");
    $("#ceoSt").textContent = "本日の業務終了";
    say(ceo, `おつかれさま！今日は${S.postedToday}本`);
    log(`アカリ：本日の業務終了。投稿 ${S.postedToday}/${DAILY}、返信 ${S.replies}、差し戻し ${S.rejects}`);
  }
  $("b", subEls.api).textContent = S.api;
}

function morningOrder(fromUser) {
  const ceo = $("#ceo");
  if (fromUser) {
    say($("#owner"), `今日は「${S.theme}」で！`);
    flyV($("#owner"), ceo, "#ffb547", 0.8, true);
  }
  setTimeout(() => {
    ceo.classList.remove("burst"); void ceo.offsetWidth; ceo.classList.add("burst");
    $("#ceoSt").textContent = "全員に一斉指示";
    for (const d of DEPTS) flyV(ceo, $(".dhead", deptEls[d.id]), d.hex, 1.1);
    log(`アカリ：全員に一斉指示。今日のテーマは「${S.theme}」、目標 ${DAILY} 本`);
  }, fromUser ? 700 : 0);
  if (!S.ordered) { S.ordered = true; buildSchedule(); }
}

function step(dt) {
  S.t += dt;
  // 06:00 に自動で朝の指示（社長がもう出していればそのテーマで）
  if (!S.ordered && S.t >= 6 * 3600 && S.t < 7 * 3600) morningOrder(false);
  if (S.ordered) {
    spawnJobs();
    for (const a of agents) if (a.busy && a.task && S.t >= a.task.end) finishTask(a);
    for (const j of S.jobs.slice()) if (j.stage === "scheduled" && S.t >= j.postAt) doPost(j);
    rescueLate();
    // 遅れたものは予約後すぐに投稿
    for (const j of S.jobs.slice()) if (j.stage === "scheduled" && j.late) doPost(j);
    for (const p of S.posts) {
      if (p.replyAt) {
        const due = p.replyAt.filter((t) => t <= S.t);
        if (due.length) { p.replyAt = p.replyAt.filter((t) => t > S.t); due.forEach(() => S.replyQueue.push(p)); }
      }
    }
    assignWork();
    hourly();
  }
  // 日付が変わったら次の日へ
  if (S.t >= 24 * 3600) newDay();
}

function newDay() {
  S.day++;
  S.t = 5 * 3600 + 59 * 60 + 50;
  S.ordered = false; S.jobs = []; S.posts = []; S.postedToday = 0; S.rejects = 0; S.replies = 0; S.replyQueue = [];
  S.acctCount = {};
  for (const a of ACCOUNTS) $(".n", acctEls[a]).textContent = 0;
  for (const a of agents) { a.task = null; setAgent(a, "待機中", false); }
  $("#ceoSt").textContent = "朝の指示を待っています";
  lastHour = -1;
  log(`DAY ${S.day} の朝。社長の指示を待っています`);
  renderTimeline();
}

// ================= 描画 =================
function renderTimeline() {
  const tl = $("#timeline");
  const posted = S.posts.map((p) => `<div class="pc${p.fresh ? " new" : ""}${p.late ? " late" : ""}">
      <div class="tm">${hhmm(p.at)}<i>${p.late ? "遅延 · " : ""}${p.acct}</i></div>
      <div class="tt">${p.title}</div>
      <div class="mt"><span class="lk">♡ ${p.likes}</span><span>表示 ${p.imp.toLocaleString()}</span></div></div>`);
  S.posts.forEach((p) => (p.fresh = false));
  const upcoming = S.jobs.slice().sort((a, b) => a.postAt - b.postAt).slice(0, 6).map((j) => `<div class="pc wait${j.stage === "scheduled" ? " ready" : ""}">
      <div class="tm">${hhmm(j.postAt)}<i>${j.acct}</i></div>
      <div class="tt">${j.stage === "scheduled" ? j.title : "制作中…"}</div>
      <div class="mt"><span>${j.stage === "scheduled" ? "予約済み" : STAGE_LABEL[j.stage] || ""}</span></div></div>`);
  const atEnd = tl.scrollLeft + tl.clientWidth >= tl.scrollWidth - 40;
  tl.innerHTML = posted.concat(upcoming).join("") || `<div class="pc wait"><div class="tm">07:30<i>X-1</i></div><div class="tt">朝の指示が出ると、ここに投稿が並びます</div></div>`;
  if (atEnd || posted.length) {
    const firstWait = tl.querySelector(".pc.wait");
    if (firstWait) tl.scrollLeft = Math.max(0, firstWait.offsetLeft - tl.clientWidth + 330);
  }
}
const STAGE_LABEL = { research: "リサーチ", write: "執筆", image: "画像", review: "審査", schedule: "予約" };

function updateLikes(dt) {
  let changed = false;
  for (const p of S.posts) {
    const age = (S.t - p.at) / 3600;
    const target = Math.floor(p.q * 120 * (1 - Math.exp(-age / 2)));
    if (target !== p.likes) { p.likes = target; p.imp = target * 37 + Math.floor(p.q * 300); changed = true; }
  }
  return changed;
}

function renderStats() {
  $("#sClock").textContent = hhmmss(S.t);
  $("#sDay").textContent = "DAY " + S.day;
  $("#sPosts").textContent = `${S.postedToday}/${DAILY}`;
  $("#sBusy").textContent = `${agents.filter((a) => a.busy).length}/${agents.length}`;
  $("#sReject").textContent = S.rejects;
  $("#sApi").textContent = S.api;
  $("#sReply").textContent = S.replies;
  for (const a of agents) {
    if (a.busy && a.task) {
      const p = Math.min(1, (S.t - a.task.start) / a.task.dur);
      $(".bar", a.el).style.transform = `scaleX(${p.toFixed(3)})`;
    }
  }
  const now = performance.now();
  for (const k in toolEls) if (toolEls[k].off && now > toolEls[k].off) { toolEls[k].el.classList.remove("on"); toolEls[k].off = 0; }
  const nx = S.jobs.filter((j) => j.stage === "scheduled").sort((a, b) => a.postAt - b.postAt)[0];
  $("#nextInfo").textContent = !S.ordered ? "06:00 に CEO が全員へ指示を出します" : nx ? `次の投稿 ${hhmm(nx.postAt)} ${nx.acct}` : `制作中 ${S.jobs.length} 本`;
}

// ================= ループ =================
let last = performance.now(), likeTimer = 0;
function frame(now) {
  const dtReal = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!S.paused) {
    let remain = dtReal * S.speed;
    while (remain > 0) { const d = Math.min(remain, 20); step(d); remain -= d; }
    likeTimer += dtReal;
    if (likeTimer > 1) { likeTimer = 0; if (updateLikes()) renderTimeline(); }
  }
  animateWires(dtReal);
  renderStats();
  requestAnimationFrame(frame);
}

// ================= 操作 =================
document.querySelectorAll(".speed [data-speed]").forEach((b) => b.addEventListener("click", () => {
  S.speed = +b.dataset.speed;
  document.querySelectorAll(".speed [data-speed]").forEach((x) => x.setAttribute("aria-pressed", x === b));
}));
$("#btnPause").addEventListener("click", (e) => {
  S.paused = !S.paused;
  e.currentTarget.setAttribute("aria-pressed", S.paused);
  e.currentTarget.textContent = S.paused ? "▶" : "❚❚";
  $("#liveLabel").textContent = S.paused ? "一時停止中" : "自動で投稿中";
});
$("#orderForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("#orderInput").value.trim();
  if (!v) return;
  S.theme = v;
  // 指示前の時間帯なら、そのまま朝の指示に早送り
  if (!S.ordered && S.t < 6 * 3600) S.t = 6 * 3600 - 1;
  morningOrder(true);
  // まだ作り始めていない投稿のタイトルを新しいテーマにする
  for (const j of S.jobs) if (j.stage === "research" && j.waiting) j.title = makeTitle();
});

defineWires();
layoutWires();
new ResizeObserver(() => layoutWires()).observe(app);
addEventListener("resize", layoutWires);
document.fonts && document.fonts.ready.then(layoutWires);
log("おはようございます。06:00 に CEO が全員へ指示を出します");
renderTimeline();
requestAnimationFrame(frame);
</script>
</body>
</html>
