<style>
/* 画面は 720×1280 の縦長。#app の font-size を JS が「幅/720×24px」にするので、1em = 論理24px */
:root { --gold: #ffd23f; --ink: #1f1633; --panel: rgba(24, 16, 44, .94); --line: rgba(255, 255, 255, .16); --good: #4ade80; --bad: #f87171; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #0d1a10; overflow: hidden; touch-action: none; overscroll-behavior: none; }
body { display: flex; align-items: center; justify-content: center; color: #fff;

#app { position: relative; width: 720px; height: 1280px; overflow: hidden; background: #2f7a2a; font-size: 24px; }

.hidden { display: none !important; }

button { font: inherit; color: inherit; cursor: pointer; }
.btn { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: .1em;
  min-height: 2.2em; padding: .35em 1em; border: 0; border-radius: .7em; font-weight: 800; font-size: 1em;
  color: #2a1a00; background: linear-gradient(#ffe37a, #ffb72b); box-shadow: 0 .18em 0 #b86e00, 0 .3em .6em rgba(0,0,0,.35); }
.btn:active { transform: translateY(.12em); box-shadow: 0 .06em 0 #b86e00; }
.btn.alt { color: #fff; background: linear-gradient(#a78bfa, #6d28d9); box-shadow: 0 .18em 0 #3b0f8c, 0 .3em .6em rgba(0,0,0,.35); }
.btn.ghost, .btn.icon { color: #fff; background: rgba(0,0,0,.35); box-shadow: none; border: .08em solid var(--line); }
.btn.icon { width: 2.2em; padding: 0; }
.btn.big { font-size: 1.25em; min-height: 2.4em; }
.btn.small { font-size: .8em; min-height: 1.8em; padding: .2em .8em; }
.btn.danger { color: #fff; background: linear-gradient(#f87171, #b91c1c); box-shadow: 0 .18em 0 #6b0d0d; }
.btn[disabled] { filter: grayscale(1) brightness(.7); pointer-events: none; }
.btn small { font-size: .55em; font-weight: 600; opacity: .85; }

.coinTag { display: inline-flex; align-items: center; gap: .3em; padding: .2em .7em .2em .3em; border-radius: 99em; background: rgba(0,0,0,.45); font-weight: 800; }
.coinTag.small { font-size: .85em; }
.coinIco { display: inline-block; width: 1.1em; height: 1.1em; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff6b0, #ffc400 45%, #c27b00); box-shadow: inset 0 0 0 .1em #a86500; }

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 1em .8em; gap: .7em;
  background: linear-gradient(180deg, rgba(10,30,14,.55), rgba(10,20,40,.85)); }
.bar { display: flex; align-items: center; gap: .5em; }
.bar h1 { flex: 1; margin: 0; font-size: 1.25em; text-shadow: 0 .1em 0 rgba(0,0,0,.5); }

/* ハブ */
.hubTop { display: flex; justify-content: space-between; align-items: flex-start; }
.logo { display: flex; flex-direction: column; line-height: 1; }
.logo .l1 { font-size: .9em; letter-spacing: .3em; color: #a7f3d0; font-weight: 800; }
.logo .l2 { font-size: 2em; font-weight: 900; color: var(--gold); text-shadow: 0 .08em 0 #8a4b00, 0 .2em .4em rgba(0,0,0,.5); }
.cards { display: flex; flex-direction: column; gap: .7em; flex: 1; overflow-y: auto; padding: .3em .1em; }

.card.soon { opacity: .55; }

.hubFoot { display: flex; justify-content: center; }

/* メニュー */
.tabs { display: flex; gap: .3em; background: rgba(0,0,0,.35); padding: .25em; border-radius: .8em; }
.tabs button { flex: 1; border: 0; padding: .45em 0; border-radius: .6em; background: transparent; color: #ddd; font-weight: 800; }
.tabs button.on { background: linear-gradient(#ffe37a, #ffb72b); color: #2a1a00; }
.tabs.mode button.on { background: linear-gradient(#a78bfa, #6d28d9); color: #fff; }
#stagePane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.stageInfo { font-size: .8em; opacity: .85; padding: 0 .2em .3em; }
.grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: .35em; align-content: start; padding: .2em; touch-action: pan-y; }
.grid button { aspect-ratio: 1; border: 0; border-radius: .6em; background: rgba(255,255,255,.12); color: #fff; font-weight: 900; font-size: 1em; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }

.menuBtns { display: flex; gap: .4em; }
.menuBtns .btn { flex: 1; font-size: .85em; }

/* パネル（モーダル） */
.panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.55); padding: 1em; z-index: 5; }
.panelBox { width: 100%; max-height: 100%; display: flex; flex-direction: column; gap: .6em; padding: 1em; border-radius: 1.1em; background: var(--panel); border: .1em solid var(--line); box-shadow: 0 1em 2em rgba(0,0,0,.5); }
.panelBox h1 { margin: 0; text-align: center; font-size: 1.4em; color: var(--gold); }
.list { overflow-y: auto; display: flex; flex-direction: column; gap: .4em; touch-action: pan-y; }

.up .lv { font-size: .75em; opacity: .85; min-width: 3.5em; text-align: right; }
.up .btn { min-width: 5.2em; font-size: .8em; }
.dex { display: grid; grid-template-columns: repeat(4, 1fr); gap: .3em; overflow-y: auto; touch-action: pan-y; }
.dex .cell { display: flex; flex-direction: column; align-items: center; padding: .2em; border-radius: .5em; background: rgba(255,255,255,.07); font-size: .55em; text-align: center; line-height: 1.2; }
.dex .cell canvas { width: 5.5em; height: 5.5em; }
.dex .cell.unknown { opacity: .45; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 1em; font-weight: 700; }
.row input[type=range] { flex: 1; }
.row.chk { justify-content: flex-start; }
.row.chk input { width: 1.2em; height: 1.2em; }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud .btn, #hud button { pointer-events: auto; }
.hudTop { display: flex; align-items: center; gap: .4em; padding: .5em .5em 0; }
.hudMid { flex: 1; display: flex; flex-direction: column; gap: .15em; }
.hudTitle { font-weight: 900; font-size: .8em; text-shadow: 0 .08em .2em #000; }
.hpBar { position: relative; height: 1em; border-radius: 99em; background: rgba(0,0,0,.5); overflow: hidden; border: .08em solid rgba(255,255,255,.4); }
.hpBar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(#86efac, #16a34a); transition: width .2s; }
.hpBar i.low { background: linear-gradient(#fca5a5, #dc2626); }
.hpBar span { position: absolute; inset: 0; display: grid; place-items: center; font-size: .6em; font-weight: 900; text-shadow: 0 0 .3em #000; }
.bossBar { margin: .35em 1.5em 0; display: flex; flex-direction: column; align-items: center; gap: .1em; }
.bossBar span { font-size: .7em; font-weight: 900; color: #fecaca; text-shadow: 0 0 .3em #000; }
.bb { width: 100%; height: .6em; border-radius: 99em; background: rgba(0,0,0,.55); overflow: hidden; }
.bb i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #f87171, #b91c1c); }
.buffs { position: absolute; right: .4em; top: 3.4em; display: flex; flex-direction: column; align-items: flex-end; gap: .15em; }
.buffs span { font-size: .55em; font-weight: 800; padding: .1em .5em; border-radius: 99em; background: rgba(0,0,0,.45); }
.buffs span.bad { color: #fca5a5; }
.toast { position: absolute; left: 50%; top: 44%; transform: translateX(-50%); padding: .4em 1em; border-radius: .8em; background: rgba(0,0,0,.65);
  font-weight: 900; font-size: .9em; white-space: nowrap; text-align: center; animation: pop .25s ease-out; }
@keyframes pop { from { transform: translateX(-50%) scale(.6); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }

.choiceBox { align-items: center; }
.choiceBox canvas { width: 8em; height: 8em; }
.choiceName { font-weight: 900; font-size: 1.1em; }
.choiceBtns { display: flex; gap: .5em; width: 100%; }
.choiceBtns .btn { flex: 1; font-size: 1.05em; }
.hint { position: absolute; left: 50%; top: 46%; transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: .5em; padding: .4em .8em; border-radius: .8em; background: rgba(60,20,120,.9); font-weight: 900; white-space: nowrap; }

.stars { text-align: center; font-size: 2.4em; letter-spacing: .1em; color: #555; }
.stars b { color: var(--gold); text-shadow: 0 0 .3em rgba(255,210,63,.7); }
.resLines { display: flex; flex-direction: column; gap: .25em; font-weight: 700; }
.resLines div { display: flex; justify-content: space-between; padding: .25em .5em; border-radius: .5em; background: rgba(255,255,255,.06); }
.resLines div.total { background: rgba(255,210,63,.18); color: var(--gold); font-size: 1.1em; }
.resBtns { display: flex; flex-direction: column; gap: .4em; }
#confirm p { text-align: center; font-weight: 700; }
</style>

<body>
<div id="app">
  <canvas id="cv" width="720" height="1280"></canvas>

  <!-- ハブ: ミニゲームを選ぶ -->
  <section id="hub" class="screen">
    <div class="hubTop">
      <div class="logo"><span class="l1">MINI GAME</span><span class="l2">ミニゲームラッシュ</span></div>
      <div class="coinTag"><i class="coinIco"></i><b id="hubCoins">0</b></div>
    </div>
    <div class="cards">
      <button class="card play" id="openLegion" type="button">
        <canvas id="legionThumb" width="240" height="240"></canvas>
        <div class="cardBody"><h2>武器拾いレギオン</h2><p>英雄をドラッグして武器を拾い、迫りくる大群を撃退！檻の英雄を助けて仲間を増やそう。</p></div>
      </button>
      <div class="card soon"><div class="soonIco">？</div><div class="cardBody"><h2>COMING SOON</h2><p>次のミニゲームを準備中…</p></div></div>
      <div class="card soon"><div class="soonIco">？</div><div class="cardBody"><h2>COMING SOON</h2><p>次のミニゲームを準備中…</p></div></div>
    </div>
    <div class="hubFoot"><button id="hubSettings" class="btn ghost" type="button">⚙ 設定</button></div>
  </section>

  <!-- 武器拾いレギオンのメニュー -->
  <section id="lmenu" class="screen hidden">
    <div class="bar">
      <button class="btn icon" id="lmBack" type="button" aria-label="もどる">◀</button>
      <h1>武器拾いレギオン</h1>
      <div class="coinTag"><i class="coinIco"></i><b id="lmCoins">0</b></div>
    </div>
    <div class="tabs" id="diffTabs">
      <button type="button" data-diff="easy">かんたん</button>
      <button type="button" data-diff="normal">ふつう</button>
      <button type="button" data-diff="hard">むずかしい</button>
    </div>
    <div class="tabs mode" id="modeTabs">
      <button type="button" data-mode="stage">ステージ</button>
      <button type="button" data-mode="endless">エンドレス</button>
    </div>
    <div id="stagePane">
      <div class="stageInfo"><span id="stageSummary"></span></div>
      <div class="grid" id="stageGrid"></div>
    </div>
    <div id="endlessPane" class="hidden">
      <div class="endlessBox">
        <p>敵は無限に押し寄せる。檻とゲートも次々に現れる。どこまで耐えられるか！</p>
        <div class="best" id="endlessBest"></div>
        <button class="btn big" id="startEndless" type="button">エンドレス開始</button>
      </div>
    </div>
    <div class="menuBtns">
      <button class="btn" id="openUp" type="button">⬆ 強化</button>
      <button class="btn" id="openDex" type="button">📖 英雄図鑑</button>
      <button class="btn" id="openSet" type="button">⚙ 設定</button>
    </div>
  </section>

  <!-- 強化 -->
  <section id="upPanel" class="panel hidden">
    <div class="panelBox">
      <div class="bar"><h1>強化</h1><div class="coinTag"><i class="coinIco"></i><b id="upCoins">0</b></div></div>
      <div id="upList" class="list"></div>
      <button class="btn" id="upClose" type="button">閉じる</button>
    </div>
  </section>

  <!-- 図鑑 -->
  <section id="dexPanel" class="panel hidden">
    <div class="panelBox">
      <div class="bar"><h1>英雄図鑑</h1><span id="dexCount" class="muted"></span></div>
      <div id="dexList" class="dex"></div>
      <button class="btn" id="dexClose" type="button">閉じる</button>
    </div>
  </section>

  <!-- 設定 -->
  <section id="setPanel" class="panel hidden">
    <div class="panelBox">
      <div class="bar"><h1>設定</h1></div>
      <label class="row">BGM<input type="range" id="volBgm" min="0" max="100" /></label>
      <label class="row">効果音<input type="range" id="volSe" min="0" max="100" /></label>
      <label class="row chk"><input type="checkbox" id="mute" /> ミュート</label>
      <button class="btn danger" id="resetData" type="button">セーブデータを消す</button>
      <button class="btn" id="setClose" type="button">閉じる</button>
    </div>
  </section>

  <!-- 遊んでいる最中 -->
  <div id="hud" class="hidden">
    <div class="hudTop">
      <button class="btn icon" id="pauseBtn" type="button" aria-label="一時停止">II</button>
      <div class="hudMid">
        <div class="hudTitle" id="hudTitle"></div>
        <div class="hpBar"><i id="hpFill"></i><span id="hpText"></span></div>
      </div>
      <div class="coinTag small"><i class="coinIco"></i><b id="hudCoins">0</b></div>
    </div>
    <div class="bossBar hidden" id="bossBar"><span id="bossName"></span><div class="bb"><i id="bossFill"></i></div></div>
    <div class="buffs" id="buffs"></div>
    <div class="toast hidden" id="toast"></div>
  </div>

  <!-- 檻の英雄を解放したときの2択 -->
  <section id="choice" class="panel hidden">
    <div class="panelBox choiceBox">
      <h1>英雄を解放した！</h1>
      <canvas id="choiceImg" width="200" height="200"></canvas>
      <div class="choiceName" id="choiceName"></div>
      <div class="choiceBtns">
        <button class="btn big" id="chJoin" type="button">仲間にする<small id="chJoinSub"></small></button>
        <button class="btn big alt" id="chEvolve" type="button">進化させる<small>自分の英雄を1体選んで★+1</small></button>
      </div>
    </div>
  </section>
  <div id="evolveHint" class="hint hidden">進化させる英雄をタップ <button class="btn small" id="evolveCancel" type="button">やめる</button></div>

  <!-- 一時停止 -->
  <section id="pause" class="panel hidden">
    <div class="panelBox">
      <h1>一時停止</h1>
      <button class="btn big" id="resume" type="button">再開</button>
      <button class="btn" id="retry" type="button">やり直す</button>
      <button class="btn" id="quit" type="button">メニューへ</button>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="panel hidden">
    <div class="panelBox">
      <h1 id="resTitle"></h1>
      <div class="stars" id="resStars"></div>
      <div class="resLines" id="resLines"></div>
      <div class="resBtns">
        <button class="btn big" id="resNext" type="button">次のステージ</button>
        <button class="btn" id="resRetry" type="button">もう一度</button>
        <button class="btn" id="resUp" type="button">強化する</button>
        <button class="btn" id="resMenu" type="button">メニューへ</button>
      </div>
    </div>
  </section>

  <div id="confirm" class="panel hidden">
    <div class="panelBox"><p id="confirmText"></p>
      <div class="resBtns"><button class="btn danger" id="confirmYes" type="button">はい</button><button class="btn" id="confirmNo" type="button">いいえ</button></div>
    </div>
  </div>
</div>
<script id="mgr-legion-config">
/**
 * 武器拾いレギオンの調整値（データだけ）。数値を変えたいときはまずここを探す。
 * 座標はワールド単位: x は 0〜5（盤面の5列ぶん）、y は手前 0 → 奥。盤面は y 0〜6、通路は y 6〜22。
 */
(function (G) {
  const MGR = G.MGR = G.MGR || {};
  const L = MGR.Legion = MGR.Legion || {};

  L.CONFIG = {
    world: { W: 5, boardRows: 6, fieldTop: 22, spawnY: 22.6, leakY: 6 },

    // 遠近法: z = y + z0、画面の y = horizon + A / z、x = 中央 + (x - 2.5) * B / z
    view: { w: 720, h: 1280, z0: 14, A: 25660, B: 2000, horizon: -583 },

    board: {
      cols: 5, rows: 6,
      shiftEvery: 5,          // 秒ごとに盤面が手前へ1段流れる
      fallSpeed: 9,           // 詰めるときの見た目の速さ（マス/秒）
      ownedWeight: 0.62,      // 新しい武器が「持っている英雄の武器」になる割合
      unlockedPool: 4         // 持っていない武器の候補は、ステージで出る檻の英雄の武器を優先
    },

    hero: {
      ammoMax: 4, maxHeroes: 12, maxTier: 4, idleReach: 1,
      range: 11,              // 弾が届く距離（ワールド単位）。遠くの敵は届くまで近づいてくる
      tierDmg: [1, 2.3, 5.2, 11.5],
      tierRate: [1, 1.15, 1.3, 1.5],
      dragSpeedBot: 9         // ボットの指の速さ（マス/秒）
    },

    // dmg: 1発の威力 / every: 投げる間隔(秒) / speed: 弾速(単位/秒) / r: 当たり判定
    weapons: {
      sickle:   { name: '鎌',       dmg: 10, every: 0.36, speed: 13, r: 0.32, pierce: 2, spin: true },
      sword:    { name: '剣',       dmg: 27, every: 0.62, speed: 12, r: 0.3, pierce: 0 },
      staff:    { name: '杖',       dmg: 13, every: 0.46, speed: 10, r: 0.3, pierce: 0, homing: 3.2 },
      sling:    { name: 'パチンコ', dmg: 9,  every: 0.5,  speed: 13, r: 0.26, pierce: 0, aoe: 0.85, aoeDmg: 0.6 },
      bow:      { name: '弓',       dmg: 8,  every: 0.52, speed: 16, r: 0.24, pierce: 0, spread: [-0.16, 0, 0.16] },

<script id="mgr-legion-stage">
/**
 * ステージの自動生成（純粋。乱数はシードから作る）。
 *   Stage.build(cfg, n, diff)   → ステージ n の中身（地形・敵の群れ・ゲート・檻・ボス）
 *   Stage.endless(cfg, diff, seed) → 無限に続くステージ（pull で少しずつ作る）
 *   Stage.layout(id)            → 地形（通路・合流する位置・檻の置き場）

(function (G) {
  const L = G.MGR.Legion;

  /** シード付き乱数（mulberry32）。[0,1) */
  function rng32(seed) {
    let s = seed >>> 0;
    return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  // 地形。lanes: 合流より奥での敵の通り道（x の範囲）/ mergeY: ここより手前は道幅いっぱいに広がる / slots: 檻の置き場
  // walls: 描画用の壁で囲まれた区画（檻の部屋）
  const LAYOUTS = {
    A: { name: '左の檻', lanes: [{ x0: 2.05, x1: 4.95 }], mergeY: 11, slots: [{ x0: 0.15, x1: 1.85, y0: 13.4, y1: 17.2 }], rooms: [{ x0: 0, x1: 2, y0: 11, y1: 22 }] },
    B: { name: '右の檻', lanes: [{ x0: 0.05, x1: 2.95 }], mergeY: 11, slots: [{ x0: 3.15, x1: 4.85, y0: 13.4, y1: 17.2 }], rooms: [{ x0: 3, x1: 5, y0: 11, y1: 22 }] },
    C: { name: '二本道', lanes: [{ x0: 0.05, x1: 1.9 }, { x0: 3.1, x1: 4.95 }], mergeY: 10, slots: [{ x0: 2.02, x1: 2.98, y0: 13, y1: 16.6 }], rooms: [{ x0: 1.95, x1: 3.05, y0: 10, y1: 22 }] },
    D: { name: '奥の檻', lanes: [{ x0: 0.05, x1: 1.5 }, { x0: 3.5, x1: 4.95 }], mergeY: 15.6, slots: [{ x0: 1.65, x1: 3.35, y0: 16.1, y1: 18.5 }], rooms: [{ x0: 1.55, x1: 3.45, y0: 15.6, y1: 22 }] },
    E: { name: '両側の檻', lanes: [{ x0: 1.05, x1: 3.95 }], mergeY: 10, slots: [{ x0: 0.1, x1: 0.95, y0: 13, y1: 16.6 }, { x0: 4.05, x1: 4.9, y0: 13, y1: 16.6 }], rooms: [{ x0: 0, x1: 1, y0: 10, y1: 22 }, { x0: 4, x1: 5, y0: 10, y1: 22 }] }
  };

    const fresh = ok.find(id => cfg.stage.layoutsFrom[id] === n);

  function enemyPool(cfg, n) {

  /** 群れの種類。ゴブリンが基本で、新しい敵ほど少し出にくい。出始めのステージではよく出す */
  function waveType(cfg, n, r) {
    const pool = enemyPool(cfg, n);
    return weighted(r, pool.map((k, i) => [k, k === 'goblin' ? 3 : (cfg.enemies[k].from === n ? 3 : 1.6 - i * 0.05)]));

  function gateDef(cfg, n, r, pool, diff) {
    const items = Object.entries(cfg.gates).filter(([, g]) => g.kind === 'good' || n >= cfg.gate.badFrom);

    // 序盤のステージ（easyUntil まで）は列の間隔を広げて、遊び方を覚えられるようにする
    const ease = 1 + S.earlyEase * Math.max(0, S.easyUntil - n) / (S.easyUntil - 1);

<script id="mgr-legion-sim">

 * 武器拾いレギオンの中身（純粋。乱数・通知は引数でもらう。DOM や時計には触れない）。
 *
 *   const sim = L.createSim(cfg, { stage, rng, meta, emit })

 *   sim.grab(id) / sim.dragTo(id, x, y) / sim.release(id)   英雄をつかんで動かして離す（x, y はワールド座標）
 *   sim.choose('join' | 'evolve', heroId)  檻の英雄を解放したあとの2択
 *   sim.S                       状態（描画とテストが読む）
 *
 * emit(type, data) で起きたことを知らせる: throw / hit / kill / leak / gate / cage / choice / merge / join / evolve /

(function (G) {
  const L = G.MGR.Legion;

  L.createSim = function (cfg, { stage, rng, meta = {}, emit = () => { } }) {
    const W = cfg.world.W, ROWS = cfg.board.rows, COLS = cfg.board.cols;
    const up = k => meta[k] || 0;
    const UP = cfg.upgrades;
    let nextId = 1;

    const baseMax = Math.round((cfg.base.hp + up('base') * UP.base.per) * (stage.baseHpMul || 1));
    const S = {
      t: 0, phase: 'play', stage,
      baseHp: baseMax, baseMax, barrier: 0,
      heroes: [], board: [], enemies: [], projs: [], gates: [], cages: [],
      slots: stage.layout.slots.map(() => null),
      mods: { atk: 1, rate: 1, pierce: 0, multi: 0, pspeed: 1, big: 1, crit: 0, wpn: {}, ammo: 0, slow: 1 },
      kills: 0, coins: 0, wave: 0,
      evIndex: 0, cageIndex: 0, cageDelay: 1.5, shiftT: cfg.board.shiftEvery,
      bossSpawned: false, bossDown: false, boss: null,
      choice: null, dragging: null, stats: { thrown: 0, leaked: 0, gates: 0, cagesFreed: 0, merges: 0, dmg: 0 }
    };

    // ---- 英雄 ----
    function owned() { const s = new Set(); for (const h of S.heroes) s.add(cfg.heroes[h.type].weapon); return s; }
    function heroAt(col, row, except) { return S.heroes.find(h => h !== except && !h.drag && h.col === col && h.row === row); }
    function freeCell(prefRows = [0, 1, 2, 3, 4, 5]) {
      for (const row of prefRows) {
        const cols = [2, 1, 3, 0, 4].filter(c => !heroAt(c, row));
        if (cols.length) return { col: cols[Math.floor(rng() * cols.length) % cols.length], row };
      }
      return null;
    }
    function addHero(type, tier = 1, cell) {
      if (S.heroes.length >= cfg.hero.maxHeroes) { S.coins += 10; return null; }
      const c = cell || freeCell([0, 1, 2, 3, 4, 5]);
      if (!c) return null;
      const h = { id: nextId++, type, tier, col: c.col, row: c.row, x: c.col + 0.5, y: c.row + 0.5, ammo: [], cool: 0, drag: false, born: S.t, anim: 0 };
      S.heroes.push(h);
      emit('join', { hero: h });

    }
    function ammoMax() { return cfg.hero.ammoMax + up('ammo') * UP.ammo.per + S.mods.ammo; }

    // ---- 盤面 ----
    function randWeapon() {
      const mine = [...owned()];
      // 使えない武器ばかりで埋まらないように、盤面の「使える武器」の割合が目標より低いほど使える武器を出す
      let have = 0, all = 0;
      for (const row of S.board) for (const it of row) if (it) { all++; if (mine.includes(it.w)) have++; }
      const frac = all ? have / all : cfg.board.ownedWeight;
      const p = Math.max(0.35, Math.min(0.95, cfg.board.ownedWeight + (cfg.board.ownedWeight - frac) * 3));
      if (mine.length && rng() < p) return mine[Math.floor(rng() * mine.length) % mine.length];
      const others = stage.pool.filter(w => !mine.includes(w));
      const from = others.length ? others : (mine.length ? mine : stage.pool);
      return from[Math.floor(rng() * from.length) % from.length];
    }
    for (let r = 0; r < ROWS; r++) { S.board.push([]); for (let c = 0; c < COLS; c++) S.board[r].push({ w: randWeapon(), off: 0 }); }

    function settleBoard(dt) {

    }
    function tryPickup(h, col, row) {

    // ---- 弾 ----
    function heroDmg(h, w) {

    }
    function throwFrom(h) {
      const w = h.ammo.shift();
      const wd = cfg.weapons[w];
      const dirs = wd.spread || [0];
      const extra = S.mods.multi;
      const sp = wd.speed * S.mods.pspeed;
      for (let m = 0; m <= extra; m++) {
        const dx = (m - extra / 2) * 0.3;
        for (const a of dirs) {
          const crit = rng() * 100 < S.mods.crit;
          S.projs.push({
            id: nextId++, w, tier: h.tier, x: Math.max(0.05, Math.min(W - 0.05, h.x + dx)), y: h.y + 0.3,
            vx: Math.sin(a) * sp, vy: Math.cos(a) * sp,
            dmg: heroDmg(h, w) * (crit ? cfg.gate.critMul : 1), crit,
            r: wd.r * S.mods.big, pierce: (wd.pierce || 0) + S.mods.pierce, bounce: wd.bounce || 0,
            aoe: wd.aoe ? wd.aoe * Math.sqrt(S.mods.big) : 0, aoeDmg: wd.aoeDmg || 0, homing: wd.homing || 0,
            hit: [], ang: 0, life: 4, dist: 0, range: (wd.range || cfg.hero.range) * Math.sqrt(S.mods.pspeed)
          });
        }
      }
      S.stats.thrown++;
      h.anim = 0.18;
      emit('throw', { hero: h, w });
    }
    function rate(h) {
      return cfg.hero.tierRate[h.tier - 1] * S.mods.rate * (1 + up('rate') * UP.rate.per);
    }

    // ---- 敵 ----
    function laneRange(lane) { const l = stage.layout.lanes[lane] || stage.layout.lanes[0]; return l; }

      const d = cfg.enemies[type] || cfg.bosses[type];

      const e = {
        id: nextId++, type, boss, x, y, bx: x, lane, hp, maxHp: hp, r: d.r, speed: d.speed * stage.speedMul * (0.92 + rng() * 0.16),
        armor: d.armor || 0, leak: d.leak, coin: d.coin, revived: false, phaseT: rng() * 3, hidden: false,
        healT: 1 + rng() * 2, summonT: d.summon ? d.summon[1] : 0, chargeT: d.charge ? d.charge[0] : 0, charging: 0,
        tx: null, wob: rng() * 6.28, flash: 0, hpMul, ...extra
      };

    }
    function spawnWave(ev) {
      const l = laneRange(ev.lane);
      const width = l.x1 - l.x0;
      const cols = Math.max(1, Math.floor(width / 0.55));
      const gap = width / cols;
      for (let i = 0; i < ev.count; i++) {
        const c = i % cols, r = Math.floor(i / cols);
        spawnEnemy(ev.type, l.x0 + gap * (c + 0.5) + (rng() - 0.5) * 0.08, cfg.world.spawnY + r * 0.55, ev.lane, ev.hpMul);
      }

    }
    function spawnGate(ev) {
      const l = laneRange(ev.lane);
      const w = Math.min(cfg.gate.w, l.x1 - l.x0 - 0.1);
      const x0 = l.x0 + 0.05 + (l.x1 - l.x0 - 0.1 - w) * ev.pos;
      const g = cfg.gates[ev.gate.id];
      S.gates.push({ id: nextId++, ...ev.gate, kind: g.kind, x0, x1: x0 + w, y: cfg.world.spawnY, maxHp: ev.gate.hp, speed: cfg.gate.speed * stage.speedMul, flash: 0 });
    }
    function spawnBoss(ev) {
      const l = laneRange(ev.lane);
      const e = spawnEnemy(ev.type, (l.x0 + l.x1) / 2, cfg.world.spawnY + 0.8, ev.lane, ev.hpMul);
      S.boss = e; S.bossSpawned = true;
      emit('spawnBoss', { enemy: e });
    }
    function damageEnemy(e, dmg, src) {
      if (e.dead) return;
      const real = Math.max(1, dmg - e.armor);
      e.hp -= real; e.flash = 0.12;
      S.stats.dmg += real;
      emit('hit', { enemy: e, dmg: real, crit: src && src.crit });
      if (e.hp <= 0) killEnemy(e);
    }
    function killEnemy(e) {
      const d = cfg.enemies[e.type] || cfg.bosses[e.type];
      if (d.revive && !e.revived) { e.revived = true; e.hp = Math.round(e.maxHp * d.revive); emit('revive', { enemy: e }); return; }
      e.dead = true;
      S.kills++;
      S.coins += e.coin;
      emit('kill', { enemy: e });
      if (d.split) {
        const child = e.boss ? 'slime' : 'minislime';
        for (let i = 0; i < d.split; i++) {
          const a = (i / d.split) * Math.PI * 2;
          spawnEnemy(child, clampX(e.x + Math.cos(a) * e.r * 0.8, e), e.y + Math.sin(a) * e.r * 0.6, e.lane, e.hpMul * (e.boss ? 1.4 : 1), { tx: null });
        }

      if (e === S.boss) { S.bossDown = true; emit('bossDown', { enemy: e }); }
    }
    function clampX(x, e) {
      if (e.y > stage.layout.mergeY) { const l = laneRange(e.lane); return Math.max(l.x0 + e.r * 0.5, Math.min(l.x1 - e.r * 0.5, x)); }
      return Math.max(0.2, Math.min(W - 0.2, x));
    }

    // ---- ゲート ----
    function applyGate(g) {
      const def = cfg.gates[g.id], v = g.value, M = S.mods, cap = cfg.cap;
      switch (g.id) {
        case 'heroes': { const types = S.heroes.map(h => h.type); for (let i = 0; i < v; i++) addHero(types.length ? types[Math.floor(rng() * types.length) % types.length] : cfg.starterHero, 1); break; }
        case 'atkspd': M.rate = Math.min(cap.atkspd, M.rate * v); break;
        case 'atk': M.atk = Math.min(cap.atk, M.atk * v); break;
        case 'pierce': M.pierce = Math.min(cap.pierce, M.pierce + v); break;
        case 'multi': M.multi = Math.min(cap.multi, M.multi + v); break;
        case 'pspeed': M.pspeed = Math.min(cap.pspeed, M.pspeed * v); break;
        case 'big': M.big = Math.min(cap.big, M.big * v); break;
        case 'crit': M.crit = Math.min(cap.crit, M.crit + v); break;
        case 'wpn': M.wpn[g.wpn] = Math.min(8, (M.wpn[g.wpn] || 1) * v); break;
        case 'ammo': M.ammo += v; break;
        case 'heal': S.baseHp = Math.min(S.baseMax, S.baseHp + Math.round(S.baseMax * v / 100)); break;
        case 'barrier': S.barrier += v; break;
        case 'fever': { const mine = [...owned()]; for (const row of S.board) for (let c = 0; c < COLS; c++) row[c] = { w: mine[Math.floor(rng() * mine.length) % mine.length], off: 0 }; break; }
        case 'slow': M.slow = Math.max(cap.slow, M.slow * v); break;
        case 'thunder': for (const e of S.enemies) if (!e.dead) damageEnemy(e, e.maxHp * (e.boss ? 0.06 : 0.4), null); emit('thunder', {}); break;
        case 'evolve': { const c = S.heroes.filter(h => h.tier < cfg.hero.maxTier); if (c.length) { const h = c[Math.floor(rng() * c.length) % c.length]; h.tier++; emit('evolve', { hero: h }); } break; }
        case 'coin': S.coins += v; break;
        case 'atkDown': M.atk = Math.max(0.3, M.atk * v); break;
        case 'spdDown': M.rate = Math.max(0.3, M.rate * v); break;
        case 'horde': {
          const pool = cfg.enemyOrder.filter(k => cfg.enemies[k].from <= Math.max(1, stage.n || 9));
          const l = stage.layout.lanes.length;
          for (let i = 0; i < v; i++) {
            const lane = Math.floor(rng() * l) % l, lr = laneRange(lane);
            spawnEnemy(pool[Math.floor(rng() * pool.length) % pool.length], lr.x0 + 0.3 + rng() * (lr.x1 - lr.x0 - 0.6), cfg.world.spawnY + rng() * 1.2, lane, g.hpMul || hpNow());
          }
          break;
        }
        case 'haste': M.slow = Math.min(cap.haste, M.slow * v); break;
        case 'loseHero': if (S.heroes.length > 1) { const h = S.heroes.filter(x => !x.drag).sort((a, b) => a.tier - b.tier)[0]; if (h) { S.heroes.splice(S.heroes.indexOf(h), 1); emit('heroLost', { hero: h }); } } break;
      }
      S.stats.gates++;
      emit('gate', { gate: g, def });
    }
    function hpNow() {
      // わなのゲートで湧く敵の強さ: 直前の群れと同じ
      for (let i = S.evIndex - 1; i >= 0; i--) if (stage.events[i] && stage.events[i].kind === 'wave') return stage.events[i].hpMul;
      return 1;
    }

    // ---- 檻 ----
    function placeCages(dt) {
      for (let s = 0; s < S.slots.length; s++) {
        if (S.slots[s]) continue;
        if (S.cageIndex >= stage.cages.length) return;
        S.cageDelay -= dt;
        if (S.cageDelay > 0) return;
        const c = stage.cages[S.cageIndex++];
        const sl = stage.layout.slots[s];
        S.slots[s] = { id: nextId++, ...c, maxHp: c.hp, slot: s, x0: sl.x0, x1: sl.x1, y0: sl.y0, y1: sl.y1, flash: 0, born: S.t };
        S.cages.push(S.slots[s]);
        S.cageDelay = 2.5;
      }
    }
    function freeCage(c) {
      S.slots[c.slot] = null;
      S.cages.splice(S.cages.indexOf(c), 1);
      S.stats.cagesFreed++;
      S.choice = { hero: c.hero, tier: c.tier, canJoin: S.heroes.length < cfg.hero.maxHeroes, canEvolve: S.heroes.some(h => h.tier < cfg.hero.maxTier) };

    // ---- 当たり判定 ----
    function hitRect(p, x0, x1, y0, y1) { return p.x + p.r > x0 && p.x - p.r < x1 && p.y + p.r > y0 && p.y - p.r < y1; }

      for (const e of S.enemies) if (!e.dead && !e.hidden && Math.hypot(e.x - x, e.y - y) < p.aoe + e.r) damageEnemy(e, p.dmg * p.aoeDmg, p);

        if (best) { p.bounce--; const sp = Math.hypot(p.vx, p.vy); p.vx = (best.x - p.x) / bd * sp; p.vy = (best.y - p.y) / bd * sp; return; }
      }

        if (!p.hit.includes(c.id) && hitRect(p, c.x0, c.x1, c.y0, c.y1)) {
          c.hp -= p.dmg; c.flash = 0.1; S.stats.dmg += p.dmg;
          emit('hitCage', { cage: c, dmg: p.dmg, x: p.x, y: p.y });
          p.hit.push(c.id); p.dead = true;
          if (c.hp <= 0) freeCage(c);
          return;
        }
      }
      for (const g of S.gates) {
        if (!g.dead && !p.hit.includes(g.id) && hitRect(p, g.x0, g.x1, g.y - cfg.gate.h / 2, g.y + cfg.gate.h / 2)) {
          g.hp -= p.dmg; g.flash = 0.1;
          emit('hitGate', { gate: g, dmg: p.dmg, x: p.x, y: p.y });
          if (g.hp <= 0) { g.dead = true; applyGate(g); }
          p.hit.push(g.id); p.dead = true;
          return;
        }
      }
      for (const e of S.enemies) {
        if (e.dead || e.hidden || p.hit.includes(e.id)) continue;
        const dx = e.x - p.x, dy = e.y - p.y, rr = e.r + p.r;
        if (dx * dx + dy * dy < rr * rr) {
          if (p.aoe) { p.hit.push(e.id); explode(p, p.x, p.y); p.dead = true; return; }

        }
      }
    }
    function walled(p) {
      // 檻の部屋の壁は弾を止めない（檻が空でも奥へ抜ける）。通路の外へ出たら消す
      return p.x < -0.3 || p.x > W + 0.3 || p.y > cfg.world.fieldTop + 0.8 || p.y < -1;
    }

    // ---- 時間を進める ----
    function update(dt) {
      if (S.phase !== 'play') return;
      S.t += dt;

      // 出来事
      if (stage.endless) while (stage.generatedTo < S.t + 30) stage.more();
      while (S.evIndex < stage.events.length && stage.events[S.evIndex].t <= S.t) {
        const ev = stage.events[S.evIndex++];
        if (ev.kind === 'wave') spawnWave(ev);
        else if (ev.kind === 'gate') spawnGate(ev);
        else if (ev.kind === 'boss') spawnBoss(ev);
      }
      placeCages(dt);

      // 盤面
      S.shiftT -= dt;
      if (S.shiftT <= 0) { S.shiftT += cfg.board.shiftEvery; shiftBoard(); }
      settleBoard(dt);

      // 英雄
      for (const h of S.heroes) {
        h.anim = Math.max(0, h.anim - dt);
        if (!h.drag) {
          // 置いてある英雄は足元と、まわり（idleReach マス）の得意武器を拾う
          if (!tryPickup(h, h.col, h.row)) {
            const R = cfg.hero.idleReach;
            out: for (let dr = -R; dr <= R; dr++) for (let dc = -R; dc <= R; dc++) if ((dr || dc) && tryPickup(h, h.col + dc, h.row + dr)) break out;
          }
        }
        else tryPickup(h, Math.floor(h.x), Math.floor(h.y));
        h.cool -= dt;
        if (h.cool <= 0 && h.ammo.length) {
          throwFrom(h);
          h.cool = cfg.weapons[cfg.heroes[h.type].weapon].every / rate(h);

<script id="mgr-legion-bot">
/**
 * 自動で遊ぶボット（純粋）。人と同じ操作（grab → dragTo → release / choose）だけで遊ぶ。
 * バランスの測定（tools/measure.mjs）とロジックテストで使う。
 *   const bot = L.createBot(cfg, sim, rng, { skill })   skill 0〜1: 1 ほど判断が速く、わなのゲートを避ける
 *   bot.step(dt)

(function (G) {
  const L = G.MGR.Legion;

  L.createBot = function (cfg, sim, rng, { skill = 1 } = {}) {
    const S = sim.S;
    let task = null, think = 0, rr = 0;
    const speed = cfg.hero.dragSpeedBot;

    /** 支援役の撃つ列: 射程に入ったよいゲート → 檻。どちらも無ければ null */
    function supportCol() {
      const reach = cfg.world.leakY + cfg.hero.range - 1;
      const g = S.gates.filter(x => x.kind === 'good' && x.y < reach).sort((a, b) => a.y - b.y)[0];
      if (g) return Math.max(0, Math.min(4, Math.floor((g.x0 + g.x1) / 2)));
      const c = S.cages[0];
      return c ? Math.max(0, Math.min(4, Math.floor((c.x0 + c.x1) / 2))) : null;
    }
    /** 撃つ列: 一番近い敵の列。敵が遠ければ檻 → よいゲート */
    function wantCol() {
      let near = null;
      for (const e of S.enemies) if (!e.hidden && (!near || e.y < near.y)) near = e;
      const badCol = c => skill > 0.5 && S.gates.some(g => g.kind === 'bad' && g.x0 < c + 0.85 && g.x1 > c + 0.15 &&
        !S.enemies.some(e => e.y < g.y && Math.abs(e.x - (c + 0.5)) < 0.5));
      const cands = [];
      if (near && near.y < 15) cands.push(Math.floor(near.x));
      for (const g of S.gates) if (g.kind === 'good') cands.push(Math.floor((g.x0 + g.x1) / 2));
      for (const c of S.cages) cands.push(Math.floor((c.x0 + c.x1) / 2));
      if (near) cands.push(Math.floor(near.x));

      for (let c = 0; c < 5; c++) if (!badCol(c)) return c;

    function nearestWeapon(h, col) {
      const w = cfg.heroes[h.type].weapon;
      let best = null, bd = 1e9;
      for (let r = 0; r < cfg.board.rows; r++) for (let c = 0; c < cfg.board.cols; c++) {
        const it = S.board[r][c];

    }

    function plan() {
      // 合体できる組があれば重ねる
      for (const a of S.heroes) for (const b of S.heroes) {

          return { id: a.id, x: b.col + 0.5, y: b.row + 0.5 };
        }

      if (!S.heroes.length) return null;

      const order = S.heroes.slice().sort((a, b) => a.ammo.length - b.ammo.length);

      const t = nearestWeapon(h, col);
      if (!t) return { id: h.id, x: col + 0.5, y: h.y };

    }

    function step(dt) {
      if (S.phase === 'choice') {
        const ch = S.choice;
        const top = S.heroes.filter(h => h.tier < cfg.hero.maxTier).sort((a, b) => b.tier - a.tier)[0];
        if (ch.canJoin && (S.heroes.length < 8 || !top)) sim.choose('join');

    }
    return { step };
  };

</script>

})();

// 遠近法（ワールド座標 ↔ 画面座標）。奥（y が大きい）ほど小さく、上に描く
const View = (() => {
  const V = CFG.view;
  const cx = V.w / 2;
  const z = y => y + V.z0;
  return {
    W: V.w, H: V.h,
    sx: (x, y) => cx + (x - CFG.world.W / 2) * V.B / z(y),
    sy: y => V.horizon + V.A / z(y),
    /** その奥行きで、ワールド1単位が何ピクセルか */
    scale: y => V.B / z(y),
    /** 画面座標 → ワールド座標 */
    toWorld(px, py) {
      const zz = V.A / Math.max(1, py - V.horizon);
      return { x: (px - cx) * zz / V.B + CFG.world.W / 2, y: zz - V.z0 };
    }
  };
})();

// ---- src/game/05-fx.js ----
// 演出（画面座標）。控えめ・軽さ優先: 数に上限をつけ、古いものから捨てる
const FX = (() => {
  let parts = [], texts = [], rings = [];
  const MAXP = CFG.fx.maxParticles, MAXT = CFG.fx.maxTexts;
  function push(arr, o, max) { if (arr.length >= max) arr.shift(); arr.push(o); }
  function bones(x, y, s, n = 6) {
    for (let i = 0; i < n; i++) push(parts, { k: 'bone', x, y, vx: rand(-260, 260) * s, vy: rand(-520, -160) * s, g: 1300 * s, a: rand(6.28), va: rand(-12, 12), life: rand(0.5, 0.8), t: 0, s: s * rand(0.7, 1.1) }, MAXP);
    push(parts, { k: 'puff', x, y, life: 0.35, t: 0, s }, MAXP);
  }
  function shards(x, y, s, color) {
    for (let i = 0; i < 14; i++) push(parts, { k: 'shard', x: x + rand(-60, 60) * s, y, vx: rand(-300, 300) * s, vy: rand(-500, -100) * s, g: 1400 * s, a: rand(6.28), va: rand(-14, 14), life: rand(0.5, 0.9), t: 0, s, color }, MAXP);
  }
  function sparkle(x, y, s, color = '#ffe37a', n = 12) {
    for (let i = 0; i < n; i++) { const a = i / n * 6.28; push(parts, { k: 'spark', x, y, vx: Math.cos(a) * 260 * s, vy: Math.sin(a) * 260 * s, g: 0, life: 0.5, t: 0, s, color }, MAXP); }
  }
  function ring(x, y, r, color = 'rgba(255,200,80,', life = 0.35) { push(rings, { x, y, r, color, life, t: 0 }, 40); }
  function text(x, y, str, { color = '#fff', size = 30, life = 0.7, vy = -90, stroke = '#2a0a3a' } = {}) { push(texts, { x, y, str, color, size, life, t: 0, vy, stroke }, MAXT); }
  function update(dt) {
    for (const p of parts) { p.t += dt; if (p.vx !== undefined) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; } if (p.va) p.a += p.va * dt; }
    parts = parts.filter(p => p.t < p.life);
    for (const t of texts) { t.t += dt; t.y += t.vy * dt; }
    texts = texts.filter(t => t.t < t.life);
    for (const r of rings) r.t += dt;
    rings = rings.filter(r => r.t < r.life);
  }
  function draw(g) {
    for (const r of rings) {
      const k = r.t / r.life;
      g.strokeStyle = r.color + (1 - k).toFixed(2) + ')'; g.lineWidth = 8 * (1 - k) + 2;
      g.beginPath(); g.ellipse(r.x, r.y, r.r * (0.4 + k * 0.8), r.r * (0.4 + k * 0.8) * 0.55, 0, 0, 7); g.stroke();
    }
    for (const p of parts) {
      const k = p.t / p.life;
      g.globalAlpha = Math.min(1, (1 - k) * 2);
      if (p.k === 'bone') {
        g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.scale(p.s, p.s);
        g.fillStyle = '#f5f0e6'; g.strokeStyle = '#6b6357'; g.lineWidth = 2;
        g.beginPath(); g.rect(-9, -2.5, 18, 5); g.arc(-10, -3, 3.5, 0, 7); g.arc(-10, 3, 3.5, 0, 7); g.arc(10, -3, 3.5, 0, 7); g.arc(10, 3, 3.5, 0, 7); g.fill(); g.stroke();
        g.restore();
      } else if (p.k === 'puff') {
        g.fillStyle = 'rgba(255,255,255,.75)'; g.beginPath(); g.arc(p.x, p.y, (14 + k * 40) * p.s, 0, 7); g.fill();
      } else if (p.k === 'shard') {
        g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.color || '#334155'; g.fillRect(-7 * p.s, -4 * p.s, 14 * p.s, 8 * p.s); g.restore();
      } else if (p.k === 'spark') {
        g.fillStyle = p.color; g.beginPath(); g.arc(p.x, p.y, 6 * p.s * (1 - k) + 1, 0, 7); g.fill();
      }
    }
    g.globalAlpha = 1;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const t of texts) {
      const k = t.t / t.life;
      g.globalAlpha = k > 0.6 ? (1 - k) / 0.4 : 1;
      const sc = k < 0.15 ? 0.6 + k / 0.15 * 0.5 : 1.1 - Math.min(0.1, k);
      g.font = `900 ${Math.round(t.size * sc)}px "M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif`;
      g.lineWidth = t.size * 0.2; g.strokeStyle = t.stroke; g.strokeText(t.str, t.x, t.y);
      g.fillStyle = t.color; g.fillText(t.str, t.x, t.y);
    }
    g.globalAlpha = 1;
  }
  function clear() { parts = []; texts = []; rings = []; }
  return { bones, shards, sparkle, ring, text, update, draw, clear, get count() { return parts.length + texts.length; } };
})();

// ---- src/game/06-render.js ----
// 1フレームぶんの絵を描く。地面・通路・盤面のマス目は地形ごとに1回だけ描いておく
const Render = (() => {
  const P = View;
  let bgCache = { id: null, img: null };
  const WD = CFG.world;
  function quad(g, x0, y0, x1, y1) {
    g.beginPath();
    g.moveTo(P.sx(x0, y0), P.sy(y0)); g.lineTo(P.sx(x1, y0), P.sy(y0));
    g.lineTo(P.sx(x1, y1), P.sy(y1)); g.lineTo(P.sx(x0, y1), P.sy(y1)); g.closePath();
  }
  function seeded(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return s / 2147483647; }; }

  function buildBg(layoutId) {
    const c = document.createElement('canvas'); c.width = P.W; c.height = P.H;
    const g = c.getContext('2d');
    const layout = L.Stage.layout(layoutId);
    // 草
    const gr = g.createLinearGradient(0, 0, 0, P.H); gr.addColorStop(0, '#5fb83a'); gr.addColorStop(1, '#3f9a2a');
    g.fillStyle = gr; g.fillRect(0, 0, P.W, P.H);
    const r = seeded(7);
    for (let i = 0; i < 2600; i++) {
      const x = r() * P.W, y = r() * P.H, h = 6 + r() * 10 * (0.4 + y / P.H);
      g.strokeStyle = r() < 0.5 ? 'rgba(30,90,20,.35)' : 'rgba(170,230,110,.35)';
      g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (r() - 0.5) * 4, y - h); g.stroke();
    }
    const top = WD.fieldTop + 14;
    // 外側の石垣
    for (const [a, b] of [[-0.55, -0.05], [WD.W + 0.05, WD.W + 0.55]]) {
      g.fillStyle = '#6b6f7a'; quad(g, a, 0, b, top); g.fill();
      for (let y = 0; y < top; y += 0.9) {
        g.fillStyle = (Math.round(y / 0.9) % 2) ? '#8b909c' : '#7a7f8b';
        quad(g, a + 0.05, y + 0.05, b - 0.05, y + 0.85); g.fill();
      }
    }
    // 通路
    g.fillStyle = '#a3a39e'; quad(g, -0.05, 0, WD.W + 0.05, top); g.fill();
    for (let i = 0; i < 900; i++) {
      const y = WD.leakY + r() * (top - WD.leakY), x = r() * WD.W;
      g.fillStyle = r() < 0.5 ? 'rgba(0,0,0,.05)' : 'rgba(255,255,255,.06)';
      const s = P.scale(y) * 0.06; g.fillRect(P.sx(x, y), P.sy(y), s * 2, s);
    }
    // 檻の部屋（壁で囲った区画）
    for (const rm of layout.rooms) {
      g.fillStyle = '#b8b8b2'; quad(g, rm.x0, rm.y0, rm.x1, top); g.fill();
      const wl = 0.12;
      g.fillStyle = '#7d6a5c';
      if (rm.x0 > 0.01) { quad(g, rm.x0, rm.y0, rm.x0 + wl, top); g.fill(); }
      if (rm.x1 < WD.W - 0.01) { quad(g, rm.x1 - wl, rm.y0, rm.x1, top); g.fill(); }
      quad(g, rm.x0, rm.y0, rm.x1, rm.y0 + wl * 2); g.fill();
      g.fillStyle = '#9a8676';
      for (let x = rm.x0; x < rm.x1 - 0.05; x += 0.5) { quad(g, x + 0.03, rm.y0 + 0.02, Math.min(rm.x1, x + 0.47), rm.y0 + wl * 2 - 0.03); g.fill(); }
    }
    // 盤面（黄色の市松）
    for (let row = 0; row < CFG.board.rows; row++) for (let col = 0; col < CFG.board.cols; col++) {
      g.fillStyle = (row + col) % 2 ? '#e2b33c' : '#d4a32c';
      quad(g, col, row, col + 1, row + 1); g.fill();
      g.strokeStyle = 'rgba(120,80,0,.35)'; g.lineWidth = 2; g.stroke();
    }
    g.strokeStyle = '#a77a12'; g.lineWidth = 4; quad(g, 0, 0, WD.W, CFG.board.rows); g.stroke();
    return c;
  }

  const font = (px, w = 900) => `${w} ${Math.round(px)}px "M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif`;
  function outlined(g, str, x, y, px, fill = '#fff', stroke = '#1b1030') {
    g.font = font(px); g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = px * 0.22; g.strokeStyle = stroke; g.strokeText(str, x, y);
    g.fillStyle = fill; g.fillText(str, x, y);
  }
  function shadow(g, x, y, s, w = 0.36) {
    g.fillStyle = 'rgba(0,0,0,.22)'; g.beginPath(); g.ellipse(P.sx(x, y), P.sy(y), w * s, w * s * 0.35, 0, 0, 7); g.fill();
  }
  /** スプライトを足元 (x, y) に置く。size はワールド単位 */
  function sprite(g, img, x, y, size, { alpha = 1, rot = 0, lift = 0 } = {}) {
    const s = P.scale(y), px = size * s;
    const sx = P.sx(x, y), sy = P.sy(y) - px * 0.38 - lift * s;
    g.globalAlpha = alpha;
    if (rot) { g.save(); g.translate(sx, sy); g.rotate(rot); g.drawImage(img, -px / 2, -px / 2, px, px); g.restore(); }
    else g.drawImage(img, sx - px / 2, sy - px / 2, px, px);
    g.globalAlpha = 1;
  }
  const flashCache = new Map();
  function flashOf(img) {
    if (flashCache.has(img)) return flashCache.get(img);
    const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0); g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(255,255,255,.85)'; g.fillRect(0, 0, c.width, c.height);
    flashCache.set(img, c); return c;
  }

  function gateText(gt) {
    const d = CFG.gates[gt.id];
    let v = '';
    if (d.fmt === 'x') v = '×' + gt.value;
    else if (d.fmt === '+') v = '+' + gt.value;
    else if (d.fmt === '-') v = '-' + gt.value;
    else if (d.fmt === '+%') v = '+' + gt.value + '%';
    const label = gt.id === 'wpn' ? CFG.weapons[gt.wpn].name + 'の' + d.label : d.label;
    return [label, v];
  }
  function drawGate(g, gt) {
    const y = gt.y, s = P.scale(y);
    const xa = P.sx(gt.x0, y), xb = P.sx(gt.x1, y), base = P.sy(y), h = 0.95 * s;
    const bad = gt.kind === 'bad';
    g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(xa + 4, base - 4, xb - xa, 8);
    g.fillStyle = gt.flash > 0 ? '#ffffff' : (bad ? '#4a1620' : '#2c3344');
    g.strokeStyle = bad ? '#f87171' : '#94a3b8'; g.lineWidth = Math.max(2, s * 0.06);
    g.beginPath(); g.roundRect(xa, base - h, xb - xa, h, s * 0.08); g.fill(); g.stroke();
    // 鎖の飾り
    g.strokeStyle = bad ? 'rgba(248,113,113,.45)' : 'rgba(203,213,225,.35)'; g.lineWidth = s * 0.04;
    g.beginPath(); g.moveTo(xa + 4, base - h + 4); g.lineTo(xb - 4, base - 4); g.moveTo(xb - 4, base - h + 4); g.lineTo(xa + 4, base - 4); g.stroke();
    const [label, v] = gateText(gt);
    const fs = Math.min(s * 0.3, (xb - xa) / Math.max(4, label.length) * 1.1);
    outlined(g, label, (xa + xb) / 2, base - h * 0.66, fs, bad ? '#fecaca' : '#fff');
    if (v) outlined(g, v, (xa + xb) / 2, base - h * 0.28, s * 0.32, bad ? '#fca5a5' : '#fde68a');
    outlined(g, fmtNum(Math.max(0, gt.hp)), (xa + xb) / 2, base - h - s * 0.25, s * 0.42);
  }
  function drawCage(g, c, t) {
    const y = c.y0, s = P.scale(y);
    const drop = clamp((t - c.born) / 0.5, 0, 1);
    const w = c.x1 - c.x0, x = (c.x0 + c.x1) / 2;
    const size = Math.min(w * 1.25, 2.2);
    shadow(g, x, y + 0.6, s, size * 0.32);
    const img = Sprites.caged(c.hero, c.tier);
    sprite(g, c.flash > 0 ? flashOf(img) : img, x, y + 0.6, size, { lift: (1 - drop) * 4 });
    const top = P.sy(y + 0.6) - size * s * 0.95 - (1 - drop) * 4 * s;
    // 頭の上の飾り（段階の★）とHP
    outlined(g, '★'.repeat(c.tier), P.sx(x, y), top + s * 0.05, s * 0.22, '#ffd23f');
    outlined(g, fmtNum(Math.max(0, c.hp)), P.sx(x, y), top - s * 0.3, s * 0.55);
  }
  function drawEnemy(g, e, t) {
    const d = CFG.enemies[e.type] || CFG.bosses[e.type];
    const size = e.r * 2 * 1.45;
    const bob = Math.abs(Math.sin(t * 9 + e.wob)) * 0.06;
    shadow(g, e.x, e.y, P.scale(e.y), e.r);
    const img = Sprites.enemy(e.type, e.type === 'skeleton' && e.revived ? 1 : 0);
    sprite(g, e.flash > 0 ? flashOf(img) : img, e.x, e.y, size, { alpha: e.hidden ? 0.28 : 1, lift: bob + (d.zigzag ? 0.25 : 0) });
    if (!e.boss && e.hp < e.maxHp && e.maxHp > 60) {
      const s = P.scale(e.y), w = e.r * 1.6 * s, x = P.sx(e.x, e.y) - w / 2, y = P.sy(e.y) - size * s * 0.92;
      g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(x, y, w, 5); g.fillStyle = '#f87171'; g.fillRect(x, y, w * e.hp / e.maxHp, 5);
    }
  }
  function drawProj(g, p) {
    const img = Sprites.weapon(p.w);
    const size = Math.max(0.45, p.r * 2.4) * (p.w === 'bomb' ? 0.9 : 1);
    const rot = CFG.weapons[p.w].spin ? -p.ang : Math.atan2(p.vx, p.vy) * 1 - 0.8;
    if (p.tier >= 3 || p.crit) {
      const s = P.scale(p.y);
      g.strokeStyle = p.crit ? 'rgba(255,90,90,.5)' : (p.tier >= 4 ? 'rgba(255,215,80,.55)' : 'rgba(140,255,140,.45)');
      g.lineWidth = size * s * 0.35;
      g.beginPath(); g.moveTo(P.sx(p.x, p.y), P.sy(p.y) - size * s * 0.38); const by = p.y - p.vy * 0.05;
      g.lineTo(P.sx(p.x - p.vx * 0.05, by), P.sy(by) - size * s * 0.38); g.stroke();
    }
    sprite(g, img, p.x, p.y, size, { rot });
  }

  function draw(g, game) {
    const sim = game.sim, S = sim.S, t = S.t;
    if (bgCache.id !== S.stage.layoutId) bgCache = { id: S.stage.layoutId, img: buildBg(S.stage.layoutId) };
    g.drawImage(bgCache.img, 0, 0);

    // 奥のもの（ゲート・檻・敵・弾）を奥から順に
    const far = [];
    for (const gt of S.gates) far.push([gt.y, 0, gt]);
    for (const c of S.cages) far.push([c.y0 + 0.6, 1, c]);
    for (const e of S.enemies) far.push([e.y, 2, e]);
    for (const p of S.projs) if (p.y >= WD.leakY) far.push([p.y, 3, p]);
    far.sort((a, b) => b[0] - a[0]);
    for (const [, k, o] of far) {
      if (k === 0) drawGate(g, o); else if (k === 1) drawCage(g, o, t); else if (k === 2) drawEnemy(g, o, t); else drawProj(g, o);
    }

    // 盤面の武器
    const usable = sim.owned();
    for (let row = CFG.board.rows - 1; row >= 0; row--) for (let col = 0; col < CFG.board.cols; col++) {
      const it = S.board[row][col]; if (!it) continue;
      const y = row + 0.5 + it.off;
      if (y > CFG.board.rows) continue;
      const ok = usable.has(it.w);
      shadow(g, col + 0.5, y - 0.15, P.scale(y), 0.3);
      sprite(g, Sprites.weapon(it.w), col + 0.5, y - 0.1, 0.92, { alpha: ok ? 1 : 0.55 });
    }
    // 英雄（つかんでいる英雄は一番手前）
    const hs = S.heroes.slice().sort((a, b) => (a.drag - b.drag) || (b.y - a.y));
    for (const h of hs) {
      const s = P.scale(h.y);
      const sel = game.evolvePick && h.tier < CFG.hero.maxTier;
      if (sel) { g.strokeStyle = `rgba(255,215,80,${0.6 + Math.sin(performance.now() / 120) * 0.3})`; g.lineWidth = 6; g.beginPath(); g.ellipse(P.sx(h.x, h.y), P.sy(h.y) - 4, 0.45 * s, 0.17 * s, 0, 0, 7); g.stroke(); }
      if (h.tier >= 4) { g.fillStyle = 'rgba(255,220,100,.25)'; g.beginPath(); g.ellipse(P.sx(h.x, h.y), P.sy(h.y), 0.5 * s, 0.2 * s, 0, 0, 7); g.fill(); }
      shadow(g, h.x, h.y - 0.2, s, 0.32);
      const born = clamp((t - h.born) / 0.3, 0, 1);
      const size = (1.05 + (h.drag ? 0.12 : 0)) * (0.5 + born * 0.5) * (1 + h.anim * 0.6);
      sprite(g, Sprites.hero(h.type, h.tier), h.x, h.y - 0.25, size, { lift: h.drag ? 0.25 : 0 });
      // 持っている弾の数（小さな点）
      if (h.ammo.length) {
        const cx = P.sx(h.x, h.y), cy = P.sy(h.y - 0.25) + 6;
        for (let i = 0; i < h.ammo.length; i++) { g.fillStyle = '#ffe37a'; g.beginPath(); g.arc(cx + (i - (h.ammo.length - 1) / 2) * 10, cy, 3.5, 0, 7); g.fill(); }
      }
    }
    for (const p of S.projs) if (p.y < WD.leakY) drawProj(g, p);
    FX.draw(g);
    if (game.tutorial) drawHand(g, game.tutorial);
  }

  function drawHand(g, tut) {
    const k = (performance.now() / 1000 % 2.2) / 2.2;
    const path = tut.path;
    if (!path || path.length < 2) return;
    const seg = k * (path.length - 1), i = Math.min(path.length - 2, Math.floor(seg)), f = seg - i;
    const x = lerp(path[i].x, path[i + 1].x, f), y = lerp(path[i].y, path[i + 1].y, f);
    const px = P.sx(x, y), py = P.sy(y);
    // 指先（絵の (65, 26)）が path の点に来るように置く
    g.globalAlpha = 0.95; g.drawImage(Sprites.hand(), px - 76, py - 30, 150, 150); g.globalAlpha = 1;
    outlined(g, tut.text, P.W / 2, P.sy(CFG.board.rows) - 50, 34, '#fff');
  }

  /** ハブのサムネイル */
  function thumb(cv) {
    const g = cv.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, cv.height); gr.addColorStop(0, '#6cc444'); gr.addColorStop(1, '#3b8f2a'); g.fillStyle = gr; g.fillRect(0, 0, cv.width, cv.height);
    g.fillStyle = '#a3a39e'; g.beginPath(); g.moveTo(70, 0); g.lineTo(170, 0); g.lineTo(240, 240); g.lineTo(0, 240); g.closePath(); g.fill();
    for (let i = 0; i < 9; i++) g.drawImage(Sprites.enemy('goblin'), 120 + (i % 3) * 22, 10 + Math.floor(i / 3) * 18, 40, 40);
    g.drawImage(Sprites.caged('knight', 1), 10, 20, 100, 100);
    g.fillStyle = '#d4a32c'; g.fillRect(0, 160, 240, 80);
    for (let i = 0; i < 4; i++) g.drawImage(Sprites.weapon(['sickle', 'sword', 'staff', 'sickle'][i]), 6 + i * 58, 172, 56, 56);
    g.drawImage(Sprites.hero('reaper', 2), 70, 110, 110, 110);
  }

  return { draw, thumb, gateText, buildBg };
})();

// ---- src/game/07-input.js ----
// 指・マウスで英雄をつかんで動かす。画面座標 → ワールド座標に直して sim に渡す
const Input = (() => {
  const cv = $('cv');
  let pid = null, heroId = null;
  // 指の真下だと英雄が隠れるので、少し奥（画面の上）にずらして持つ
  const LIFT = 0.3;
  function toWorld(e) {
    const r = cv.getBoundingClientRect();
    return View.toWorld((e.clientX - r.left) / r.width * View.W, (e.clientY - r.top) / r.height * View.H);
  }
  function heroUnder(w) {
    const S = Game.sim.S;
    let best = null, bd = 0.75;
    for (const h of S.heroes) { const d = Math.hypot(h.x - w.x, (h.y - 0.3) - w.y); if (d < bd) { bd = d; best = h; } }
    return best;
  }
  cv.addEventListener('pointerdown', e => {
    Sound.init();
    if (!Game.active || pid !== null) return;
    const w = toWorld(e);
    const S = Game.sim.S;
    if (Game.evolvePick) {
      const h = heroUnder(w);
      if (h && h.tier < CFG.hero.maxTier) Game.pickEvolve(h.id);
      return;
    }
    if (S.phase !== 'play') return;
    const h = heroUnder(w);
    if (!h || !Game.sim.grab(h.id)) return;
    pid = e.pointerId; heroId = h.id;
    try { cv.setPointerCapture(pid); } catch (err) { /* 古いブラウザ */ }
    Game.sim.dragTo(heroId, w.x, w.y + LIFT);
    e.preventDefault();
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerId !== pid || !Game.active) return;
    const w = toWorld(e);
    Game.sim.dragTo(heroId, w.x, w.y + LIFT);
    e.preventDefault();
  });
  function end(e) {
    if (e.pointerId !== pid) return;
    if (Game.active && Game.sim) Game.onRelease(Game.sim.release(heroId));
    pid = null; heroId = null;
  }
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  /** 一時停止やリタイアのときに、つかんだままの英雄を離す */
  function drop() { if (pid !== null && Game.sim) Game.sim.release(heroId); pid = null; heroId = null; }
  return { drop, get dragging() { return heroId; } };
})();

// ---- src/game/08-game.js ----
// 1回のプレイ（ステージ / エンドレス）を進める。sim の出来事を音・演出・HUD に変える
const Game = (() => {
  const G = {
    active: false, sim: null, stage: null, mode: 'stage', diff: 'normal', n: 1,
    speed: 1, autobot: false, bot: null, evolvePick: false, tutorial: null, over: false, acc: 0,
    lastHud: '', toastT: 0, hintsShown: {}, flash: 0
  };
  const P = View;
  const meta = () => ({ ...Store.d.legion.upgrades, unlocked: Object.keys(Store.d.legion.dex) });

  G.start = function ({ mode = 'stage', n = 1, diff = 'normal' }) {
    Sound.init();
    G.mode = mode; G.n = n; G.diff = diff;
    G.stage = mode === 'endless' ? L.Stage.endless(CFG, diff, (Date.now() & 0xffffff) + 1) : L.Stage.build(CFG, n, diff);
    G.sim = L.createSim(CFG, { stage: G.stage, rng: Math.random, meta: meta(), emit: onEvent });
    G.bot = null; G.active = true; G.over = false; G.evolvePick = false; G.acc = 0; G.flash = 0; G.hintsShown = {};
    FX.clear();
    for (const h of G.sim.S.heroes) seen(h);
    G.tutorial = (mode === 'stage' && n === 1 && !Store.d.legion.tutorial) ? { step: 1, text: '英雄をドラッグして鎌を拾おう！', path: null, picks: 0, t: 0 } : null;
    Store.d.legion.plays++; Store.save();
    UI.toGame();
    Sound.play('battle');
    hud(true);
    toast(mode === 'endless' ? 'エンドレス開始！' : `STAGE ${n}  ${G.stage.layout.name}`, 1.6);
  };

  function seen(h) {
    const dex = Store.d.legion.dex;
    if ((dex[h.type] || 0) < h.tier) { dex[h.type] = h.tier; Store.save(); }
  }
  function at(x, y) { return [P.sx(x, y), P.sy(y)]; }
  let lastNum = 0;
  function onEvent(type, d) {
    if (!G.active) return;
    const S = G.sim.S;
    switch (type) {
      case 'pickup': Sound.pick(); if (G.tutorial && d.hero.drag) G.tutorial.picks++; break;
      case 'throw': Sound.throw(); break;
      case 'hit': {
        Sound.hit();
        const t = performance.now();
        if (d.crit || d.enemy.boss || t - lastNum > 70) {
          lastNum = t;
          const [x, y] = at(d.enemy.x, d.enemy.y);
          FX.text(x + rand(-12, 12), y - P.scale(d.enemy.y) * d.enemy.r * 2.4, fmtNum(d.dmg), { size: d.crit ? 34 : 22, color: d.crit ? '#ff6b6b' : '#fff', life: 0.55 });
        }
        break;
      }
      case 'kill': { const [x, y] = at(d.enemy.x, d.enemy.y); FX.bones(x, y - 20, P.scale(d.enemy.y) / 100 * (d.enemy.boss ? 2.4 : 1), d.enemy.boss ? 24 : 5); Sound.kill(); break; }
      case 'boom': { const [x, y] = at(d.x, d.y); FX.ring(x, y, d.r * P.scale(d.y), 'rgba(255,170,60,'); Sound.boom(); break; }
      case 'hitGate': Sound.hit(); break;
      case 'hitCage': Sound.cageHit(); break;
      case 'gate': {
        const g = d.gate, good = g.kind === 'good';
        const [x, y] = at((g.x0 + g.x1) / 2, g.y);
        FX.shards(x, y - 30, P.scale(g.y) / 100, good ? '#334155' : '#7f1d1d');
        const [label, v] = Render.gateText(g);
        FX.text(P.W / 2, P.H * 0.42, `${label} ${v}`.trim(), { size: 46, color: good ? '#fde68a' : '#fca5a5', life: 1.2, vy: -30 });
        Sound.gate(good);
        if (g.id === 'thunder') { G.flash = 0.35; Sound.thunder(); }
        break;
      }
      case 'cage': { const c = d.cage; const [x, y] = at((c.x0 + c.x1) / 2, c.y0); FX.sparkle(x, y - 60, 1.4, '#fde68a', 18); Sound.cage(); break; }
      case 'choice': UI.openChoice(d); break;
      case 'merge': case 'evolve': {
        const h = d.hero; const [x, y] = at(h.x, h.y);
        FX.sparkle(x, y - 40, 1.2); FX.ring(x, y, 70);
        FX.text(x, y - 110, `${'★'.repeat(h.tier)} ${CFG.heroes[h.type].names[h.tier - 1]}`, { size: 30, color: '#ffe37a', life: 1.1, vy: -50 });
        Sound.merge(); seen(h);
        break;
      }
      case 'join': { const h = d.hero; seen(h); if (S.t > 0.1) { const [x, y] = at(h.x, h.y); FX.sparkle(x, y - 40, 1, '#a7f3d0'); Sound.join(); } break; }
      case 'heroLost': toast('英雄が1体いなくなった…', 1.4); break;
      case 'leak': { Sound.leak(); FX.text(P.W / 2 + rand(-80, 80), P.sy(CFG.world.leakY) - 20, '-' + (d.enemy.boss ? 'ALL' : d.enemy.leak), { color: '#ff5b5b', size: 32 }); G.flash = Math.max(G.flash, 0.12); break; }
      case 'barrier': Sound.barrier(); FX.text(P.W / 2, P.sy(CFG.world.leakY) - 20, 'ガード!', { color: '#7dd3fc', size: 30 }); break;
      case 'spawnBoss': Sound.boss(); Sound.play('boss'); toast(`ボス出現！ ${CFG.bosses[d.enemy.type].name}`, 2); break;
      case 'bossDown': toast('ボス撃破！', 1.5); break;
      case 'revive': { const [x, y] = at(d.enemy.x, d.enemy.y); FX.text(x, y - 50, '復活!', { size: 22, color: '#93c5fd' }); break; }
      case 'win': setTimeout(() => finish(true), 700); break;
      case 'lose': setTimeout(() => finish(false), 500); break;
    }
  }

  G.onRelease = function (res) {
    if (res === 'merge' && G.tutorial) G.hintsShown.merge = true;
  };
  G.choose = function (kind) {
    if (kind === 'evolve') { G.evolvePick = true; UI.closeChoice(true); return; }
    G.sim.choose('join'); UI.closeChoice();
  };
  G.pickEvolve = function (id) {
    if (G.sim.choose('evolve', id)) { G.evolvePick = false; UI.closeChoice(); }
  };
  G.cancelEvolve = function () { G.evolvePick = false; UI.openChoice(G.sim.S.choice); };

  function finish(win) {
    if (!G.active || G.over) return;
    G.over = true;
    Input.drop();
    const S = G.sim.S, d = Store.d, lg = d.legion;
    const stars = win ? G.sim.stars() : 0;
    const rw = L.reward(CFG, G.stage, S, stars, lg.upgrades);
    d.coins += rw.total;
    let record = false;
    if (G.mode === 'stage' && win) {
      lg.cleared[G.diff] = Math.max(lg.cleared[G.diff], G.n);
      lg.stars[G.diff][G.n] = Math.max(lg.stars[G.diff][G.n] || 0, stars);
    }
    if (G.mode === 'endless') {
      const b = lg.best[G.diff];
      if (!b || S.wave > b.wave || (S.wave === b.wave && S.kills > b.kills)) { lg.best[G.diff] = { wave: S.wave, kills: S.kills }; record = true; }
    }
    if (G.n === 1 && G.mode === 'stage') lg.tutorial = true;
    Store.save();
    if (win) Sound.win(); else Sound.lose();
    Sound.play('menu');
    UI.openResult({ win, stars, rw, S, mode: G.mode, n: G.n, record });
  }
  G.quit = function () { Input.drop(); G.active = false; G.sim = null; G.evolvePick = false; FX.clear(); Sound.play('menu'); };
  G.togglePause = function (on) { if (!G.sim) return; Input.drop(); G.sim.pause(on); };

  let toastTimer = null;
  function toast(text, sec = 1.5) {
    const el = $('toast'); el.textContent = text; show(el, true);
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
    clearTimeout(toastTimer); toastTimer = setTimeout(() => show(el, false), sec * 1000);
  }
  G.toast = toast;

  function hud(force) {
    const S = G.sim.S;
    const title = G.mode === 'endless' ? `エンドレス  WAVE ${S.wave}` : `STAGE ${G.n}  ${CFG.difficulty[G.diff].name}`;
    const M = S.mods;
    const buffs = [];
    if (M.atk !== 1) buffs.push([`攻撃力 ×${+M.atk.toFixed(2)}`, M.atk < 1]);
    if (M.rate !== 1) buffs.push([`攻撃速度 ×${+M.rate.toFixed(2)}`, M.rate < 1]);
    if (M.pierce) buffs.push([`貫通 +${M.pierce}`]);
    if (M.multi) buffs.push([`弾数 +${M.multi}`]);
    if (M.crit) buffs.push([`会心 ${M.crit}%`]);
    if (M.pspeed !== 1) buffs.push([`弾速 ×${+M.pspeed.toFixed(2)}`]);
    if (M.big !== 1) buffs.push([`弾の大きさ ×${+M.big.toFixed(2)}`]);
    if (M.ammo) buffs.push([`持てる弾 +${M.ammo}`]);
    if (M.slow !== 1) buffs.push([`敵の速さ ×${+M.slow.toFixed(2)}`, M.slow > 1]);
    for (const w in M.wpn) buffs.push([`${CFG.weapons[w].name} ×${M.wpn[w]}`]);
    if (S.barrier) buffs.push([`バリア ${S.barrier}`]);
    const boss = S.boss && !S.bossDown ? `${Math.ceil(Math.max(0, S.boss.hp))}` : '';
    const key = [title, S.baseHp, S.baseMax, S.coins, buffs.join(), boss].join('|');
    if (!force && key === G.lastHud) return;
    G.lastHud = key;
    $('hudTitle').textContent = title;
    const r = S.baseHp / S.baseMax;
    $('hpFill').style.width = (r * 100) + '%'; $('hpFill').classList.toggle('low', r < 0.35);
    $('hpText').textContent = `拠点 ${Math.ceil(S.baseHp)} / ${S.baseMax}`;
    $('hudCoins').textContent = fmtNum(S.coins);
    $('buffs').innerHTML = buffs.map(([t, bad]) => `<span class="${bad ? 'bad' : ''}">${t}</span>`).join('');
    show('bossBar', !!boss);
    if (boss) { $('bossName').textContent = CFG.bosses[S.boss.type].name; $('bossFill').style.width = (S.boss.hp / S.boss.maxHp * 100) + '%'; }
  }

  function tutorialStep(dt) {
    const tu = G.tutorial; if (!tu) return;
    const S = G.sim.S;
    tu.t += dt;
    if (tu.step === 1) {
      if (!tu.path || tu.t > 2.2) {
        tu.t = 0;
        const h = S.heroes[0];
        const pts = [{ x: h.x, y: h.y - 0.3 }];
        const cells = [];
        for (let r = 0; r < CFG.board.rows; r++) for (let c = 0; c < CFG.board.cols; c++) if (S.board[r][c] && S.board[r][c].w === CFG.heroes[h.type].weapon) cells.push({ x: c + 0.5, y: r + 0.2, d: Math.hypot(c + 0.5 - h.x, r + 0.5 - h.y) });
        cells.sort((a, b) => a.d - b.d);
        tu.path = pts.concat(cells.slice(0, 3));
      }
      if (tu.picks >= 6) { tu.step = 2; tu.path = null; toast('武器は英雄の真上に飛ぶよ！', 2.2); }
    } else if (tu.step === 2) {
      if (S.cages.length && !G.hintsShown.cage) { G.hintsShown.cage = true; toast('檻の数字を0にすると英雄を解放！', 2.5); }
      const pair = S.heroes.some(a => S.heroes.some(b => a !== b && a.type === b.type && a.tier === b.tier));
      if (pair && !G.hintsShown.mergeHint) { G.hintsShown.mergeHint = true; toast('同じ英雄を重ねると合体して進化！', 2.6); }
      if (S.gates.length && !G.hintsShown.gate) { G.hintsShown.gate = true; toast('ゲートを壊すとパワーアップ！', 2.2); }
    }
  }

  G.frame = function (dt, g) {
    if (!G.sim) return;
    const S = G.sim.S;
    if (G.active && !G.over) {
      G.acc += Math.min(dt, 0.1) * G.speed;
      const step = 1 / 60;
      let n = 0;
      while (G.acc >= step && n < 240) {
        if (G.autobot) { if (!G.bot) G.bot = L.createBot(CFG, G.sim, Math.random, { skill: 0.9 }); G.bot.step(step); }
        G.sim.update(step); G.acc -= step; n++;
        if (S.phase !== 'play') { G.acc = 0; break; }
      }
      // ボット（テスト用）が2択を選んだら、開いている画面を閉じる
      if (S.phase === 'play' && (!$('choice').classList.contains('hidden') || G.evolvePick)) { G.evolvePick = false; UI.closeChoice(); }
      tutorialStep(dt);
      hud(false);
    }
    FX.update(dt);
    Render.draw(g, G.tutorial && G.tutorial.step === 1 ? { ...G, tutorial: G.tutorial } : { ...G, tutorial: null });
    if (G.flash > 0) { g.fillStyle = `rgba(255,255,255,${Math.min(0.6, G.flash * 2)})`; g.fillRect(0, 0, P.W, P.H); G.flash -= dt; }
  };
  return G;
})();

// ---- src/game/09-ui.js ----
// 画面（ハブ・メニュー・強化・図鑑・設定・2択・結果）
const UI = (() => {
  const U = { screen: 'hub' };
  const lg = () => Store.d.legion;
  const SCREENS = ['hub', 'lmenu', 'hud'];
  function only(id) { for (const s of SCREENS) show(s, s === id); U.screen = id === 'hud' ? 'game' : id; }
  function coins() { for (const id of ['hubCoins', 'lmCoins', 'upCoins']) $(id).textContent = fmtNum(Store.d.coins); }

  U.toHub = () => { only('hub'); coins(); };
  U.toMenu = () => { only('lmenu'); coins(); renderMenu(); };
  U.toGame = () => { only('hud'); for (const p of ['pause', 'result', 'choice', 'upPanel', 'dexPanel', 'setPanel']) show(p, false); show('evolveHint', false); };

  function renderMenu() {
    const d = lg();
    for (const b of $('diffTabs').children) b.classList.toggle('on', b.dataset.diff === d.diff);
    for (const b of $('modeTabs').children) b.classList.toggle('on', b.dataset.mode === d.mode);
    show('stagePane', d.mode === 'stage'); show('endlessPane', d.mode === 'endless');
    const cleared = d.cleared[d.diff], stars = d.stars[d.diff];
    const total = Object.values(stars).reduce((a, b) => a + b, 0);
    $('stageSummary').textContent = `クリア ${cleared} / ${CFG.stage.count}　★ ${total} / ${CFG.stage.count * 3}`;
    const grid = $('stageGrid');
    let html = '';
    for (let n = 1; n <= CFG.stage.count; n++) {
      const st = stars[n] || 0;
      const cls = n <= cleared ? 'clear' : n === cleared + 1 ? 'next' : 'lock';
      html += `<button type="button" class="${cls}" data-n="${n}" ${cls === 'lock' ? 'disabled' : ''}>${n}<span class="st">${n <= cleared ? '★'.repeat(st) + '☆'.repeat(3 - st) : ''}</span></button>`;
    }
    grid.innerHTML = html;
    const next = grid.querySelector('.next');
    if (next) next.scrollIntoView({ block: 'center' });
    const b = d.best[d.diff];
    $('endlessBest').textContent = b ? `最高記録: WAVE ${b.wave}・${b.kills}体撃破` : '最高記録: まだなし';
  }

  // ---- 強化 ----
  function renderUp() {
    const ups = lg().upgrades;
    $('upList').innerHTML = CFG.upgradeOrder.map(k => {
      const u = CFG.upgrades[k], lv = ups[k] || 0, cost = L.upgradeCost(CFG, k, lv);
      const max = lv >= u.max;
      return `<div class="up"><div class="nm"><b>${u.name}</b><small>${u.desc}</small></div><span class="lv">Lv ${lv}/${u.max}</span>
        <button class="btn" type="button" data-up="${k}" ${max || cost > Store.d.coins ? 'disabled' : ''}>${max ? 'MAX' : '<span>🪙 ' + fmtNum(cost) + '</span>'}</button></div>`;
    }).join('');
    coins();
  }
  $('upList').addEventListener('click', e => {
    const b = e.target.closest('[data-up]'); if (!b) return;
    const k = b.dataset.up, ups = lg().upgrades, lv = ups[k] || 0, cost = L.upgradeCost(CFG, k, lv);
    if (cost > Store.d.coins) return;
    Store.d.coins -= cost; ups[k] = lv + 1; Store.save(); Sound.buy(); renderUp();
  });

  // ---- 図鑑 ----
  function renderDex() {
    const dex = lg().dex;
    let n = 0, cells = '';
    for (const type of CFG.heroOrder) for (let t = 1; t <= CFG.hero.maxTier; t++) {
      const ok = (dex[type] || 0) >= t; if (ok) n++;
      cells += `<div class="cell ${ok ? '' : 'unknown'}"><canvas width="96" height="96" data-h="${type}" data-t="${t}" data-ok="${ok ? 1 : 0}"></canvas><span>${ok ? CFG.heroes[type].names[t - 1] : '？？？'}</span><span>${'★'.repeat(t)}</span></div>`;
    }
    $('dexList').innerHTML = cells;
    $('dexCount').textContent = `${n} / ${CFG.heroOrder.length * CFG.hero.maxTier}`;
    for (const c of $('dexList').querySelectorAll('canvas')) {
      const g = c.getContext('2d');
      g.drawImage(Sprites.hero(c.dataset.h, +c.dataset.t), 0, 0, 96, 96);
      if (c.dataset.ok !== '1') { g.globalCompositeOperation = 'source-atop'; g.fillStyle = '#111'; g.fillRect(0, 0, 96, 96); }
    }
  }

  // ---- 2択 ----
  U.openChoice = ch => {
    const c = $('choiceImg'), g = c.getContext('2d');
    g.clearRect(0, 0, 200, 200); g.drawImage(Sprites.hero(ch.hero, ch.tier), 0, 0, 200, 200);
    $('choiceName').textContent = `${'★'.repeat(ch.tier)} ${CFG.heroes[ch.hero].names[ch.tier - 1]}（${CFG.weapons[CFG.heroes[ch.hero].weapon].name}）`;
    $('chJoinSub').textContent = ch.canJoin ? '盤面に加わる' : '英雄がいっぱい';
    $('chJoin').disabled = !ch.canJoin;
    $('chEvolve').disabled = !ch.canEvolve;
    show('evolveHint', false); show('choice', true);
  };
  U.closeChoice = (pick) => { show('choice', false); show('evolveHint', !!pick); };

  // ---- 結果 ----
  U.openResult = ({ win, stars, rw, S, mode, n, record }) => {
    $('resTitle').textContent = mode === 'endless' ? (record ? '新記録！' : 'エンドレス終了') : (win ? 'STAGE CLEAR!' : '拠点が落ちた…');
    $('resStars').innerHTML = mode === 'stage' ? [1, 2, 3].map(i => i <= stars ? '<b>★</b>' : '★').join('') : '';
    const lines = [];
    if (mode === 'endless') lines.push(['到達ウェーブ', S.wave]);
    lines.push(['撃破', S.kills + '体']);
    lines.push(['撃破コイン', '🪙 ' + fmtNum(rw.kills)]);
    if (rw.clear) lines.push(['クリアボーナス', '🪙 ' + fmtNum(rw.clear)]);
    if (rw.wave) lines.push(['ウェーブボーナス', '🪙 ' + fmtNum(rw.wave)]);
    $('resLines').innerHTML = lines.map(([a, b]) => `<div><span>${a}</span><b>${b}</b></div>`).join('') + `<div class="total"><span>合計</span><b>🪙 ${fmtNum(rw.total)}</b></div>`;
    show('resNext', mode === 'stage' && win && n < CFG.stage.count);
    $('resRetry').textContent = win ? 'もう一度' : 'リトライ';
    show('result', true);
  };

  function confirm(text, yes) {
    $('confirmText').textContent = text; show('confirm', true);
    $('confirmYes').onclick = () => { show('confirm', false); yes(); };
    $('confirmNo').onclick = () => show('confirm', false);
  }
  function openSettings() {
    const s = Store.d.settings;
    $('volBgm').value = s.bgm; $('volSe').value = s.se; $('mute').checked = s.mute;
    show('setPanel', true);
  }

  // ---- ボタン ----
  onTap('openLegion', () => { Sound.init(); Sound.play('menu'); U.toMenu(); });
  onTap('hubSettings', openSettings);
  onTap('lmBack', U.toHub);
  $('diffTabs').addEventListener('click', e => { const b = e.target.closest('[data-diff]'); if (!b) return; Sound.ui(); lg().diff = b.dataset.diff; Store.save(); renderMenu(); });
  $('modeTabs').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (!b) return; Sound.ui(); lg().mode = b.dataset.mode; Store.save(); renderMenu(); });
  $('stageGrid').addEventListener('click', e => { const b = e.target.closest('[data-n]'); if (!b || b.disabled) return; Sound.ui(); Game.start({ mode: 'stage', n: +b.dataset.n, diff: lg().diff }); });
  onTap('startEndless', () => Game.start({ mode: 'endless', diff: lg().diff }));
  onTap('openUp', () => { renderUp(); show('upPanel', true); });
  onTap('upClose', () => { show('upPanel', false); coins(); });
  onTap('openDex', () => { renderDex(); show('dexPanel', true); });
  onTap('dexClose', () => show('dexPanel', false));
  onTap('openSet', openSettings);
  onTap('setClose', () => show('setPanel', false));
  for (const [id, key] of [['volBgm', 'bgm'], ['volSe', 'se']]) $(id).addEventListener('input', e => { Store.d.settings[key] = +e.target.value; Sound.apply(); Store.save(); });
  $('mute').addEventListener('change', e => { Store.d.settings.mute = e.target.checked; Sound.apply(); Store.save(); });
  onTap('resetData', () => confirm('セーブデータをすべて消しますか？（コイン・強化・図鑑も消えます）', () => { Store.reset(); Sound.apply(); show('setPanel', false); U.toHub(); }));

  onTap('pauseBtn', () => { Game.togglePause(true); show('pause', true); });
  onTap('resume', () => { show('pause', false); Game.togglePause(false); });
  onTap('retry', () => { show('pause', false); Game.quit(); Game.start({ mode: Game.mode, n: Game.n, diff: Game.diff }); });
  onTap('quit', () => { show('pause', false); Game.quit(); U.toMenu(); });
  onTap('chJoin', () => Game.choose('join'));
  onTap('chEvolve', () => Game.choose('evolve'));
  onTap('evolveCancel', () => Game.cancelEvolve());
  onTap('resNext', () => { show('result', false); Game.quit(); Game.start({ mode: 'stage', n: Game.n + 1, diff: Game.diff }); });
  onTap('resRetry', () => { show('result', false); Game.quit(); Game.start({ mode: Game.mode, n: Game.n, diff: Game.diff }); });
  onTap('resUp', () => { show('result', false); Game.quit(); U.toMenu(); renderUp(); show('upPanel', true); });
  onTap('resMenu', () => { show('result', false); Game.quit(); U.toMenu(); });

  return U;
})();

// ---- src/game/10-main.js ----
// 起動・画面サイズ合わせ・毎フレームの処理
(() => {
  Store.load();
  const app = $('app'), cv = $('cv'), g = cv.getContext('2d');
  let q = 1;
  function fit() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const s = Math.min(vw / 720, vh / 1280);
    app.style.width = Math.floor(720 * s) + 'px'; app.style.height = Math.floor(1280 * s) + 'px';
    app.style.fontSize = (24 * s) + 'px';
    // 描画の解像度。高すぎると古いスマホで重いので上限をつける
    q = clamp(s * (window.devicePixelRatio || 1), 0.5, 1.5);
    cv.width = Math.round(720 * q); cv.height = Math.round(1280 * q);
  }
  window.addEventListener('resize', fit);
  fit();
  Render.thumb($('legionThumb'));

  // メニューの後ろでは、ボットが遊ぶデモを流す（音は出さない）
  const demo = { sim: null, bot: null };
  function newDemo() {
    const stage = L.Stage.build(CFG, 3 + Math.floor(Math.random() * 8), 'easy');
    demo.sim = L.createSim(CFG, { stage, rng: Math.random, meta: { atk: 6 } });
    demo.bot = L.createBot(CFG, demo.sim, Math.random, { skill: 1 });
  }
  newDemo();

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && Game.active && Game.sim && Game.sim.S.phase === 'play' && !Game.over) { Game.togglePause(true); show('pause', true); }
  });
  window.addEventListener('pointerdown', () => Sound.init(), { once: true });

  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    g.setTransform(q, 0, 0, q, 0, 0);
    if (Game.active && Game.sim) Game.frame(dt, g);
    else {
      const S = demo.sim.S;
      for (let i = 0; i < 2; i++) { demo.bot.step(1 / 120); demo.sim.update(1 / 120); }
      if (S.phase === 'choice') demo.bot.step(0);
      if (S.phase === 'win' || S.phase === 'lose' || S.t > 200) newDemo();
      Render.draw(g, { sim: demo.sim, tutorial: null, evolvePick: false });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  UI.toHub();

  // テスト用の窓口（E2E が状態を読む・時間を早める）
  window.__MGR = {
    screen: () => UI.screen, Game, Store, L, CFG, View,
    sim: () => Game.sim,
    speed: v => { Game.speed = v; },
    bot: on => { Game.autobot = on; Game.bot = null; }
  };
})();
})();
