<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#14321a" />
<meta name="description" content="ミニゲームラッシュ — いろんなミニゲームが遊べるコレクション。1本目は武器拾いレギオン。" />
<!-- @SOURCE_HASH -->
<title>ミニゲームラッシュ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2322c55e'/%3E%3Cpath d='M9 24c0-9 6-15 15-16-4 3-7 7-7 12' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Cpath d='M16 20l-8 8' stroke='%236b46c1' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
/* @STYLE */
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" width="720" height="1280"></canvas>

  <!-- ハブ: ミニゲームを選ぶ -->
  <section id="hub" class="screen">
    <div class="hubTop">
      <div class="logo"><span class="l1">MINI GAME</span><span class="l2">ミニゲームラッシュ</span></div>
      <div class="coinTag"><i class="coinIco"></i><b id="hubCoins">0</b></div>
    </div>
    <div class="cards">
      <button class="card play" id="openLegion" type="button">
        <canvas id="legionThumb" width="240" height="240"></canvas>
        <div class="cardBody"><h2>武器拾いレギオン</h2><p>英雄をドラッグして武器を拾い、迫りくる大群を撃退！檻の英雄を助けて仲間を増やそう。</p></div>
      </button>
      <div class="card soon"><div class="soonIco">？</div><div class="cardBody"><h2>COMING SOON</h2><p>次のミニゲームを準備中…</p></div></div>
      <div class="card soon"><div class="soonIco">？</div><div class="cardBody"><h2>COMING SOON</h2><p>次のミニゲームを準備中…</p></div></div>
    </div>
    <div class="hubFoot"><button id="hubSettings" class="btn ghost" type="button">⚙ 設定</button></div>
  </section>

  <!-- 武器拾いレギオンのメニュー -->
  <section id="lmenu" class="screen hidden">
    <div class="bar">
      <button class="btn icon" id="lmBack" type="button" aria-label="もどる">◀</button>
      <h1>武器拾いレギオン</h1>
      <div class="coinTag"><i class="coinIco"></i><b id="lmCoins">0</b></div>
    </div>
    <div class="tabs" id="diffTabs">
      <button type="button" data-diff="easy">かんたん</button>
      <button type="button" data-diff="normal">ふつう</button>
      <button type="button" data-diff="hard">むずかしい</button>
    </div>
    <div class="tabs mode" id="modeTabs">
      <button type="button" data-mode="stage">ステージ</button>
      <button type="button" data-mode="endless">エンドレス</button>
    </div>
    <div id="stagePane">
      <div class="stageInfo"><span id="stageSummary"></span></div>
      <div class="grid" id="stageGrid"></div>
    </div>
    <div id="endlessPane" class="hidden">
      <div class="endlessBox">
        <p>敵は無限に押し寄せる。檻とゲートも次々に現れる。どこまで耐えられるか！</p>
        <div class="best" id="endlessBest"></div>
        <button class="btn big" id="startEndless" type="button">エンドレス開始</button>
      </div>
    </div>
    <div class="menuBtns">
      <button class="btn" id="openUp" type="button">⬆ 強化</button>
      <button class="btn" id="openDex" type="button">📖 英雄図鑑</button>
      <button class="btn" id="openSet" type="button">⚙ 設定</button>
    </div>
  </section>

  <!-- 強化 -->
  <section id="upPanel" class="panel hidden">
    <div class="panelBox">
      <div class="bar"><h1>強化</h1><div class="coinTag"><i class="coinIco"></i><b id="upCoins">0</b></div></div>
      <div id="upList" class="list"></div>
      <button class="btn" id="upClose" type="button">閉じる</button>
    </div>
  </section>

  <!-- 図鑑 -->
  <section id="dexPanel" class="panel hidden">
    <div class="panelBox">
      <div class="bar"><h1>英雄図鑑</h1><span id="dexCount" class="muted"></span></div>
      <div id="dexList" class="dex"></div>
      <button class="btn" id="dexClose" type="button">閉じる</button>
    </div>
  </section>

  <!-- 設定 -->
  <section id="setPanel" class="panel hidden">
    <div class="panelBox">
      <div class="bar"><h1>設定</h1></div>
      <label class="row">BGM<input type="range" id="volBgm" min="0" max="100" /></label>
      <label class="row">効果音<input type="range" id="volSe" min="0" max="100" /></label>
      <label class="row chk"><input type="checkbox" id="mute" /> ミュート</label>
      <button class="btn danger" id="resetData" type="button">セーブデータを消す</button>
      <button class="btn" id="setClose" type="button">閉じる</button>
    </div>
  </section>

  <!-- 遊んでいる最中 -->
  <div id="hud" class="hidden">
    <div class="hudTop">
      <button class="btn icon" id="pauseBtn" type="button" aria-label="一時停止">II</button>
      <div class="hudMid">
        <div class="hudTitle" id="hudTitle"></div>
        <div class="hpBar"><i id="hpFill"></i><span id="hpText"></span></div>
      </div>
      <div class="coinTag small"><i class="coinIco"></i><b id="hudCoins">0</b></div>
    </div>
    <div class="bossBar hidden" id="bossBar"><span id="bossName"></span><div class="bb"><i id="bossFill"></i></div></div>
    <div class="buffs" id="buffs"></div>
    <div class="toast hidden" id="toast"></div>
  </div>

  <!-- 檻の英雄を解放したときの2択 -->
  <section id="choice" class="panel hidden">
    <div class="panelBox choiceBox">
      <h1>英雄を解放した！</h1>
      <canvas id="choiceImg" width="200" height="200"></canvas>
      <div class="choiceName" id="choiceName"></div>
      <div class="choiceBtns">
        <button class="btn big" id="chJoin" type="button">仲間にする<small id="chJoinSub"></small></button>
        <button class="btn big alt" id="chEvolve" type="button">進化させる<small>自分の英雄を1体選んで★+1</small></button>
      </div>
    </div>
  </section>
  <div id="evolveHint" class="hint hidden">進化させる英雄をタップ <button class="btn small" id="evolveCancel" type="button">やめる</button></div>

  <!-- 一時停止 -->
  <section id="pause" class="panel hidden">
    <div class="panelBox">
      <h1>一時停止</h1>
      <button class="btn big" id="resume" type="button">再開</button>
      <button class="btn" id="retry" type="button">やり直す</button>
      <button class="btn" id="quit" type="button">メニューへ</button>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="panel hidden">
    <div class="panelBox">
      <h1 id="resTitle"></h1>
      <div class="stars" id="resStars"></div>
      <div class="resLines" id="resLines"></div>
      <div class="resBtns">
        <button class="btn big" id="resNext" type="button">次のステージ</button>
        <button class="btn" id="resRetry" type="button">もう一度</button>
        <button class="btn" id="resUp" type="button">強化する</button>
        <button class="btn" id="resMenu" type="button">メニューへ</button>
      </div>
    </div>
  </section>

  <div id="confirm" class="panel hidden">
    <div class="panelBox"><p id="confirmText"></p>
      <div class="resBtns"><button class="btn danger" id="confirmYes" type="button">はい</button><button class="btn" id="confirmNo" type="button">いいえ</button></div>
    </div>
  </div>
</div>
<!-- @SCRIPTS -->
</body>
</html>
